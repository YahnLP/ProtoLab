<style>
:root{--bg:#eef1f5;--panel:#fff;--panel2:#f8fafc;--ink:#1e293b;--muted:#64748b;--line:#d5dbe4;--brand:#6d28d9;--brand2:#ede9fe;--brandink:#fff;--ok:#15803d;--warn:#b45309;--err:#b91c1c;--top:#1b1140;--topbtn:#2b1d5c;--topline:#44338a;--stage:#f6f8fb;--dot:#c6cfdb;--card:#fff;--cardline:#b6c2d2;--hover:#f1f5f9;--code:#f1f5f9;
--k-net:#b45309;--k-tcp:#2563eb;--k-udp:#0d9488;--k-dns:#be185d;--k-app:#ea580c;--k-sec:#15803d;--k-bad:#dc2626;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
html[data-theme=dark]{--bg:#121722;--panel:#1a2130;--panel2:#161c29;--ink:#e6ebf2;--muted:#9aa8ba;--line:#2c3648;--brand:#a78bfa;--brand2:#2a2250;--brandink:#140c33;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;--top:#0e0a24;--topbtn:#1e1648;--topline:#38307a;--stage:#141a27;--dot:#2a3447;--card:#222b3c;--cardline:#3a4760;--hover:#222b3c;--code:#0f1420;
--k-net:#f59e0b;--k-tcp:#60a5fa;--k-udp:#2dd4bf;--k-dns:#f472b6;--k-app:#fb923c;--k-sec:#4ade80;--k-bad:#f87171}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.45 var(--sans);color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover:not(:disabled){background:var(--hover)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,.node:focus-visible,.pk-row:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
button.primary{background:var(--brand);border-color:var(--brand);color:var(--brandink)}button.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--brand)}
button:disabled{opacity:.45;cursor:default}
input[type=search],select{border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:var(--panel);min-width:0}
.mono{font-family:var(--mono)}.muted{color:var(--muted)}.small{font-size:12px}
a{color:var(--brand)}
code,.code{font-family:var(--mono);font-size:12px;background:var(--code);padding:0 4px;border-radius:3px}
/* ---- barre du haut (charte des Labs : bandeau sombre teinté) ---- */
#top{background:var(--top);color:#e2e8f0;display:flex;align-items:center;gap:14px;padding:6px 12px;flex-wrap:wrap}
#top button,#top select{background:var(--topbtn);border-color:var(--topline);color:#e2e8f0}#top button:hover{background:var(--topline)}
#top button.on{background:var(--brand);border-color:var(--brand);color:var(--brandink)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;white-space:nowrap}.brand small{font-weight:400;color:#a99fd6;margin-left:6px}
.brand svg{flex:none;color:#c4b5fd}.credit{display:block;font-size:10px;font-weight:400;color:#8f84c4;line-height:1.1}.credit a{color:#8f84c4}
.grp{display:flex;align-items:center;gap:6px}.grp label{display:flex;align-items:center;gap:5px;font-size:12px;color:#cbd5e1}
.spacer{flex:1}
#menuBtn{display:none}
/* ---- disposition ---- */
#main{flex:1;display:flex;min-height:0}
#left{width:250px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#center{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#right{width:352px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
/* ---- palette ---- */
.lhead{padding:8px;border-bottom:1px solid var(--line)}.lhead input{width:100%}
.lprog{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:11.5px;color:var(--muted)}.bar{flex:1;height:6px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
#palette{flex:1;overflow:auto;padding:6px 8px 12px}
.grph{margin:12px 2px 4px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:baseline}.grph small{font-weight:400;text-transform:none;letter-spacing:0}
.pal-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:none;padding:5px 6px;border-radius:6px}
.pal-item:hover{background:var(--hover);border-color:var(--line)}.pal-item.on{background:var(--brand2);border-color:var(--brand)}
.pal-item .nm{font-weight:600}.pal-item .fl{display:block;font-size:11.5px;color:var(--muted);line-height:1.25}
.pal-item .st{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:10px;color:#fff}
.pal-item .st.part{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}.pal-item .st.done{background:var(--ok);border-color:var(--ok)}
.pal-item .ord{flex:none;font-size:10px;color:var(--muted);width:14px;text-align:right}
.pal-empty{padding:12px;color:var(--muted)}
/* ---- scène ---- */
#steps{display:flex;gap:6px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:thin}
.stp{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:16px;padding:3px 11px 3px 4px;background:var(--panel);max-width:230px}
.stp .n{width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--ink);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.stp span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stp.cur{background:var(--brand2);border-color:var(--brand);font-weight:600}.stp.cur .n{background:var(--brand);color:var(--brandink)}
.stp.dn .n{background:var(--ok);color:#fff}
#stagewrap{flex:1;position:relative;min-height:240px;background:var(--stage);overflow:hidden}
#stage{position:absolute;inset:0}
#stage svg{width:100%;height:100%;display:block;user-select:none}
.hud{position:absolute;left:10px;top:8px;right:10px;display:flex;gap:8px;align-items:flex-start;pointer-events:none;flex-wrap:wrap}
.cap{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:7px;padding:5px 10px;max-width:min(640px,100%);box-shadow:0 1px 3px #0001;pointer-events:auto}
.cap b{font-weight:700}.cap .t{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px}
.legend{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;background:var(--panel);opacity:.95;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:11px}.legend i{display:inline-block;width:10px;height:7px;border-radius:2px;margin-right:4px}
.gap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);color:var(--bg);border-radius:20px;padding:8px 18px;font-weight:700;opacity:0;transition:opacity .4s;pointer-events:none}.gap.on{opacity:.92}
.hintbar{position:absolute;left:10px;bottom:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:11.5px;color:var(--muted)}
/* ---- noeuds (SVG) ---- */
.node{cursor:pointer}.node .card{fill:var(--card);stroke:var(--cardline);stroke-width:1.4;filter:drop-shadow(0 1px 2px #0002)}.node:hover .card{stroke:var(--muted)}
.node.act .card{stroke:var(--brand);stroke-width:2.6}.node.pov .card{stroke:var(--k-tcp);stroke-width:2.6;stroke-dasharray:5 3}
.node .nm{font-size:13px;font-weight:700;fill:var(--ink);pointer-events:none}.node .ipl{font-size:10.5px;fill:var(--muted);font-family:var(--mono);pointer-events:none}
.node .rl{font-size:10px;fill:var(--muted);pointer-events:none}
.node .gl{color:var(--ink);pointer-events:none}.node.dead .card{stroke:var(--k-bad);stroke-width:2.6}
.node.dim{opacity:.5}
.lk{stroke:var(--muted);stroke-width:2.4;opacity:.7}.lk.hot{stroke:var(--brand);opacity:1;stroke-width:3.4}
.lk.wan{stroke-dasharray:2 7;stroke-linecap:round;stroke-width:3.2}
.cloudlbl{font-size:11px;fill:var(--muted)}
.chip rect{stroke:#fff;stroke-width:1.5;filter:drop-shadow(0 1px 3px #0005)}.chip text{fill:#fff;font-weight:700;font-size:11px;pointer-events:none}.chip .sub{font-weight:600;font-size:9.5px;opacity:.95}
.chip.bad rect{fill:var(--k-bad)!important}
.bub rect{fill:var(--ink);opacity:.94}.bub text{fill:var(--bg);font-size:11.5px;pointer-events:none}.bub.ok rect{fill:var(--ok)}.bub.err rect{fill:var(--k-bad)}.bub.nat rect{fill:var(--warn)}.bub.ign rect{fill:var(--muted)}
.bub.ok text,.bub.err text,.bub.nat text,.bub.ign text{fill:#fff}
.pkt-in{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
/* ---- barre de lecture ---- */
#dock{flex:none;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;height:var(--dockh,320px);min-height:150px}
#xport{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#xport button{min-width:34px}#play{min-width:96px}
#timeline{flex:1;min-width:0;overflow:hidden;display:flex;align-items:center;gap:2px;height:30px;padding:0 4px}
.tick{flex:1;min-width:2px;max-width:34px;height:20px;border-radius:3px;border:0;padding:0;opacity:.35;position:relative;transition:opacity .15s,transform .15s}.tick:hover{opacity:.8}
.tick.past{opacity:.75}.tick.cur{opacity:1;transform:scaleY(1.3);outline:2px solid var(--ink);outline-offset:1px}.tick.sep{margin-left:5px}
#xinfo{font-family:var(--mono);font-size:11.5px;color:var(--muted);min-width:90px;text-align:right}
#dtabs{display:flex;background:var(--panel2);border-bottom:1px solid var(--line)}
.dtab{border:0;border-radius:0;background:none;padding:6px 14px}.dtab.on{background:var(--panel);font-weight:600;border-top:2px solid var(--brand);color:var(--brand)}
#dockbody{flex:1;min-height:0;overflow:auto;position:relative}
#grip{height:7px;cursor:ns-resize;background:var(--panel);border-top:1px solid var(--line);flex:none;position:relative}#grip::after{content:"";position:absolute;left:50%;top:2px;width:40px;margin-left:-20px;height:3px;border-radius:2px;background:var(--line)}
/* ---- journal ---- */
table.j{width:100%;border-collapse:collapse;font-size:12px}table.j th{position:sticky;top:0;background:var(--panel2);text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);font-weight:600;color:var(--muted);z-index:1}
table.j td{padding:3px 8px;border-bottom:1px solid var(--line);white-space:nowrap}table.j td.info{white-space:normal;min-width:240px}
.pk-row{cursor:pointer}.pk-row:hover{background:var(--hover)}.pk-row.fut{opacity:.4}.pk-row.act{background:var(--brand2);font-weight:600}
.pk-row.gapr td{border-top:2px dashed var(--muted)}
.bd{display:inline-block;padding:0 8px;border-radius:10px;font-size:11px;font-weight:700;color:#fff;background:var(--c,var(--muted))}
.lostb{background:var(--k-bad);color:#fff;border-radius:8px;padding:0 6px;font-size:10px;margin-left:6px}
/* ---- paquet : empilement des en-têtes ---- */
.pv{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.where{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px}.where b{font-weight:700}
.where .mini{font-size:11.5px;color:var(--muted)}
.chg{background:#fffbeb;border:1px solid #fcd34d;border-left:4px solid var(--warn);color:#78350f;border-radius:6px;padding:5px 10px;font-size:12.5px}
html[data-theme=dark] .chg{background:#2a2110;border-color:#7a5a12;color:#fde7a6}
.chg.nil{background:var(--panel2);border-color:var(--line);color:var(--muted)}
.enc{display:flex;flex-direction:column;gap:0}
.ly{border:2px solid var(--c);border-radius:8px;background:color-mix(in srgb,var(--c) 7%,var(--panel));padding:5px 8px 8px}
.ly .ly{margin-top:6px}
.ly>.lh{display:flex;align-items:baseline;gap:8px;font-weight:700;color:var(--c);margin-bottom:3px}.ly>.lh small{font-weight:400;color:var(--muted)}
.fields{display:flex;flex-wrap:wrap;gap:4px 6px}
.fd{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 7px;font-size:12px;line-height:1.5}.fd .k{color:var(--muted);margin-right:5px}.fd .v{font-family:var(--mono);font-weight:600}
.fd.ch{border-color:var(--warn);background:#fffbeb;color:#78350f}.fd.ch .k{color:#92400e}html[data-theme=dark] .fd.ch{background:#2a2110;color:#fde7a6}
.fd.key{border-color:var(--c)}
.payload{font-family:var(--mono);font-size:12px;background:var(--code);border-radius:5px;padding:5px 8px;white-space:pre-wrap;word-break:break-all;margin-top:4px}
.lock{display:flex;gap:8px;align-items:center;background:repeating-linear-gradient(135deg,var(--code),var(--code) 8px,var(--panel2) 8px,var(--panel2) 16px);border:1px dashed var(--k-sec);border-radius:5px;padding:7px 10px;color:var(--k-sec);font-weight:600;margin-top:4px}
.empty{padding:16px;color:var(--muted)}
.tgl{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
/* ---- inspecteur droit ---- */
#rtabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.rtab{flex:1;border:0;border-radius:0;background:none;padding:9px 4px}.rtab.on{border-bottom:2px solid var(--brand);font-weight:600;color:var(--brand)}
#rpane{flex:1;overflow:auto;padding:12px 14px 20px}
.ph{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}.ph h2{margin:0;font-size:20px;line-height:1.1}.ph .fn{color:var(--muted);font-size:12px}
.pill{display:inline-block;border-radius:12px;padding:1px 9px;font-size:11px;background:var(--brand2);color:var(--brand);font-weight:600;white-space:nowrap}.pill.g{background:#dcfce7;color:#166534}html[data-theme=dark] .pill.g{background:#12331f;color:#86efac}
.sc{border:1px solid var(--line);border-left:4px solid var(--c,var(--brand));border-radius:8px;padding:10px 12px;margin:8px 0;background:var(--panel)}
.sc .eb{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--c,var(--brand))}
.sc h3{margin:2px 0 6px;font-size:15.5px;line-height:1.25}
.sc p{margin:6px 0}.sc .lab{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:9px}
.look{background:var(--brand2);border-radius:6px;padding:6px 10px;margin-top:8px}.look .lab{margin-top:0;color:var(--brand)}
.now{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0}.now .lab{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ana{background:#fff7ed;border:1px solid #fed7aa;border-left:4px solid #ea580c;color:#7c2d12;border-radius:6px;padding:8px 10px;margin:8px 0}html[data-theme=dark] .ana{background:#2a1a0c;border-color:#7c3a12;color:#fed7aa}
.ana b{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:8px 0}.kv dt{color:var(--muted);font-size:12px}.kv dd{margin:0;font-weight:600}
.wd{margin:6px 0}.wd dt{font-weight:700;display:inline}.wd dd{display:inline;margin:0 0 0 4px;color:var(--ink)}.wd div{margin:3px 0}
.lvl{border:1px solid var(--line);border-radius:8px;margin:10px 0;overflow:hidden}.lvl>.lt{background:var(--top);color:#e2e8f0;padding:5px 10px;font-weight:700;font-size:12px}
.lvl>.lb{padding:8px 10px}.lvl h4{margin:10px 0 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.lvl h4:first-child{margin-top:0}
.lvl ul{margin:4px 0;padding-left:18px}.lvl li{margin:3px 0}
.cmd{display:flex;align-items:center;gap:6px;background:var(--code);border:1px solid var(--line);border-radius:6px;padding:3px 4px 3px 8px;margin:4px 0}.cmd span{flex:1;font-family:var(--mono);font-size:12px;word-break:break-all}.cmd button{padding:1px 8px;font-size:11.5px}
.callout{border-left:4px solid var(--warn);background:#fffbeb;color:#78350f;border-radius:6px;padding:7px 10px;margin:8px 0}.callout.sec{border-color:var(--err);background:#fef2f2;color:#7f1d1d}
html[data-theme=dark] .callout{background:#2a2110;color:#fde7a6}html[data-theme=dark] .callout.sec{background:#2b1414;color:#fecaca}
.calc{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;margin:6px 0}.calc td,.calc th{border:1px solid var(--line);padding:3px 6px;text-align:center}.calc th{background:var(--panel2);font-family:var(--sans)}.calc .m{background:#dcfce7;color:#166534}.calc .x{background:#fee2e2;color:#991b1b}
html[data-theme=dark] .calc .m{background:#12331f;color:#86efac}html[data-theme=dark] .calc .x{background:#3a1616;color:#fecaca}
.quiz .q{font-weight:700;margin:4px 0 8px}.opts{display:grid;gap:6px}
.opt{display:flex;gap:8px;text-align:left;padding:7px 9px;border-radius:7px}.opt .l{flex:none;width:20px;height:20px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:11px;font-weight:700}
.opt.ok{border-color:var(--ok);background:#dcfce7;color:#14532d}.opt.ko{border-color:var(--err);background:#fee2e2;color:#7f1d1d}
html[data-theme=dark] .opt.ok{background:#12331f;color:#bbf7d0}html[data-theme=dark] .opt.ko{background:#3a1616;color:#fecaca}
.fb{margin-top:8px}.fb b.g{color:var(--ok)}.fb b.r{color:var(--err)}
.nextp{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;padding:8px 10px;border:1px dashed var(--brand);border-radius:8px;background:var(--brand2)}
/* ---- modale ---- */
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:50;padding:12px}#modal.on{display:flex}
#mbox{background:var(--panel);border-radius:10px;max-width:760px;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 10px 40px #0006}
#mbox header{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700}#mbox header button{margin-left:auto}
#mbody{overflow:auto;padding:12px 16px}#mbody h4{margin:14px 0 4px}#mbody kbd{background:var(--code);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-family:var(--mono);font-size:12px}
.lic-box{background:#f0f9ff;border:1px solid #bae6fd;border-left:4px solid #0284c7;border-radius:6px;padding:10px 12px;margin:10px 0;color:#0c4a6e;line-height:1.55}.lic-box b{color:#075985}
html[data-theme=dark] .lic-box{background:#0c2233;border-color:#155e75;color:#bae6fd}html[data-theme=dark] .lic-box b{color:#7dd3fc}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;z-index:60}#toast.on{opacity:.95;transform:translateX(-50%)}
/* ---- projecteur ---- */
body.projector{font-size:16px}body.projector .node .nm{font-size:16px}body.projector .node .ipl{font-size:13px}body.projector .chip text{font-size:13px}body.projector .bub text{font-size:14px}body.projector .fd{font-size:14px}body.projector .payload,body.projector table.j,body.projector .cmd span{font-size:14px}
/* ---- adaptatif ---- */
@media (max-width:1180px){#right{width:310px}#left{width:222px}}
@media (max-width:980px){
 body{overflow:auto}html,body{height:auto}
 #main{flex-direction:column}

const NODE={

 isp:{k:'rt',name:'Routeur du FAI',ip:'198.51.100.1',mac:'00:00:5e:00:53:a1',role:'1er routeur du fournisseur'},

};

const LAYOUT={
 lan:{n:{pc:[130,215],sw:[370,215],pc2:[370,66],prn:[370,364],rt:[620,215]},l:[['pc','sw'],['pc2','sw'],['prn','sw'],['sw','rt']],lan:['pc','sw','pc2','prn','rt']},

 icmp:{n:{pc:[86,215],rt:[270,215],isp:[450,215],cloud:[640,215],srv:[850,215]},l:[['pc','rt'],['rt','isp'],['isp','cloud'],['cloud','srv']],lan:['pc','rt']},
 web:{n:{pc:[110,215],rt:[330,215],cloud:[560,215],res:[840,88],srv:[840,342]},l:[['pc','rt'],['rt','cloud'],['cloud','res'],['cloud','srv']],lan:['pc','rt']},
 dns:{n:{pc:[100,215],rt:[300,215],cloud:[520,215],res:[840,60],root:[840,160],tld:[840,270],auth:[840,370]},l:[['pc','rt'],['rt','cloud'],['cloud','res'],['cloud','root'],['cloud','tld'],['cloud','auth']],lan:['pc','rt']},
 fork:{n:{pc:[100,215],rt:[310,215],cloud:[540,215],a:[840,66],b:[840,364]},l:[['pc','rt'],['rt','cloud'],['cloud','a'],['cloud','b']],lan:['pc','rt']},
 vlan:{n:{pc:[100,70],pc2:[100,360],sw:[350,215],sw2:[610,215],prn:[860,70],srv:[860,360]},l:[['pc','sw'],['pc2','sw'],['sw','sw2'],['sw2','prn'],['sw2','srv']],t:[['sw','sw2']],lan:['pc','pc2','sw','sw2','prn','srv']},
 stp:{n:{sw:[480,70],sw2:[190,350],sw3:[770,350]},l:[['sw','sw2'],['sw2','sw3'],['sw','sw3']],lan:['sw','sw2','sw3']},
 dot1x:{n:{pc:[120,215],sw:[430,215],srv:[780,215]},l:[['pc','sw'],['sw','srv']],lan:['pc','sw','srv']},
 vpn:{n:{pc:[90,215],rt:[270,215],cloud:[470,215],gw:[670,215],srv:[870,215]},l:[['pc','rt'],['rt','cloud'],['cloud','gw'],['gw','srv']],lan:['pc','rt']},
 mail:{n:{pc:[100,215],rt:[310,215],cloud:[540,215],smtp:[840,66],dns:[840,215],mx:[840,364]},l:[['pc','rt'],['rt','cloud'],['cloud','smtp'],['cloud','dns'],['cloud','mx']],lan:['pc','rt']}

function buildScene(spec){
 const L=LAYOUT[spec.layout];if(!L)throw new Error('scène inconnue '+spec.layout);

 for(const id in L.n){
  const base=NODE[id]||{k:'srv',name:id,ip:'',role:''};
  const o=Object.assign({},base,(spec.nodes&&spec.nodes[id])||{});
  o.id=id;o.x=L.n[id][0];o.y=L.n[id][1];
  if(o.k!=='sw'&&o.k!=='cloud'&&!o.mac)o.mac=autoMac(spec.layout+id);

 /* Internet compte N routeurs : le total vu depuis la box vaut 12 (TTL 64 -> 52) */
 if(nodes.cloud)nodes.cloud.hops=spec.layout==='icmp'?10:11;

function neighbors(sc,id){const o=[];sc.links.forEach(l=>{if(l.a===id)o.push(l.b);else if(l.b===id)o.push(l.a)});return o}

 while(q.length){const u=q.shift();if(u===b)break;neighbors(sc,u).forEach(v=>{if(!(v in prev)){prev[v]=u;q.push(v)}})}

/* ====================== SIMULATION D'UN PAQUET ====================== */
const BCAST='ff:ff:ff:ff:ff:ff';

   });
   if(!moves.length)break;
   const evs=[];
   moves.forEach(m=>{
    const n=sc.nodes[m.b];
    if(n.k==='sw')evs.push({node:m.b,text:pk.vlan?'Diffusion limitée au VLAN '+pk.vlan+' :\nles ports des autres VLAN ne la reçoivent pas':'Diffusion : le switch copie la trame\nsur tous ses autres ports',cls:''});

    else evs.push({node:m.b,text:'Ignore : pas pour moi',cls:'ign'});
   });
   const eth=bcEth(sc,pk,from);
   J.stages.push({moves,evs,hop:{a:moves[0].a,b:moves[0].b,eth,vlan:vlanOn(sc,pk,moves[0].a,moves[0].b),ip:ipBlock(sc,pk,from,null,pk.ttl||defaultTTL(sc,from),false),l4:cloneL4(pk.l4),changes:[]},depth});

  J.stages.forEach(s=>{const r=s.moves.find(m=>(pk.rcv||[]).includes(m.b));if(r){s.hop.a=r.a;s.hop.b=r.b;s.hop.vlan=vlanOn(sc,pk,r.a,r.b)}});

  const hop={a,b,eth:ethOf(sc,pk,path,j),vlan:vlanOn(sc,pk,a,b),ip:ipBlock(sc,pk,from,pk.to,ttl,wanSide,outb,inb),l4:natL4(pk,wanSide,outb),changes:[]};
  if(hop.ip)hop.ip.nat=wanSide;
  const evs=[];let dead=null;
  const nb=sc.nodes[b];
  /* événements à l'arrivée dans b */
  if(!last){
   if(nb.k==='sw')evs.push({node:b,text:'Le switch transmet la trame\nsans la modifier',cls:''});
   else if(nb.k==='rt'){
    const lines=[];
    if(ttl<=1){dead={why:'ttl',text:'TTL = 0 : le routeur détruit le paquet\net prévient l’émetteur (ICMP)'};}
    else{lines.push('TTL '+ttl+' → '+(ttl-1));}

     const l4=pk.l4,hasP=l4&&(l4.k==='tcp'||l4.k==='udp'),priv=sc.nodes[outb?from:pk.to].ip;

     else lines.push('NAT inverse : '+nb.wip+(hasP?':'+mp:'')+' → '+priv+(hasP?':'+l4.dp:''));
    }

    else{evs.push({node:b,text:dead.text,cls:'err'});}
    if(!dead)ttl-=1;
   }else if(nb.k==='cloud'){
    const hn=nb.hops;
    if(ttl<=hn){dead={why:'ttl',text:'TTL épuisé dans Internet'};evs.push({node:b,text:dead.text,cls:'err'})}
    else{evs.push({node:b,text:'≈ '+hn+' routeurs traversés\nTTL '+ttl+' → '+(ttl-hn),cls:''});ttl-=hn}
   }
  }
  if(!dead&&lostIdx===j+1){dead={why:'lost',text:pk.lostText||'Paquet perdu\n(congestion, liaison coupée…)'};evs.push({node:b,text:dead.text,cls:'err'})}
  if(last&&!dead){
   if(pk.bub)evs.push({node:b,text:pk.bub,cls:'ok'});
   else evs.push({node:b,text:'Reçu',cls:'ok'});
  }
  J.stages.push({moves:[{a,b}],evs,hop,dead:!!dead});
  if(dead){J.death={i:j+1,why:dead.why};break}
 }
 /* diffs entre liens successifs */
 for(let i=1;i<J.stages.length;i++)J.stages[i].hop.changes=diffHop(J.stages[i-1].hop,J.stages[i].hop);

function vlanOn(sc,pk,a,b){if(!pk.vlan)return null;const l=sc.links.find(x=>(x.a===a&&x.b===b)||(x.a===b&&x.b===a));return l&&l.trunk?pk.vlan:null}
function ethType(pk){return pk.l2&&pk.l2.type?pk.l2.type:pk.l4&&pk.l4.k==='arp'?'0x0806 (ARP)':'0x0800 (IPv4)'}
function bcEth(sc,pk,from){return{src:macOf(sc,from)||'',dst:(pk.l2&&pk.l2.dst)||BCAST,type:ethType(pk)}}
function ethOf(sc,pk,path,j){
 let s=j;while(s>0&&sc.nodes[path[s]].k==='sw')s--;
 let e=j+1;while(e<path.length-1&&sc.nodes[path[e]].k==='sw')e++;
 const nS=sc.nodes[path[s]],nE=sc.nodes[path[e]];
 let src=macOf(sc,path[s],path[s+1]),dst=macOf(sc,path[e],path[e-1]);
 if(nS.k==='cloud')src='MAC du dernier routeur';
 if(nE.k==='cloud')dst='MAC du routeur suivant';
 if(src==null)src='?';if(dst==null)dst='?';
 if(pk.l2&&pk.l2.dst)dst=pk.l2.dst;
 return{src,dst,type:ethType(pk),seg:[nS.id,nE.id]};
}
function ipBlock(sc,pk,from,to,ttl,wanSide,outb,inb){
 if(pk.l2||(pk.l4&&pk.l4.k==='arp'))return null;
 const o=pk.ip||[];
 let src=o[0]!=null?o[0]:ipOf(sc,from,to),dst=o[1]!=null?o[1]:(to?ipOf(sc,to,from):'255.255.255.255');
 if(wanSide){
  const rt=Object.values(sc.nodes).find(n=>n.nat);
  if(outb)src=rt.wip;else if(inb)dst=rt.wip;
 }
 const l=pk.l4;
 const pr=l?(l.k==='gen'?(l.ipProto||''):({tcp:'TCP (6)',udp:'UDP (17)',icmp:'ICMP (1)'}[l.k]||'')):'';
 return{src,dst,ttl,proto:pr};
}
function natL4(pk,wanSide,outb){
 const l=cloneL4(pk.l4);if(!l||!wanSide||!pk.nat||!pk.nat.mp)return l;
 if(l.k==='tcp'||l.k==='udp'){if(outb)l.sp=pk.nat.mp;else l.dp=pk.nat.mp}
 return l;
}
function diffHop(p,q){
 const c=[];
 if((p.vlan||null)!==(q.vlan||null))c.push('vlan');
 if(p.eth&&q.eth&&(p.eth.src!==q.eth.src||p.eth.dst!==q.eth.dst))c.push('eth');
 if(p.ip&&q.ip){if(p.ip.ttl!==q.ip.ttl)c.push('ttl');if(p.ip.src!==q.ip.src)c.push('ipsrc');if(p.ip.dst!==q.ip.dst)c.push('ipdst')}
 if(p.l4&&q.l4){if(p.l4.sp!==q.l4.sp)c.push('sp');if(p.l4.dp!==q.l4.dp)c.push('dp')}
 return c;
}

function Builder(){
 const pk=[];let st=0;
 const add=o=>{o.s=st;pk.push(o);return o};
 const b={pk,step(n){st=n;return b},raw:add,
  udp(t,from,to,sp,dp,len,proto,info,o){return add(Object.assign({t,from,to,proto:proto||'UDP',info:info||(sp+' → '+dp+' Len='+len),sz:Math.max(60,42+len),l4:{k:'udp',sp,dp,len}},o))},
  icmp(t,from,to,type,code,text,o,extra){return add(Object.assign({t,from,to,proto:'ICMP',info:text,sz:70,l4:Object.assign({k:'icmp',type,code},extra||{})},o))},
  flow(cl,srv,sp,dp){
   const nx={c:0,s:0};
   function seg(t,who,fl,len,proto,info,o){
    const oth=who==='c'?'s':'c',from=who==='c'?cl:srv,to=who==='c'?srv:cl;
    const seq=nx[who],ack=fl.indexOf('ACK')>=0?nx[oth]:0,ctl=(fl.indexOf('SYN')>=0||fl.indexOf('FIN')>=0)?1:0;
    nx[who]+=len+ctl;
    const s1=who==='c'?sp:dp,d1=who==='c'?dp:sp,op=fl.indexOf('SYN')>=0?12:0;
    const base=s1+' → '+d1+' ['+fl+'] Seq='+seq+(fl.indexOf('ACK')>=0?' Ack='+ack:'')+(len?' Len='+len:'');
    const l4=Object.assign({k:'tcp',sp:s1,dp:d1,fl,seq,ack,len},(o&&o.l4o)||{});
    const q=Object.assign({t,from,to,proto:proto||'TCP',info:info||base,sz:Math.max(60,54+op+len),l4},o||{});delete q.l4o;
    return add(q);
   }
   const f={nx,seg,
    syn:(t,o)=>seg(t,'c','SYN',0,'TCP',null,o),synack:(t,o)=>seg(t,'s','SYN, ACK',0,'TCP',null,o),
    ack:(t,who,o)=>seg(t,who||'c','ACK',0,'TCP',null,o),
    c:(t,len,proto,info,o)=>seg(t,'c','PSH, ACK',len,proto,info,o),s:(t,len,proto,info,o)=>seg(t,'s','PSH, ACK',len,proto,info,o),
    fin:(t,who,o)=>seg(t,who,'FIN, ACK',0,'TCP',null,o),
    hand:(t0,dt,o)=>{f.syn(t0,o&&o[0]);f.synack(t0+dt,o&&o[1]);f.ack(t0+2*dt,'c',o&&o[2])}};
   return f;
  }};
 return b;
}

 D.DHCP={name:'DHCP',full:'Dynamic Host Configuration Protocol',scene:{layout:'lan',sub:'ip',nodes:{rt:{name:'Box (serveur DHCP)'},pc:{ip:'0.0.0.0'}}},

  analogy:'C’est l’accueil d’un hôtel. Le client arrive sans chambre et demande à voix haute « qui peut me loger ? » (Discover). La réception propose la chambre 12 (Offer), le client l’accepte (Request), puis reçoit sa clé et la durée du séjour (ACK). À mi-séjour, il vient prolonger.',
  prereq:['IP'],
  facts:[['Couche OSI','7 — Application'],['Transport','UDP : port 67 (serveur) et 68 (client)'],['Échange','DORA : Discover, Offer, Request, ACK'],['Durée','Bail (24 h dans l’exemple), renouvelé à 50 %'],['Diffusion','Discover et Request sont envoyés à tous'],['Norme','RFC 2131']],
  words:[['Bail','durée pendant laquelle l’adresse est prêtée'],['DORA','les quatre messages : Discover, Offer, Request, ACK'],['Diffusion (broadcast)','message destiné à tous les équipements du réseau local'],['Étendue (pool)','plage d’adresses que le serveur peut distribuer'],['Réservation','adresse toujours donnée à la même MAC'],['Relais DHCP','fait suivre les demandes vers un serveur d’un autre sous-réseau']],
  steps:[

    why:'Configurer chaque poste à la main est long et source d’erreurs (doublons d’adresses, masque faux…). DHCP automatise tout : un serveur prête des adresses.',
    look:'Le poste affiche « 0.0.0.0 » : c’est l’adresse « je n’en ai pas ». Elle changera à l’étape de confirmation.',
    bub:['pc','Je n’ai pas d’adresse IP\n(0.0.0.0)',''],w:'Les premiers paquets d’une capture de démarrage viennent de 0.0.0.0.'},
   {t:'Découverte : Discover',
    what:'Le poste envoie un message <b>DHCP Discover</b> depuis 0.0.0.0 vers l’adresse de diffusion 255.255.255.255, avec comme adresse MAC de destination ff:ff:ff:ff:ff:ff. Il dit en substance : « je cherche un serveur DHCP ».',
    why:'Le poste ne sait pas où se trouve le serveur et n’a pas d’adresse source valable : la diffusion est la seule façon d’être entendu de tout le réseau.',

    why:'Le serveur réserve provisoirement l’adresse proposée pour ne pas la donner à un autre poste pendant que le client réfléchit.',

    what:'La box répond par un <b>DHCP ACK</b> : le prêt est validé. Le poste configure alors son interface avec l’adresse, le masque, la passerelle et les DNS reçus, et démarre le minuteur du bail.',
    why:'C’est l’ACK, et non l’Offer, qui engage le serveur : tant qu’il n’est pas reçu, l’adresse n’appartient pas au poste.',
    look:'L’adresse du poste passe de 0.0.0.0 à 192.168.1.10 sur le schéma.',

 b.icmp(0.017,'srv','pc',0,0,'Echo (ping) reply  id=0x0001, seq=1/256, ttl=52',{ttl:64,sz:74,sub:'ttl',bub:'Réponse reçue : temps aller-retour 17 ms',cap:'Le serveur renvoie un Echo Reply avec le même identifiant et le même numéro de séquence.'},{id:1,seq:1,label:'Echo reply'});

 b.icmp(4.017,'srv','pc',3,3,'Destination unreachable (Port unreachable)',{ttl:64,sub:'ttl',sz:70,bub:'Message d’erreur reçu :\nle port est fermé',cap:'Personne n’écoute sur ce port : le serveur renvoie « Port unreachable » (type 3, code 3).'},{label:'Destination unreachable'});
 D.ICMP={name:'ICMP',full:'Internet Control Message Protocol',scene:{layout:'icmp',sub:'ttl',nodes:{srv:{name:'Serveur web',ip:'203.0.113.10'}}},
  goal:'ICMP est le protocole de diagnostic de la couche réseau : il permet de tester si une machine répond (ping), de tracer le chemin (traceroute) et de signaler les erreurs de livraison.',
  analogy:'ICMP est le service « suivi du courrier » : un coup de sonde pour savoir si quelqu’un répond à une adresse, et des avis de retour du type « destinataire inconnu » ou « courrier détruit : trop de relais traversés ».',
  prereq:['IP'],
  facts:[['Couche OSI','3 — Réseau (porté directement par IP)'],['Ports','Aucun : ICMP n’utilise ni TCP ni UDP'],['Types courants','0 et 8 : écho · 3 : injoignable · 11 : TTL expiré'],['Outils','ping, tracert, traceroute, mtr'],['Particularité','Souvent filtré par les pare-feu'],['Norme','RFC 792']],
  words:[['Echo request / reply','question et réponse du ping'],['TTL','nombre de routeurs que le paquet peut encore traverser'],['RTT','temps aller-retour mesuré par le ping'],['Traceroute','envoie des paquets de TTL croissant pour découvrir chaque routeur'],['Type / code','identifient le message ICMP (ex. 3 / 3 : port injoignable)']],
  steps:[
   {t:'Ping : « es-tu là ? »',

    why:'Il faut un moyen simple de savoir si une machine est joignable et combien de temps met un aller-retour, sans dépendre d’un service particulier.',
    look:'Sous l’étiquette du paquet, le TTL part à 128 et diminue à chaque routeur : la box, le routeur du fournisseur, puis environ dix routeurs dans Internet.',

   {t:'La réponse : « je suis là »',
    what:'Le serveur renvoie un <b>Echo Reply</b> (type 0) avec le même identifiant et le même numéro de séquence. C’est ainsi que ping associe chaque réponse à sa question et mesure le temps aller-retour (ici 17 ms).',
    why:'Sans numéro de séquence, impossible de savoir à quelle demande correspond une réponse, ni de détecter une réponse perdue.',
    look:'Le serveur part avec un TTL de 64 et le paquet arrive à 52 : il a donc traversé 12 routeurs au retour.',

    why:'Sans TTL, un paquet pris dans une boucle de routage tournerait indéfiniment. Avec lui, il finit toujours par disparaître.',
    look:'Le paquet meurt sur la box (bulle rouge). La box renvoie un message de type 11 : elle révèle ainsi sa propre adresse.',

   {t:'Destination injoignable',
    what:'ICMP signale aussi des erreurs. Une application envoie un datagramme UDP vers le port 9999 ; le serveur n’y a aucun programme en écoute. Il répond « Destination unreachable — Port unreachable » (type 3, code 3).',

 D.UDP={name:'UDP',full:'User Datagram Protocol',scene:{layout:'wan1',sub:'none',nodes:{srv:{name:'Serveur multimédia',ip:'203.0.113.20'}}},

 D.TCP={name:'TCP',full:'Transmission Control Protocol',scene:{layout:'wan1',sub:'fl',nodes:{srv:{name:'Serveur web',ip:'203.0.113.10'}}},
  goal:'TCP fournit une liaison fiable entre deux programmes : les données arrivent complètes, dans l’ordre et sans doublon, même si le réseau en dessous perd ou mélange des paquets.',
  analogy:'TCP est un courrier recommandé avec accusé de réception. Chaque lettre est numérotée, le destinataire confirme ce qu’il a reçu, et l’expéditeur renvoie ce qui manque. Avant d’écrire, on prévient d’abord (la poignée de main).',
  prereq:['IP','UDP'],
  facts:[['Couche OSI','4 — Transport'],['Connexion','Oui : ouverture en 3 temps, fermeture en 4'],['Fiabilité','Numéros de séquence, accusés, retransmission'],['Contrôle','Fenêtre : le récepteur règle le débit'],['En-tête','20 octets minimum'],['Norme','RFC 9293']],
  words:[['SYN','demande d’ouverture de connexion'],['ACK','accusé de réception'],['FIN','demande de fermeture'],['Numéro de séquence','position du premier octet envoyé'],['Retransmission','nouvel envoi d’un segment perdu'],['SACK','accusé sélectif : « j’ai reçu aussi ceci »'],['Port éphémère','port temporaire choisi par le client (ex. 49152)']],
  steps:[
   {t:'Ouvrir la connexion (3 temps)',what:'Avant d’échanger des données, les deux extrémités se mettent d’accord : le client envoie <b>SYN</b>, le serveur répond <b>SYN-ACK</b>, le client termine par <b>ACK</b>. Chacun annonce au passage son numéro de séquence de départ.',why:'Cette « poignée de main » vérifie que l’autre répond et synchronise les compteurs qui serviront à numéroter chaque octet.',look:'Sous chaque paquet, le drapeau change : SYN, SYN, ACK, ACK. Aucune donnée n’a encore circulé.',w:'Filtre <code>tcp.flags.syn == 1</code>. Wireshark affiche des numéros « relatifs » (le premier est 0).'},
   {t:'Envoyer des données',what:'Le client envoie 78 octets. TCP numérote chaque octet : ces données portent les numéros 1 à 78. Le serveur répond par un ACK dont le numéro, 79, indique le prochain octet qu’il attend.',why:'Le numéro d’accusé est une promesse : « tout ce qui précède est bien arrivé ». S’il n’arrive pas, l’émetteur sait qu’il doit renvoyer.',look:'Cliquez sur le paquet pour comparer « N° de séquence » et « N° d’accusé » : l’un compte ce qu’on envoie, l’autre ce qu’on a reçu.',w:'Colonne « Len » : nombre d’octets de données. Seq + Len = prochain Seq de l’émetteur.'},
   {t:'Deux segments, un se perd',what:'Le serveur découpe sa réponse en deux segments de 1460 octets. Le premier disparaît dans Internet ; le second arrive, mais le poste ne peut pas encore l’utiliser car il manque le début.',why:'Un segment de 1460 octets est la taille maximale d’un paquet Ethernet moins les en-têtes IP et TCP (MSS). Au-delà, les données sont découpées.',look:'Le premier segment rougit dans Internet. Le second arrive jusqu’au poste.',w:'Filtre <code>tcp.analysis.retransmission || tcp.analysis.lost_segment</code> pour repérer les anomalies.'},
   {t:'Un trou est repéré',what:'En recevant les octets 1461 à 2920 sans avoir reçu 1 à 1460, le poste répond par un ACK « en double » : le numéro d’accusé reste 1 (il attend toujours ce début), accompagné d’un bloc <b>SACK</b> qui annonce ce qu’il a déjà.',why:'Grâce au SACK, le serveur sait précisément quoi renvoyer, sans retransmettre ce qui est déjà arrivé.',look:'Le numéro d’accusé n’a pas avancé : c’est le signe d’un trou.',w:'Filtre <code>tcp.options.sack</code>. Trois ACK dupliqués déclenchent normalement la retransmission rapide.'},
   {t:'Renvoyer le trou',what:'Le serveur renvoie seulement les octets manquants (1 à 1460), marqués « TCP Retransmission » par Wireshark. Le poste peut alors reconstituer le tout et accuse réception jusqu’à l’octet 2920.',why:'La fiabilité de TCP vient de cette boucle : numéroter, accuser réception, renvoyer ce qui manque. L’application ne voit jamais la perte.',look:'Le numéro de séquence du paquet est revenu à 1 : c’est bien une retransmission.',w:'Une retransmission se repère à un Seq déjà vu. Beaucoup de retransmissions = lien saturé ou perte de paquets.'},
   {t:'Fermer la connexion',what:'Chaque sens se ferme séparément : le poste envoie <b>FIN</b>, le serveur répond <b>ACK</b>, puis envoie son propre <b>FIN</b>, que le poste confirme. La connexion disparaît des deux côtés.',why:'Fermer proprement garantit que toutes les données ont été reçues. Une fermeture brutale utilise un paquet RST à la place.',look:'Quatre paquets pour fermer, trois pour ouvrir : chaque FIN consomme un numéro de séquence.',w:'Filtre <code>tcp.flags.fin == 1 || tcp.flags.reset == 1</code>.'}
  ],pk:b.pk};
})();

 D.SSH={name:'SSH',full:'Secure Shell',scene:{layout:'wan1',sub:'none',nodes:{srv:{name:'server.example.com',ip:'203.0.113.22'}}},
  goal:'SSH ouvre une session d’administration à distance dans un tunnel chiffré et authentifié. Il a remplacé Telnet, qui envoyait tout en clair, y compris les mots de passe.',
  analogy:'SSH, c’est un tunnel blindé creusé entre deux bureaux. Avant d’y circuler, on vérifie la plaque du bureau d’en face (clé d’hôte), puis on prouve qui l’on est avec une clé que l’on ne montre jamais.',
  prereq:['TCP'],
  facts:[['Couche OSI','7 — Application'],['Transport','TCP, port 22'],['Authentification','Mot de passe ou paire de clés'],['Garanties','Confidentialité, intégrité, identité du serveur'],['Autres usages','Transfert de fichiers (SFTP, SCP), tunnels'],['Norme','RFC 4253 (+ RFC 4252, RFC 4254)']],
  words:[['Clé d’hôte','identifie le serveur ; mémorisée dans known_hosts'],['Clé publique / privée','la publique se partage, la privée reste secrète'],['authorized_keys','liste des clés publiques autorisées sur le serveur'],['Canal','flux logique dans la connexion (terminal, transfert…)'],['KEXINIT','message qui liste les algorithmes proposés']],
  steps:[
   {t:'Dire bonjour',what:'Après la poignée de main TCP, chaque côté annonce, en clair, sa version de SSH. C’est le seul moment où l’on peut lire quelque chose dans la connexion.',why:'Les deux parties doivent d’abord s’assurer qu’elles parlent la même version du protocole.',look:'Seuls ces deux paquets (bannières) restent lisibles. Tout ce qui suit sera chiffré.',w:'Filtre <code>ssh</code>. La bannière révèle souvent le logiciel et sa version : utile à un attaquant comme à un audit.'},
   {t:'Négocier les algorithmes',what:'Chaque côté envoie un message <b>KEXINIT</b> listant, par ordre de préférence, les algorithmes d’échange de clés, de chiffrement et d’intégrité qu’il accepte. Pour chaque catégorie, le premier choix commun l’emporte.',why:'SSH évolue : de nouveaux algorithmes apparaissent et d’anciens deviennent dangereux. La négociation permet à des versions différentes de rester compatibles.',look:'Deux gros paquets : ce sont des listes, pas encore de clés.',w:'Désactiver les algorithmes faibles se fait côté serveur (sshd_config) : la négociation garantit qu’ils ne seront plus choisis.'},
   {t:'Échange de clés',what:'Les deux parties s’envoient chacune une moitié de clé éphémère et calculent le même secret sans qu’il circule. Le serveur ajoute sa <b>clé d’hôte</b> et une signature. Le client compare cette clé à celles qu’il connaît (known_hosts).',why:'Cette vérification protège contre l’usurpation : si la clé change sans raison, SSH alerte l’utilisateur. C’est le fameux message « host identification has changed ».',look:'Après « New Keys », le tunnel est chiffré : les paquets suivants ne sont plus lisibles.',w:'À la première connexion, SSH affiche l’empreinte de la clé d’hôte : elle doit être vérifiée par un autre canal.'},
   {t:'Se connecter avec une clé',what:'Dans le tunnel, le client demande le service d’authentification, puis propose sa <b>clé publique</b>. Si le serveur la connaît, le client prouve qu’il possède la clé privée correspondante en signant l’identifiant de session.',why:'Aucun secret n’est transmis : même si quelqu’un enregistrait la conversation, il ne pourrait pas rejouer la signature. C’est bien plus sûr qu’un mot de passe.',look:'Huit paquets chiffrés, tous marqués d’un cadre « Chiffré » : le détail est visible ici uniquement parce que le simulateur connaît les clés.',w:'Pour diagnostiquer un refus de clé, utiliser <code>ssh -v</code> côté client et le journal d’authentification (auth.log) côté serveur.'},
   {t:'Ouvrir une session',what:'SSH peut faire passer plusieurs flux dans une seule connexion TCP : chacun est un <b>canal</b>. Le client ouvre un canal de type « session » pour obtenir un terminal.',why:'Les canaux permettent d’ouvrir un terminal, transférer des fichiers ou créer un tunnel sans refaire l’authentification.',look:'Un aller-retour suffit : le terminal est prêt.',w:'Les canaux multiples expliquent qu’une capture SSH montre une seule connexion TCP, même pour plusieurs usages.'},
   {t:'Taper une commande',what:'Chaque touche tapée est envoyée dans un petit paquet chiffré et le serveur renvoie l’écho de ce qui doit s’afficher. À la touche Entrée, la commande s’exécute et le résultat revient.',why:'Un terminal distant fonctionne caractère par caractère : c’est pourquoi une session SSH génère beaucoup de petits paquets.',look:'Les paquets font tous la même taille : sans pouvoir lire leur contenu, on peut deviner qu’on est en train de taper.',w:'Même chiffrés, les rythmes de frappe sont observables : une raison de limiter l’exposition de SSH.'}
  ],pk:b.pk};
})();

  facts:[['Couche OSI','7 — Application'],['Transport','TCP : 587 ou 465 (envoi), 25 (entre serveurs)'],['Format','Commandes texte : EHLO, MAIL FROM, RCPT TO, DATA'],['Réponses','2xx succès · 4xx erreur temporaire · 5xx erreur définitive'],['Sécurité','TLS (465 ou STARTTLS) + authentification'],['Norme','RFC 5321']],
  words:[['MX','enregistrement DNS qui désigne le serveur de messagerie d’un domaine'],['EHLO','message de présentation du client'],['Enveloppe','MAIL FROM + RCPT TO : l’expéditeur et le destinataire réels'],['STARTTLS','passage en chiffré au milieu d’une connexion'],['File d’attente','le serveur garde le message jusqu’à sa remise'],['SPF / DKIM / DMARC','mécanismes qui prouvent l’authenticité de l’expéditeur']],
  steps:[
   {t:'Se connecter en sécurité (465)',what:'Alice envoie un message avec son client de messagerie. Il ouvre une connexion TCP vers le serveur d’envoi, sur le port 465, et négocie TLS dès la première seconde.',why:'Sur ce port, le chiffrement est obligatoire dès le départ : les identifiants d’Alice ne circuleront jamais en clair.',look:'Six paquets avant de pouvoir envoyer la moindre commande SMTP.',w:'Filtre <code>tcp.port == 465 || tls.handshake</code>.'},
   {t:'Accueil et authentification',what:'Le serveur se présente (220). Le client répond <b>EHLO</b> et reçoit la liste des capacités du serveur, puis s’authentifie avec <b>AUTH</b>.',why:'Sans authentification, n’importe qui pourrait envoyer du courrier par ce serveur (relais ouvert) : c’est la source principale de spam.',look:'Chaque ligne est dans un cadre « Chiffré » : sur le fil, Wireshark ne verrait que « Application Data ».',w:'Les codes SMTP à retenir : 220 prêt, 250 accepté, 235 authentifié, 354 envoyez le contenu, 5xx refus.'},
   {t:'Envoyer le message',what:'Le client donne l’enveloppe (<b>MAIL FROM</b>, <b>RCPT TO</b>), annonce <b>DATA</b>, puis envoie le contenu terminé par une ligne contenant un point. Le serveur répond « queued » : il a pris le message en charge.',why:'L’enveloppe (qui reçoit vraiment) est distincte des en-têtes visibles From/To : c’est ce qui permet les copies cachées et les listes de diffusion.',look:'Quatre paquets seulement : le serveur a accepté le message avant même de l’avoir remis.',w:'Le message est ensuite dans la file (Postfix : <code>mailq</code>). Un 250 ne garantit pas la remise, seulement la prise en charge.'},
   {t:'Trouver le serveur de Bob',what:'Le serveur d’envoi doit savoir où remettre le message pour bob@example.org. Il demande au DNS l’enregistrement <b>MX</b> du domaine example.org, puis l’adresse IP du serveur indiqué.',why:'Le courrier n’est pas adressé à un site web mais à un serveur de messagerie, qui peut être différent du serveur web.',look:'Deux questions DNS (roses) : MX d’abord, puis l’adresse du serveur désigné.',w:'Cas de panne : « domain not found » ou « no MX » indiquent un problème de DNS du destinataire.'},
   {t:'De serveur à serveur (25, STARTTLS)',what:'Le serveur d’envoi ouvre une connexion vers le port 25 du serveur de Bob. Il commence en clair, constate que STARTTLS est proposé et demande le passage en chiffré dans la même connexion.',why:'Entre serveurs, le chiffrement est opportuniste : le port 25 est historiquement en clair. STARTTLS permet de le sécuriser sans changer de port.',look:'Les paquets lisibles (orange) cèdent la place aux paquets chiffrés (vert) au milieu de la connexion.',w:'Si le serveur distant ne propose pas STARTTLS, le courrier part en clair : à surveiller dans les journaux.'},
   {t:'Livrer le message',what:'Une fois le canal chiffré, le dialogue SMTP recommence : EHLO, enveloppe, DATA, contenu. Le serveur de Bob répond « queued » : le message est dans sa boîte aux lettres.',why:'Chaque serveur ajoute un en-tête « Received » : c’est ce qui permet de retracer le trajet d’un message et de repérer les faux.',look:'Le même dialogue qu’avec le premier serveur, mais entre deux serveurs.',w:'Pour lire le courrier, Bob utilisera POP3 ou IMAP : voir les deux protocoles suivants.'}
  ],pk:b.pk};
})();

/* ====================== POP3 ====================== */

 V(0.107,27,'+OK',['+OK'],'Le serveur accepte (« +OK » : les réponses POP3 sont « +OK » ou « -ERR »).');
 U(0.122,35,'PASS (mot de passe)',['PASS ********'],'Le mot de passe est envoyé, protégé par TLS.');
 V(0.137,38,'+OK Logged in.',['+OK Logged in.'],'Authentification acceptée.',{bub:'Bob est connecté'});
 b.step(2);
 U(0.152,28,'STAT',['STAT'],'Le client demande l’état de la boîte : nombre et taille des messages.');
 V(0.167,34,'+OK 2 5120',['+OK 2 5120'],'Réponse : 2 messages, 5120 octets au total.');
 U(0.182,28,'LIST',['LIST'],'Le client demande la liste détaillée.');
 V(0.197,58,'+OK 2 messages: 1 1904, 2 3216',['+OK 2 messages:','1 1904','2 3216','.'],'Le serveur donne le numéro et la taille de chaque message.');
 b.step(3);
 U(0.212,30,'RETR 1',['RETR 1'],'Le client demande de télécharger le message n° 1.');
 V(0.227,1950,'+OK 1904 octets, message, « . » (2 segments)',['+OK 1904 octets','From: alice@example.com','Subject: Rendez-vous','…','.'],'Le serveur envoie le message complet, terminé par une ligne contenant un point.',{sz:1514});
 b.step(4);
 U(0.242,30,'DELE 1',['DELE 1'],'Le client demande la suppression du message 1.');
 V(0.257,49,'+OK Marked to be deleted.',['+OK Marked to be deleted.'],'Le serveur ne fait que marquer le message : il n’est pas encore supprimé.');
 U(0.272,28,'QUIT',['QUIT'],'Le client termine la session.');
 V(0.287,58,'+OK Logging out, messages deleted.',['+OK Logging out, messages deleted.'],'À la fermeture, le serveur supprime vraiment les messages marqués.',{bub:'Message n° 1 supprimé du serveur'});
 D.POP3={name:'POP3',full:'Post Office Protocol, version 3',scene:{layout:'wan1',sub:'none',nodes:{srv:{name:'pop.example.org',ip:'198.51.100.110'}}},
  goal:'POP3 permet à un client de messagerie de récupérer le courrier d’une boîte aux lettres sur un serveur. Par défaut, les messages sont téléchargés sur le poste puis supprimés du serveur.',
  analogy:'POP3 est le retrait de colis en agence : on se présente, on emporte ses colis, et l’agence les efface de ses étagères. Si on perd son sac, le colis a disparu.',
  prereq:['TCP','TLS/SSL','SMTP'],
  facts:[['Couche OSI','7 — Application'],['Transport','TCP : port 995 (TLS) ou 110'],['Réponses','+OK ou -ERR'],['Particularité','Télécharge puis supprime (réglable)'],['Limite','Pas de synchronisation entre plusieurs appareils'],['Norme','RFC 1939']],
  words:[['USER / PASS','identifiant et mot de passe'],['STAT / LIST','état et liste de la boîte'],['RETR','télécharge un message'],['DELE','marque un message à supprimer'],['QUIT','termine et supprime effectivement']],
  steps:[
   {t:'Se connecter en sécurité (995)',what:'Le client de messagerie de Bob ouvre une connexion TCP vers le port 995 et négocie TLS tout de suite. Le serveur annonce ensuite qu’il est prêt : « +OK Dovecot ready ».',why:'Sur le port 110 (sans TLS), l’identifiant et le mot de passe circulent en clair. Le port 995 évite ce risque.',look:'Les paquets sont verts : ils sont chiffrés dès l’établissement de la connexion.',w:'Filtre <code>tcp.port == 995</code>. Sans TLS, le filtre <code>pop</code> affiche les commandes en clair.'},
   {t:'Connexion',what:'Le client envoie <b>USER bob</b> puis <b>PASS</b>. À chaque commande, le serveur répond « +OK » (succès) ou « -ERR » (échec).',why:'Le dialogue POP3 est très simple : commandes courtes en texte, réponses sur une ligne. C’est ce qui en fait un protocole facile à diagnostiquer à la main.',look:'Ouvrez les paquets : dans le cadre « Chiffré », on lit ce qui est transmis à l’intérieur du tunnel.',w:'En cas de « -ERR », lire le texte qui suit : il précise souvent la cause (mot de passe, verrouillage de boîte).'},
   {t:'Consulter la boîte',what:'<b>STAT</b> donne le nombre de messages et leur taille totale ; <b>LIST</b> donne la taille de chacun. Ici : 2 messages, 5120 octets.',why:'Le client peut ainsi décider quoi télécharger avant de transférer des données volumineuses.',look:'Courtes questions, courtes réponses : aucun contenu de message n’est encore transféré.',w:'La somme des tailles de LIST doit être égale au total de STAT : 1904 + 3216 = 5120.'},
   {t:'Télécharger',what:'<b>RETR 1</b> demande le message n° 1. Le serveur l’envoie en entier, en-têtes et corps, puis une ligne ne contenant qu’un point pour marquer la fin.',why:'POP3 transfère le message complet vers le poste : la copie locale devient la seule copie si le serveur supprime ensuite l’original.',look:'La réponse est le plus gros paquet de la session.',w:'Une réponse « RETR » est terminée par « CRLF.CRLF ».'},
   {t:'Supprimer et quitter',what:'<b>DELE 1</b> marque le message à supprimer ; il n’est effacé qu’à la commande <b>QUIT</b>. Le serveur confirme alors la suppression.',why:'La suppression différée permet d’annuler si la connexion se coupe avant QUIT. Beaucoup de clients proposent aussi « laisser une copie sur le serveur ».',look:'Le message 1 disparaît du serveur à la dernière réponse.',w:'Si les messages disparaissent du webmail, c’est que le client POP3 les supprime après téléchargement : utiliser IMAP ou laisser une copie.'}
  ],pk:b.pk};
})();

/* ====================== IMAP ====================== */

 U(0.182,31,'a4 IDLE',['a4 IDLE'],'Le client demande à être prévenu dès qu’un nouveau message arrive : mode IDLE.');

 U(42.53,28,'DONE',['DONE'],'Le client termine le mode IDLE pour aller chercher le nouveau message.');

 D.IMAP={name:'IMAP',full:'Internet Message Access Protocol',scene:{layout:'wan1',sub:'none',nodes:{srv:{name:'imap.example.org',ip:'198.51.100.143'}}},
  goal:'IMAP permet de consulter et d’organiser son courrier directement sur le serveur : téléphone, ordinateur et webmail voient la même boîte, avec les mêmes dossiers et les mêmes messages lus ou non.',
  analogy:'IMAP est une consigne dans laquelle on laisse son courrier : on peut le consulter depuis plusieurs endroits sans jamais le sortir. Où que l’on soit, l’état de la consigne (lu, rangé, supprimé) est le même.',
  prereq:['TCP','TLS/SSL','POP3'],
  facts:[['Couche OSI','7 — Application'],['Transport','TCP : port 993 (TLS) ou 143'],['Commandes','Précédées d’une étiquette (a1, a2…)'],['Particularité','Les messages restent sur le serveur'],['Notification','IDLE : le serveur prévient du nouveau courrier'],['Norme','RFC 9051']],
  words:[['Étiquette (tag)','identifie la commande ; la réponse reprend la même'],['SELECT','ouvre un dossier'],['FETCH','lit un message ou une partie'],['Indicateur (flag)','état d’un message : \\Seen (lu), \\Deleted…'],['IDLE','attente et notification du serveur']],
  steps:[
   {t:'Se connecter en sécurité (993)',what:'Le client de Bob ouvre une connexion TCP vers le port 993 et négocie TLS dès le départ. Le serveur annonce ses capacités, dont IDLE.',why:'Comme pour POP3, le port 993 garantit que l’identifiant et le mot de passe ne circulent pas en clair.',look:'Même début que POP3 : les paquets sont chiffrés.',w:'Filtre <code>tcp.port == 993</code>.'},
   {t:'Connexion',what:'Chaque commande IMAP porte une <b>étiquette</b> (a1, a2…). Le serveur répond avec la même étiquette, ce qui permet d’envoyer plusieurs commandes sans attendre les réponses.',why:'Contrairement à POP3, IMAP est conçu pour des sessions longues et des commandes en parallèle : l’étiquette évite toute confusion.',look:'Comparez « a1 LOGIN » et « a1 OK » : la même étiquette relie la question à sa réponse.',w:'Filtre <code>imap</code> (sur une capture déchiffrée ou sans TLS).'},
   {t:'Ouvrir la boîte de réception',what:'<b>SELECT INBOX</b> ouvre un dossier. Le serveur indique combien de messages il contient (ici 2) et dans quel mode (lecture/écriture).',why:'IMAP gère plusieurs dossiers sur le serveur (Boîte de réception, Envoyés, Archives…) : il faut en choisir un avant de lire.',look:'Aucun message n’est téléchargé : seul l’état du dossier est transmis.',w:'Les lignes qui commencent par « * » sont des informations non sollicitées (untagged responses).'},
   {t:'Lire un message',what:'<b>FETCH 2 BODY[]</b> demande le contenu du message n° 2. Le serveur le renvoie et ajoute l’indicateur <b>\\Seen</b> : le message est maintenant « lu » pour tous les appareils.',why:'C’est le serveur qui garde l’état de chaque message. C’est ce qui permet de retrouver, sur le téléphone, ce qui a été lu sur l’ordinateur.',look:'Le plus gros paquet de la session : le message arrive, mais reste stocké sur le serveur.',w:'On peut ne récupérer que les en-têtes (<code>FETCH 2 BODY[HEADER]</code>) pour économiser de la bande passante.'},
   {t:'Attendre un nouveau courrier',what:'Avec <b>IDLE</b>, le client garde la connexion ouverte et le serveur le prévient dès qu’un nouveau message arrive. Le client termine l’attente par <b>DONE</b> pour aller chercher le message.',why:'IDLE évite d’interroger le serveur toutes les minutes : le courrier arrive « en direct » et la batterie du téléphone est ménagée.',look:'Un long silence (plus de 40 secondes) puis le serveur parle de lui-même : c’est une notification « poussée ».',w:'Les pare-feu et NAT peuvent couper une connexion inactive : certains clients renvoient IDLE toutes les 29 minutes.'}
  ],pk:b.pk};
})();

/* ====================== ARP ====================== */
(function(){
 const b=Builder(),PC='00:00:5e:00:53:10',PC2='00:00:5e:00:53:11',PRN='00:00:5e:00:53:20',RT='00:00:5e:00:53:01',Z='00:00:00:00:00:00';

 D.ARP={name:'ARP',full:'Address Resolution Protocol',scene:{layout:'lan',sub:'none',nodes:{pc2:{name:'PC voisin',role:'Peut être malveillant'}}},
  goal:'ARP permet de retrouver l’adresse MAC d’un équipement dont on connaît l’adresse IP, sur le réseau local. Sans lui, un poste saurait à qui il veut parler (IP) mais pas à quelle carte réseau remettre la trame (MAC).',
  analogy:'Dans une salle de classe, vous cherchez Marie sans savoir où elle est assise. Vous demandez à voix haute « Qui est Marie ? » (diffusion). Seule Marie répond, et vous notez sa place dans votre carnet (cache ARP). Mais rien ne vous empêche de croire un élève qui répondrait faussement « C’est moi ».',
  prereq:['IP'],
  facts:[['Couche OSI','2 / 3 (entre liaison et réseau)'],['Portée','Réseau local uniquement : jamais routé'],['Requête','Diffusée à tous (ff:ff:ff:ff:ff:ff)'],['Réponse','Envoyée directement au demandeur'],['Mémoire','Cache ARP (quelques minutes)'],['Norme','RFC 826']],
  words:[['Adresse MAC','identifiant de la carte réseau, 48 bits'],['Cache ARP','table IP ↔ MAC conservée un moment'],['Diffusion (broadcast)','trame reçue par tous les équipements du réseau'],['Passerelle','routeur par lequel on sort du réseau local'],['ARP spoofing','fausses réponses ARP pour se faire passer pour un autre'],['Gratuitous ARP','annonce spontanée de sa propre adresse']],
  steps:[
   {t:'Le cache ARP est vide',what:'Le poste 192.168.1.10 veut parler à l’imprimante 192.168.1.20. Il connaît son adresse IP, mais pour fabriquer une trame Ethernet il lui faut aussi son adresse MAC. Il consulte son cache ARP : aucune entrée.',why:'Les switchs livrent les trames avec les adresses MAC, pas avec les adresses IP. Il faut donc une table de correspondance entre les deux.',look:'Aucun paquet ne circule encore. Le poste a une IP cible mais pas de MAC.',bub:['pc','Cache ARP : vide\nJe ne connais pas la MAC de .20',''],
    extra:'<span class="lab">Cache ARP du poste (commande <code>arp -a</code>)</span><table class="calc"><tr><th>Adresse IP</th><th>Adresse MAC</th></tr><tr><td colspan="2" class="x">(aucune entrée)</td></tr></table>',w:'À cette étape, rien dans la capture. La première trame sera la requête ARP.'},
   {t:'La requête : « Qui possède cette IP ? »',what:'Le poste envoie une requête ARP <b>en diffusion</b>. Elle contient sa propre IP et sa propre MAC (pour que l’autre puisse répondre) et l’adresse IP recherchée. Le switch la copie sur tous ses ports : tous les équipements la reçoivent.',why:'Le poste ne sait pas où se trouve l’imprimante : le seul moyen de la joindre est de poser la question à tout le monde.',look:'Suivez la diffusion : le switch duplique la trame. L’imprimante répond « C’est mon adresse », les autres équipements l’ignorent.',w:'Filtre <code>arp</code>. La destination Ethernet est ff:ff:ff:ff:ff:ff. Le champ « Target MAC » est à 00:00:00:00:00:00 car c’est justement ce qu’on cherche.'},
   {t:'La réponse arrive',what:'L’imprimante reconnaît son adresse et répond <b>directement</b> au poste, sans diffusion, en donnant sa MAC. Le poste inscrit « 192.168.1.20 ↔ MAC de l’imprimante » dans son cache.',why:'Seul le demandeur a besoin de la réponse : inutile de déranger les autres. L’imprimante apprend aussi, au passage, la MAC du poste grâce à la requête.',look:'La réponse suit un seul chemin, contrairement à la requête.',w:'Cherchez « 192.168.1.20 is at … ». Requête et réponse portent le même type Ethernet 0x0806.'},
   {t:'Le cache et sa durée de vie',what:'Pour ne pas poser la question avant chaque trame, le poste garde la réponse dans son cache. L’entrée expire au bout de quelques minutes (la durée dépend du système) puis la question est reposée si besoin.',why:'Les adresses IP changent de propriétaire (DHCP, changement de matériel) : un cache trop ancien enverrait des trames à la mauvaise machine.',look:'Le poste connaît maintenant la MAC de l’imprimante : les trames suivantes partiront directement.',bub:['pc','Cache ARP : 192.168.1.20 ↔ MAC de l’imprimante',''],
    extra:'<span class="lab">Cache ARP du poste après la réponse</span><table class="calc"><tr><th>Adresse IP</th><th>Adresse MAC</th><th>Type</th></tr><tr><td>192.168.1.20</td><td class="m">00:00:5e:00:53:20</td><td>dynamique</td></tr></table>Commandes : <code>arp -a</code> (Windows, Linux), <code>ip neigh</code> (Linux).',w:'Une entrée « incomplete » dans <code>ip neigh</code> signifie qu’une requête est partie sans réponse : équipement éteint ou injoignable.'},
   {t:'Vers Internet : on demande la passerelle',what:'Le poste veut joindre 203.0.113.10, hors de son réseau. Il ne cherche <b>pas</b> la MAC de ce serveur : il demande celle de sa passerelle (192.168.1.1), à qui il confiera la trame. ARP ne sort jamais du réseau local.',why:'La MAC d’un serveur lointain n’aurait aucun sens : chaque routeur remplace de toute façon les adresses MAC sur chaque lien.',look:'Même schéma : requête en diffusion, réponse directe. Le routeur est le seul à répondre.',w:'Si la passerelle ne répond pas à l’ARP, aucun accès extérieur n’est possible : vérifier le câblage, le masque et l’adresse de passerelle.'},
   {t:'L’attaque : ARP spoofing',what:'ARP ne vérifie pas l’identité de celui qui répond. Un poste malveillant peut envoyer une réponse non sollicitée : « 192.168.1.1, c’est moi, voici ma MAC ». Le poste de la victime met à jour son cache et envoie désormais tout son trafic vers l’attaquant.',why:'C’est la base d’une attaque de l’homme du milieu (man-in-the-middle) sur un réseau local : l’attaquant lit, voire modifie, le trafic avant de le transmettre à la vraie passerelle.',look:'Comparez avec la vraie réponse de l’étape précédente : même forme, mais cette fois personne n’avait posé de question.',w:'Signes dans Wireshark : réponses ARP sans requête, même IP annoncée avec deux MAC différentes (« duplicate IP address detected »).'}
  ],pk:b.pk};
})();

 D.NTP={name:'NTP',full:'Network Time Protocol',scene:{layout:'wan1',sub:'none',nodes:{srv:{name:'Serveur NTP',ip:'203.0.113.123'}}},
  goal:'NTP synchronise l’horloge d’un équipement sur celle d’un serveur de temps, à quelques millisecondes près, en tenant compte du temps que met le message à voyager.',
  analogy:'Vous réglez votre montre sur celle d’un ami qui habite loin et vous parle au téléphone. Vous savez que sa phrase met un peu de temps à vous parvenir : vous mesurez ce délai et vous le déduisez avant de régler votre montre.',
  prereq:['UDP'],
  facts:[['Couche OSI','7 — Application'],['Transport','UDP, port 123'],['Précision','Quelques ms sur Internet, moins en local'],['Hiérarchie','Strates : stratum 0 (horloge atomique/GPS), 1, 2…'],['Fréquence','Toutes les 1 à 17 minutes en général'],['Norme','RFC 5905 (NTPv4)']],
  words:[['Stratum','niveau dans la hiérarchie ; plus il est petit, plus la source est précise'],['Décalage (offset)','écart entre l’horloge locale et celle du serveur'],['Délai (delay)','temps aller-retour dans le réseau'],['Dérive (drift)','l’horloge d’un ordinateur avance ou retarde naturellement'],['NTS','extension qui authentifie et protège NTP'],['Pool','ensemble de serveurs publics partagés']],
  steps:[
   {t:'Pourquoi l’heure compte',what:'Un ordinateur compte le temps avec un petit oscillateur qui dérive de quelques secondes par jour. Si deux machines ne sont pas à la même heure, des problèmes inattendus apparaissent.',why:'Les certificats TLS ont des dates de validité, Kerberos refuse un écart de plus de 5 minutes, et des journaux décalés rendent une enquête de sécurité impossible : on ne sait plus dans quel ordre les événements se sont produits.',look:'Ici le poste a 3,2 secondes de retard sur la vraie heure. NTP va le mesurer.',bub:['pc','Mon horloge retarde de 3,2 s\n(je ne le sais pas)',''],w:'Symptômes classiques d’une horloge fausse : « certificat non valide », échec d’authentification dans le domaine, journaux incohérents.'},
   {t:'Le client interroge le serveur',what:'Le client envoie un petit message UDP de 48 octets. Il y inscrit l’heure de son horloge au moment du départ : <b>T1</b>.',why:'T1 sera renvoyé par le serveur. Il permet au client de calculer, plus tard, le temps passé sur le réseau sans dépendre d’aucune horloge extérieure.',look:'UDP suffit : une seule question, une seule réponse. Si rien ne revient, le client essaiera de nouveau.',w:'Filtre <code>ntp</code>. Le champ « Mode » vaut 3 pour un client, 4 pour un serveur.'},
   {t:'Le serveur répond avec trois heures',what:'Le serveur renvoie <b>T1</b> tel quel, l’heure où il a reçu la demande (<b>T2</b>) et l’heure où il envoie la réponse (<b>T3</b>). À l’arrivée, le client note T4, l’heure d’arrivée sur sa propre horloge.',why:'Avec quatre dates (T1 à T4), le client peut séparer le temps passé sur le réseau du temps de traitement chez le serveur.',look:'Cliquez sur le paquet : le contenu affiche les trois dates du serveur. Le « stratum 2 » indique que le serveur est lui-même synchronisé sur une source de niveau 1.',w:'Le stratum 16 signifie « non synchronisé » : le serveur ne doit pas être utilisé comme source.'},
   {t:'Calculer décalage et délai',what:'Le client calcule deux valeurs à partir des quatre dates. Le <b>décalage</b> est la moyenne des écarts dans les deux sens : (T2 − T1 + T3 − T4) / 2. Le <b>délai</b> est le temps de trajet aller-retour moins le temps de traitement : (T4 − T1) − (T3 − T2).',why:'On suppose que l’aller et le retour durent autant. C’est ce qui permet d’annuler l’effet du réseau et d’obtenir l’écart réel entre les deux horloges.',look:'Les chiffres de l’exemple sont dans le tableau : 3,200 s de décalage, 40 ms de délai.',
    extra:'<span class="lab">Calcul avec les quatre dates (en secondes)</span><table class="calc"><tr><th>Date</th><th>Signification</th><th>Valeur</th></tr><tr><td>T1</td><td>départ (horloge client)</td><td class="m">0,000</td></tr><tr><td>T2</td><td>arrivée (horloge serveur)</td><td class="m">3,220</td></tr><tr><td>T3</td><td>réponse (horloge serveur)</td><td class="m">3,221</td></tr><tr><td>T4</td><td>retour (horloge client)</td><td class="m">0,041</td></tr><tr><td colspan="2">Décalage = (3,220 + 3,180) / 2</td><td class="x">3,200 s</td></tr><tr><td colspan="2">Délai = 0,041 − 0,001</td><td class="x">0,040 s</td></tr></table>',w:'La commande <code>ntpq -p</code> (ou <code>chronyc sources</code>) affiche ces valeurs : colonnes « delay » et « offset ».',bub:['pc','Décalage = 3,2 s\nDélai = 40 ms',''] },
   {t:'Corriger et répéter',what:'Pour un petit écart, le client accélère ou ralentit son horloge très légèrement (le temps ne fait jamais de saut en arrière). Pour un grand écart, il la remet d’un coup à l’heure, une seule fois. Il recommence ensuite toutes les minutes environ.',why:'Un saut en arrière pourrait faire exécuter deux fois une tâche planifiée ou désordonner des fichiers journaux. Les corrections progressives évitent cela.',look:'La deuxième série d’échanges, une minute plus tard, mesure un décalage de 1 ms : l’horloge est à l’heure.',w:'Sous Windows : <code>w32tm /query /status</code>. Sous Linux : <code>timedatectl</code>, <code>chronyc tracking</code>.'},
   {t:'Sécurité',what:'NTP utilise UDP sans authentification par défaut : un attaquant peut répondre à la place du serveur et fausser l’heure. De vieux serveurs mal configurés pouvaient aussi servir à amplifier des attaques par déni de service.',why:'Une heure falsifiée suffit à faire accepter un certificat expiré ou à casser l’authentification du domaine.',look:'Aucun paquet nouveau : retenez les parades.',w:'Bonnes pratiques : utiliser plusieurs sources, un serveur interne pour le parc, NTS (RFC 8915) si possible, et autoriser seulement UDP 123 vers ces serveurs.'}
  ],pk:b.pk};
})();

 D.SNMP={name:'SNMP',full:'Simple Network Management Protocol',scene:{layout:'lan',sub:'none',nodes:{pc:{name:'Superviseur',role:'Outil de supervision'},prn:{name:'Agent SNMP',role:'Imprimante supervisée',ip:'192.168.1.20'}}},
  goal:'SNMP permet à un logiciel de supervision d’interroger des équipements (switchs, routeurs, imprimantes, serveurs) pour connaître leur état, et de recevoir leurs alertes.',
  analogy:'Un gardien fait sa ronde et pose des questions simples à chaque équipement : « Quelle est ta charge ? Ton niveau de toner ? ». S’il y a un problème, l’équipement sonne l’alarme sans attendre le passage du gardien (trap).',
  prereq:['UDP'],
  facts:[['Couche OSI','7 — Application'],['Transport','UDP : 161 (requêtes), 162 (alertes)'],['Rôles','Gestionnaire (superviseur) et agent (équipement)'],['Données','Arborescence d’OID décrite dans des MIB'],['Versions','v1, v2c (communauté en clair), v3 (sécurisée)'],['Norme','RFC 3411 à 3418 (v3)']],
  words:[['Agent','logiciel de l’équipement qui répond aux questions'],['Gestionnaire','outil de supervision (Zabbix, PRTG, Nagios…)'],['OID','numéro qui désigne une valeur, comme 1.3.6.1.2.1.1.1.0'],['MIB','dictionnaire qui décrit les OID d’un équipement'],['Communauté','mot de passe en clair de SNMP v1 et v2c'],['Trap','alerte envoyée spontanément par l’agent']],
  steps:[
   {t:'Superviseur, agent et OID',what:'Le superviseur interroge l’imprimante qui exécute un <b>agent</b> SNMP. Chaque information est repérée par un numéro appelé <b>OID</b>, rangé dans une arborescence : <code>1.3.6.1.2.1.1.1.0</code> désigne la description du système. Une <b>MIB</b> traduit ces numéros en noms lisibles.',why:'Tous les constructeurs partagent la même arborescence de base. Un seul outil peut donc surveiller des équipements très différents.',look:'Aucun paquet encore. Le superviseur va lire des valeurs sur l’imprimante.',bub:['pc','Superviseur :\nje vais interroger l’imprimante',''],
    extra:'<span class="lab">Quelques OID utiles</span><table class="calc"><tr><th>OID</th><th>Signification</th></tr><tr><td>1.3.6.1.2.1.1.1.0</td><td>sysDescr : description</td></tr><tr><td>1.3.6.1.2.1.1.3.0</td><td>sysUpTime : durée depuis le démarrage</td></tr><tr><td>1.3.6.1.2.1.2.2.1.10</td><td>ifInOctets : octets reçus par interface</td></tr><tr><td>1.3.6.1.2.1.43.11.1.1.9</td><td>niveau des consommables (imprimante)</td></tr></table>',w:'Aucune capture à cette étape. Les requêtes partent vers UDP 161.'},
   {t:'GET : lire une valeur',what:'Le superviseur envoie un <b>get-request</b> avec l’OID voulu et la communauté « public ». L’agent répond par un <b>get-response</b> contenant la valeur.',why:'C’est l’opération de base : poser une question précise et obtenir une réponse précise. Une requête, une réponse : UDP suffit.',look:'Cliquez sur les paquets : la communauté « public » est écrite en clair dans le message.',w:'Filtre <code>snmp</code>. Dans les détails, on lit la version, la communauté, l’OID et la valeur.'},
   {t:'Surveiller dans la durée',what:'Un superviseur répète ses questions à intervalle régulier : ici le niveau de toner (7 %). En conservant les valeurs, il trace des courbes et déclenche une alerte quand un seuil est franchi.',why:'Détecter un problème avant les utilisateurs : disque presque plein, lien saturé, toner presque vide.',look:'Les deux échanges se ressemblent : seul l’OID change.',w:'Commande de test : <code>snmpget -v2c -c public 192.168.1.20 1.3.6.1.2.1.1.1.0</code>.'},
   {t:'GETNEXT : parcourir l’arbre',what:'Pour découvrir ce que propose un équipement, on utilise <b>getnext</b> : « donne-moi la valeur qui suit cet OID ». En répétant, on parcourt toute l’arborescence. C’est ce que fait la commande <code>snmpwalk</code>.',why:'On ne connaît pas toujours à l’avance tous les OID d’un équipement : le parcours permet de les énumérer (ports, interfaces, capteurs…).',look:'L’agent renvoie l’OID suivant avec sa valeur.',w:'<code>snmpwalk -v2c -c public 192.168.1.20</code> génère des dizaines de paquets de ce type.'},
   {t:'Le trap : l’agent prend la parole',what:'Quand un événement important se produit, l’agent envoie un <b>trap</b> vers le port 162 du superviseur, sans attendre d’être interrogé.',why:'L’interrogation régulière a un délai. Le trap prévient immédiatement d’un événement : lien coupé, redémarrage, toner presque vide.',look:'Le sens de la flèche s’inverse : c’est l’imprimante qui initie l’échange, vers le port 162.',w:'Filtre <code>udp.port == 162</code>. Un trap n’est pas acquitté : s’il est perdu, personne ne le sait (les « inform » sont acquittés).'},
   {t:'SET et sécurité',what:'Avec une communauté en écriture (« private »), l’opération <b>set-request</b> permet de <b>modifier</b> la configuration de l’équipement. Ici, quelqu’un qui connaît la communauté change le contact enregistré.',why:'Dans les versions 1 et 2c, la communauté est un mot de passe en clair, souvent laissé à sa valeur par défaut (« public », « private »). Un attaquant peut lire des informations sensibles, voire reconfigurer le matériel.',look:'La communauté « private » est lisible dans le paquet. SNMPv3 chiffre et authentifie.',w:'Parades : SNMPv3 (authPriv), communautés personnalisées, accès en lecture seule, filtrage par adresse du superviseur.'}
  ],pk:b.pk};
})();

 D.Syslog={name:'Syslog',full:'System Logging Protocol',scene:{layout:'lan',sub:'none',nodes:{prn:{name:'Serveur web',k:'srv',ip:'192.168.1.20'},pc2:{name:'Serveur Syslog',k:'srv',ip:SRVIP}}},
  goal:'Syslog transporte les messages de journal d’équipements et de serveurs vers un serveur central, pour les conserver, les rechercher et les corréler.',
  analogy:'Chaque équipement tient un cahier de bord. Syslog, c’est le facteur qui apporte une copie de chaque page à un bureau central, de sorte qu’un intrus qui brûle le cahier local ne puisse pas effacer ses traces.',
  prereq:['UDP'],
  facts:[['Couche OSI','7 — Application'],['Transport','UDP 514 (classique), TCP 514 ou TCP/TLS 6514'],['Message','Texte : priorité, date, machine, programme, contenu'],['Priorité','Un nombre = installation × 8 + gravité'],['Fiabilité','UDP : aucune garantie de remise'],['Norme','RFC 5424 (format), RFC 5426 (UDP)']],
  words:[['Priorité (PRI)','nombre entre < > au début du message'],['Facility','catégorie de la source (auth, daemon, local0…)'],['Severity','gravité de 0 (urgence) à 7 (débogage)'],['Collecteur','serveur qui reçoit les journaux'],['rsyslog / syslog-ng','logiciels courants'],['SIEM','outil qui analyse et corrèle les journaux']],
  steps:[
   {t:'Pourquoi centraliser les journaux',what:'Chaque machine écrit ses événements dans des fichiers locaux (/var/log, observateur d’événements). Mais un incident implique souvent plusieurs machines, et un attaquant qui prend le contrôle d’une machine peut effacer ses journaux locaux.',why:'Un serveur central conserve une copie hors d’atteinte, permet de chercher dans toutes les sources et de reconstituer la chronologie d’une attaque.',look:'Le serveur web et la box vont envoyer leurs lignes de journal au serveur Syslog.',bub:['pc2','Collecteur Syslog :\nj’attends les journaux sur UDP 514',''],w:'Aucune capture à cette étape.'},
   {t:'Le message Syslog',what:'Une ligne de journal est envoyée dans un datagramme UDP vers le port 514. Elle commence par un nombre entre chevrons, la <b>priorité</b>, suivi de la version, de la date, du nom de la machine, du programme et du message.',why:'Le format est simple pour que des équipements de toutes marques puissent l’envoyer. La priorité permet au collecteur de trier : classer par source et par gravité.',look:'Cliquez sur le paquet : la ligne est lisible en clair. <code>&lt;134&gt;</code> = facility 16 (local0) × 8 + gravité 6 (info).',
    extra:'<span class="lab">Décoder la priorité : PRI = facility × 8 + severity</span><table class="calc"><tr><th>PRI</th><th>Calcul</th><th>Sens</th></tr><tr><td>&lt;134&gt;</td><td>16 × 8 + 6</td><td class="m">local0, information</td></tr><tr><td>&lt;38&gt;</td><td>4 × 8 + 6</td><td class="m">auth, information</td></tr><tr><td>&lt;30&gt;</td><td>3 × 8 + 6</td><td class="m">daemon, information</td></tr></table>',w:'Filtre <code>syslog</code>. Wireshark décode « Facility » et « Level » à partir du nombre PRI.'},
   {t:'Plusieurs sources, un seul endroit',what:'La box et le serveur web envoient chacun leurs lignes au même collecteur. Il les range par source et par heure : on y voit un bail DHCP, puis une série d’échecs de connexion SSH.',why:'C’est la corrélation : un seul événement est anodin, mais un DHCP suivi de dix échecs de connexion depuis la même adresse raconte une histoire.',look:'Les messages arrivent de deux machines différentes vers la même destination.',w:'Côté serveur Linux : <code>logger -n 192.168.1.50 -P 514 "test"</code> envoie un message de test.'},
   {t:'Les niveaux de gravité',what:'Le niveau va de 0 (le système est inutilisable) à 7 (messages de débogage). Les équipements n’envoient que les niveaux jugés utiles pour limiter le volume.',why:'Journaliser trop produit un volume ingérable ; pas assez fait manquer l’information. Le niveau permet de régler ce compromis.',look:'Les trois messages de l’exemple sont tous de gravité 6 (information).',
    extra:'<span class="lab">Les huit niveaux</span><table class="calc"><tr><th>Niveau</th><th>Nom</th><th>Exemple</th></tr><tr><td>0</td><td>Emergency</td><td>système inutilisable</td></tr><tr><td>1</td><td>Alert</td><td>action immédiate requise</td></tr><tr><td>2</td><td>Critical</td><td>panne matérielle</td></tr><tr><td>3</td><td>Error</td><td>erreur applicative</td></tr><tr><td>4</td><td>Warning</td><td>situation anormale</td></tr><tr><td>5</td><td>Notice</td><td>événement notable</td></tr><tr><td>6</td><td>Informational</td><td>fonctionnement normal</td></tr><tr><td>7</td><td>Debug</td><td>détails pour le dépannage</td></tr></table>',w:'Un filtre de collecteur typique : tout ce qui est « warning » ou plus grave (niveau ≤ 4).'},
   {t:'Le défaut d’UDP',what:'Syslog classique utilise UDP : aucun accusé de réception. Si un message est perdu (congestion, serveur indisponible), personne ne le sait. Ici, la ligne « Accepted password for root » disparaît.',why:'Ce sont justement des événements importants, comme une connexion réussie après plusieurs échecs, qui manquent dans le journal.',look:'Le paquet disparaît au niveau du switch ; l’émetteur ne reçoit aucun message d’erreur.',w:'Chercher des trous dans la numérotation ou dans la chronologie des messages reçus.'},
   {t:'Fiabiliser et protéger',what:'On peut envoyer les journaux en TCP, ou mieux en TCP avec TLS (port 6514) : remise garantie et contenu protégé. Les logiciels comme rsyslog gardent aussi une file d’attente locale si le collecteur est indisponible.',why:'Les journaux contiennent des adresses, des noms d’utilisateurs, parfois des secrets. Il faut protéger leur transport et leur intégrité, car ils servent de preuve.',look:'Aucun nouveau paquet : retenez les trois niveaux de fiabilité (UDP, TCP, TCP + TLS).',w:'Réglage rsyslog : <code>*.* @@192.168.1.50:514</code> (deux @ = TCP, un @ = UDP).'}
  ],pk:b.pk};
})();
