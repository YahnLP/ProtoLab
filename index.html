 D.Telnet={name:'Telnet',full:'Teletype Network',scene:{layout:'lan',sub:'none',nodes:{prn:{name:'Switch admin',role:'Équipement administrable',k:'sw',ip:'192.168.1.250',mac:'00:00:5e:00:53:fa'}}},
  goal:'Telnet ouvre une session en ligne de commande sur une machine ou un équipement distant. Il a été remplacé par SSH parce que tout, y compris le mot de passe, circule en clair.',
  analogy:'Telnet, c’est téléphoner à un collègue en mettant le haut-parleur dans une salle ouverte : tout ce que vous dites, y compris votre code secret, peut être entendu par n’importe qui dans la pièce.',
  prereq:['TCP'],
  facts:[['Couche OSI','7 — Application'],['Transport','TCP, port 23'],['Sécurité','Aucune : tout est lisible'],['Remplaçant','SSH (port 22)'],['Particularité','Un paquet par touche tapée'],['Norme','RFC 854']],
  words:[['IAC','« Interpret As Command » : octet qui introduit une option'],['WILL / DO','« je veux activer » / « active »'],['Écho','le serveur renvoie chaque caractère pour l’afficher'],['Terminal virtuel','fenêtre texte de la session distante'],['Sniffing','écoute passive du réseau']],
  steps:[
   {t:'Ouvrir la connexion',what:'Le poste d’administration ouvre une connexion TCP vers le port 23 du switch, avec la poignée de main habituelle (SYN, SYN-ACK, ACK).',why:'Telnet repose sur TCP : on est sûr de ne perdre aucun caractère.',look:'Trois paquets, comme pour n’importe quelle connexion TCP.',w:'Filtre <code>telnet</code> ou <code>tcp.port == 23</code>.'},
   {t:'Négocier les options',what:'Les deux côtés se mettent d’accord sur le mode de fonctionnement : le type de terminal, la taille de la fenêtre, et surtout l’<b>écho</b> : c’est le serveur qui renvoie chaque caractère tapé. Ces commandes sont précédées d’un octet spécial « IAC ».',why:'À l’époque des terminaux distants, il existait de nombreux modèles très différents ; la négociation permettait de s’adapter.',look:'Ouvrez les paquets : les lignes « IAC DO … / WILL … » sont les options proposées et acceptées.',w:'Dans Wireshark, ces octets apparaissent comme « Telnet Command : Will Echo ».'},
   {t:'Taper l’identifiant',what:'Chaque touche tapée par l’utilisateur part dans <b>un paquet à elle seule</b>, et le serveur répond par un autre paquet qui contient le même caractère (l’écho), ce qui l’affiche à l’écran.',why:'C’est pourquoi une session Telnet génère énormément de petits paquets : un aller-retour par touche. Et chaque lettre est lisible dans la capture.',look:'Comptez : pour taper « admin » puis Entrée, il y a six paquets du client ; le serveur en renvoie cinq (l’écho de chaque lettre), puis l’invite du mot de passe.',w:'Clic droit sur un paquet → Suivre → Flux TCP : toute la conversation s’affiche en texte.'},
   {t:'Le mot de passe en clair',what:'Le serveur n’affiche pas le mot de passe à l’écran, mais cela ne change rien sur le réseau : chaque caractère est envoyé dans un paquet lisible.',why:'N’importe quel équipement placé sur le trajet, ou n’importe qui capturant le trafic, récupère l’identifiant et le mot de passe. Un même mot de passe réutilisé ailleurs est alors compromis.',look:'Ouvrez les paquets du mot de passe : la lettre est visible dans le contenu. Regardez la bulle sur le switch.',w:'Un attaquant sur le même réseau (ARP spoofing, port miroir) retrouve le mot de passe en quelques secondes.'},
   {t:'Session ouverte puis fermée',what:'Le switch accepte la connexion et affiche son invite de commande. L’administrateur peut tout faire, puis ferme la session : chaque côté envoie un FIN.',why:'Un accès d’administration non protégé met en danger tout le réseau : l’attaquant peut reconfigurer le switch.',look:'La connexion se termine par deux paquets FIN.',w:'Désactiver Telnet sur les équipements : <code>no transport input telnet</code> (Cisco) ou activer uniquement SSH.'},

   sw:{name:'Switch 1'},sw2:{name:'Switch 2'}}},
  goal:'Un VLAN découpe un même réseau physique en plusieurs réseaux logiques séparés. Les postes d’un VLAN ne voient ni les diffusions ni le trafic des autres VLAN, même s’ils sont branchés sur les mêmes switchs.',
  analogy:'Imaginez un grand immeuble avec un seul réseau de couloirs. Les VLAN, ce sont des couloirs colorés : les employés de la compta ne croisent que des couloirs rouges, ceux de l’informatique que des couloirs bleus, alors que tout passe par les mêmes murs.',
  prereq:['ARP'],
  facts:[['Couche OSI','2 — Liaison'],['Norme','IEEE 802.1Q'],['Étiquette (tag)','4 octets, dont l’identifiant VLAN sur 12 bits (1 à 4094)'],['Ports d’accès','Un seul VLAN, trame sans étiquette'],['Ports trunk','Plusieurs VLAN, trames étiquetées'],['Entre VLAN','Il faut un routeur (ou un switch de niveau 3)']],
  words:[['VLAN ID','numéro du VLAN, de 1 à 4094'],['Port d’accès (access)','port d’un seul VLAN, relié à un poste'],['Port trunk','lien qui transporte plusieurs VLAN entre switchs'],['Étiquette 802.1Q','4 octets ajoutés dans la trame sur un trunk'],['VLAN natif','VLAN dont les trames ne sont pas étiquetées sur le trunk'],['Domaine de diffusion','ensemble des machines qui reçoivent un broadcast']],
  steps:[
   {t:'Un câblage, deux réseaux logiques',what:'Deux switchs relient deux services : la comptabilité (VLAN 10) et l’informatique (VLAN 20). On configure chaque port d’accès avec son VLAN. Les deux switchs sont reliés par un seul câble : le <b>trunk</b>, qui transporte tous les VLAN.',why:'Sans VLAN, il faudrait un switch par service ou un câble par réseau. Les VLAN permettent de séparer les services sans multiplier le matériel, et de limiter ce qu’un poste peut atteindre.',look:'Repérez le lien épais : c’est le trunk 802.1Q.',bub:['sw','Port d’accès VLAN 10 / VLAN 20\nPort trunk vers Switch 2',''],
    extra:'<span class="lab">Configuration des ports</span><table class="calc"><tr><th>Équipement</th><th>Port</th><th>Mode</th><th>VLAN</th></tr><tr><td>PC Compta 1</td><td>Switch 1, port 1</td><td>accès</td><td class="m">10</td></tr><tr><td>PC Informatique</td><td>Switch 1, port 2</td><td>accès</td><td class="x">20</td></tr><tr><td>Switch 1 ↔ 2</td><td>port 24</td><td>trunk</td><td>10 et 20</td></tr><tr><td>PC Compta 2</td><td>Switch 2, port 1</td><td>accès</td><td class="m">10</td></tr><tr><td>Serveur Info</td><td>Switch 2, port 2</td><td>accès</td><td class="x">20</td></tr></table>',w:'Aucune capture à cette étape. Les étiquettes n’apparaîtront que sur le lien entre switchs.'},

   {t:'Passer d’un VLAN à l’autre : le routage',what:'Deux VLAN sont deux réseaux IP distincts (ici 192.168.10.0/24 et 192.168.20.0/24). Pour qu’ils communiquent, il faut un routeur : un seul câble trunk vers lui suffit, avec une sous-interface par VLAN (« router on a stick »). Un switch de niveau 3 sait le faire directement.',why:'C’est aussi ce qui permet de contrôler les flux : le routeur ou le pare-feu peut autoriser le serveur Info à joindre la compta, mais pas l’inverse.',look:'Aucune trame nouvelle : la séparation est assurée par le switch, le passage autorisé par le routeur.',bub:['sw','Pour sortir du VLAN :\nrouteur nécessaire',''],w:'Si deux postes de VLAN différents ne se joignent pas, vérifier : VLAN du port, VLAN autorisés sur le trunk, passerelle et routage.'},

  words:[['BPDU','message échangé entre switchs'],['Pont racine (root bridge)','switch de référence de l’arbre'],['Bridge ID','priorité + adresse MAC du switch'],['Coût','valeur liée à la vitesse du lien (1 Gbit/s : 4)'],['Port bloqué','port qui ne transmet aucune trame de données'],['Tempête de diffusion','trames qui tournent en boucle et saturent le réseau']],
  steps:[
   {t:'Pourquoi les boucles sont dangereuses',what:'Trois switchs sont reliés en triangle pour avoir un chemin de secours. Mais une trame de diffusion qui entre dans cette boucle est recopiée par chaque switch sur tous ses ports, et tourne indéfiniment.',why:'Une trame Ethernet n’a pas de compteur de durée de vie (contrairement au TTL d’un paquet IP). Quelques secondes suffisent à saturer tout le réseau : c’est la <b>tempête de diffusion</b>.',look:'Chaque switch est relié aux deux autres. Si rien ne l’en empêche, une diffusion fait le tour du triangle sans fin.',bub:['sw','Boucle physique :\nrisque de tempête',''],w:'Symptômes : voyants de ports qui clignotent en continu, CPU des switchs à 100 %, réseau inutilisable.'},
   {t:'Chacun se croit racine',what:'Au démarrage, chaque switch envoie un message <b>BPDU</b> à ses voisins en se désignant lui-même comme pont racine. L’identifiant d’un switch est composé d’une priorité (32768 par défaut) et de son adresse MAC.',why:'Pour construire un arbre, il faut d’abord un point de départ commun : la racine. Chaque switch propose d’abord sa candidature.',look:'Trois paquets : chaque switch annonce son identifiant. Ce sont des trames de liaison : pas d’adresse IP.',w:'Filtre <code>stp</code>. L’adresse de destination 01:80:c2:00:00:00 est réservée à STP.'},
   {t:'Élection de la racine, puis des chemins',what:'Chacun compare les identifiants reçus. Le plus petit gagne : ici SW-A (même priorité, adresse MAC la plus basse). Les autres calculent leur coût pour le rejoindre. Entre SW-B et SW-C, le lien est départagé : le coût est égal, donc le switch au plus petit identifiant (B) garde le port actif, et SW-C <b>bloque</b> son port.',why:'Résultat : un arbre sans boucle. Tout le trafic passe par A ; le lien B–C n’est pas utilisé tant qu’aucune panne ne se produit.',look:'Observez les bulles : « A est racine » partout. Le BPDU de C arrive à B avec un identifiant plus grand : il ne change rien. Celui de B arrive à C avec un identifiant plus petit : C doit céder.',w:'Sur un switch Cisco : <code>show spanning-tree</code> affiche le rôle (Root, Desg, Altn) et l’état (FWD, BLK) de chaque port.'},
   {t:'Le port bloqué',what:'Le port de SW-C vers SW-B est maintenant <b>bloqué</b> : il écoute les BPDU mais ne transmet aucune trame de données. La boucle est cassée.',why:'On garde le câble branché : c’est un chemin de secours prêt à servir, sans risque de tempête.',look:'Le triangle devient un arbre : A au centre, B et C attachés à A.',bub:['sw3','Port vers SW-B :\nbloqué (BLK)',''],
    extra:'<span class="lab">Rôle des ports après l’élection</span><table class="calc"><tr><th>Switch</th><th>Port</th><th>Rôle</th><th>État</th></tr><tr><td>SW-A</td><td>vers B</td><td>désigné</td><td class="m">forwarding</td></tr><tr><td>SW-A</td><td>vers C</td><td>désigné</td><td class="m">forwarding</td></tr><tr><td>SW-B</td><td>vers A</td><td>racine</td><td class="m">forwarding</td></tr><tr><td>SW-B</td><td>vers C</td><td>désigné</td><td class="m">forwarding</td></tr><tr><td>SW-C</td><td>vers A</td><td>racine</td><td class="m">forwarding</td></tr><tr><td>SW-C</td><td>vers B</td><td>alternatif</td><td class="x">bloqué</td></tr></table>',w:'Un lien « bloqué » n’est pas en panne : il apparaît actif au niveau physique mais ne transmet pas.'},
   {t:'Panne : le chemin de secours s’ouvre',what:'Le lien entre SW-A et SW-C est coupé. SW-C n’entend plus la racine. Au bout d’un délai, son port bloqué devient le nouveau chemin vers la racine, en passant par SW-B. Les BPDU de B le confirment.',why:'C’est tout l’intérêt du triangle : une panne ne coupe pas le réseau. Avec STP classique, la reconvergence demande 30 à 50 secondes ; avec RSTP, moins d’une seconde.',look:'Après la panne, SW-C reçoit le BPDU de SW-B (coût 4) : son meilleur chemin vers A passe désormais par B.',w:'Un réseau qui « gèle » une demi-minute après une coupure de lien est typique de STP classique : passer en RSTP ou MSTP.'},
   {t:'RSTP et protections',what:'RSTP (802.1w) remplace STP : les ports négocient entre eux et reconvergent très vite. Des protections existent : <b>PortFast</b> (ports de postes actifs immédiatement), <b>BPDU Guard</b> (coupe un port d’accès qui reçoit un BPDU) et <b>Root Guard</b>.',why:'STP fait confiance à tout le monde : un switch inconnu branché par un utilisateur pourrait devenir racine et détourner le trafic.',look:'Pas de nouveaux paquets : retenez les trois protections.',w:'Bonne pratique : fixer la priorité du pont racine souhaité (ex. 4096) plutôt que de laisser jouer la MAC.'}
  ],pk:b.pk};
})();

 eap(0.02,'pc','sw','EAP-Response (identifiants chiffrés)',[['Code','Response'],['Type','PEAP'],['Contenu','identifiant et mot de passe, chiffrés par TLS']],'Dans le tunnel TLS, le poste envoie son mot de passe : il est protégé.',{app:{name:'PEAP — identifiants',enc:true,lines:['MSCHAPv2 : alice / ********']}});
 radE(0.022,'sw','srv','Access-Request (message chiffré)',['Identifiants d’alice (dans le tunnel TLS)'],'Le switch relaie sans pouvoir lire : le contenu est chiffré dans le tunnel TLS.',{bub:'Identifiants reçus et vérifiés'});
 b.step(4);

 eap(0.026,'sw','pc','EAP-Success',[['Code','Success'],['Résultat','Port ouvert, VLAN 10']],'Le switch ouvre le port : le poste peut désormais utiliser le réseau normalement.',{bub:'Authentifié : port ouvert'});
 D['802.1X']={name:'802.1X',full:'Contrôle d’accès au port + RADIUS',scene:{layout:'dot1x',sub:'none',nodes:{
   pc:{name:'Demandeur',role:'Poste qui veut se connecter',ip:'192.168.1.10',mac:'00:00:5e:00:53:10'},sw:{name:'Authentificateur',role:'Switch : gardien du port',ip:SW,mac:'00:00:5e:00:53:02'},srv:{name:'Serveur RADIUS',ip:RAD,mac:'00:00:5e:00:53:05'}}},
  goal:'802.1X empêche un équipement de profiter du réseau tant qu’il ne s’est pas authentifié. Le switch (ou la borne Wi-Fi) joue le rôle de gardien et s’appuie sur un serveur RADIUS pour décider.',
  analogy:'À l’entrée d’une salle, un vigile (le switch) ne laisse passer personne sans badge. Il ne connaît pas les noms : il téléphone au bureau de sécurité (le serveur RADIUS), qui contrôle l’identité et répond « oui, et il va dans la salle B » ou « non ».',
  prereq:['VLAN','UDP'],
  facts:[['Couche OSI','2 (EAPOL) + 7 (RADIUS)'],['Acteurs','Demandeur · authentificateur · serveur d’authentification'],['EAPOL','Trames entre le poste et le switch, avant tout accès'],['RADIUS','UDP 1812 (authentification), 1813 (comptabilité)'],['Méthodes EAP','PEAP, EAP-TLS, EAP-TTLS…'],['Usage','Prises réseau, Wi-Fi professionnel (WPA2/3-Enterprise)']],
  words:[['Demandeur (supplicant)','poste qui veut se connecter'],['Authentificateur','switch ou borne qui contrôle l’accès'],['RADIUS','protocole de dialogue avec le serveur d’authentification'],['EAP','cadre qui permet plusieurs méthodes d’authentification'],['EAPOL','EAP encapsulé directement dans Ethernet'],['Secret partagé','mot de passe entre le switch et RADIUS']],
  steps:[
   {t:'Port fermé',what:'Quand on branche un poste, le port du switch est ouvert à un seul type de trafic : les trames d’authentification (EAPOL). Tout le reste (DHCP, DNS, web) est refusé tant que l’identité n’est pas prouvée.',why:'Sans 802.1X, n’importe qui peut brancher un ordinateur sur une prise murale et accéder au réseau interne.',look:'Trois acteurs : le poste, le switch et le serveur RADIUS. Le switch ne sait rien de l’utilisateur : il fait transiter les messages.',bub:['sw','Port fermé :\nseul EAPOL est accepté',''],w:'Dans la capture, tout ce qui précède l’authentification est du EAPOL : filtre <code>eapol</code>.'},
   {t:'Demander et donner son identité',what:'Le poste envoie <b>EAPOL-Start</b>, le switch répond par une requête d’identité (<b>EAP-Request/Identity</b>), puis le poste donne son nom (alice@example.com). Ces trames sont envoyées directement dans Ethernet, sans adresse IP, vers l’adresse de groupe 01:80:c2:00:00:03.',why:'Le poste n’a pas encore d’adresse IP (il n’a pas le droit de demander au DHCP). L’échange se fait donc au niveau 2.',look:'Cliquez sur les paquets : pas de bloc IP, uniquement Ethernet puis EAPOL.',w:'Dans Wireshark, « Type : 802.1X Authentication (0x888e) ».'},
   {t:'Le switch relaie vers RADIUS',what:'Le switch emballe l’identité dans un message RADIUS <b>Access-Request</b> et l’envoie en UDP au serveur RADIUS. Celui-ci répond par un <b>Access-Challenge</b>.',why:'Le switch ne stocke aucun compte : l’annuaire des utilisateurs est sur un serveur central. Un seul endroit à gérer pour tout le parc.',look:'Ici, le switch parle IP (UDP 1812) au serveur ; le poste, lui, parle toujours EAPOL au switch.',w:'Filtre <code>radius</code>. Le champ « NAS-IP-Address » identifie le switch qui relaie.'},
   {t:'Tunnel TLS puis mot de passe',what:'Le serveur et le poste établissent un tunnel TLS (méthode PEAP) à travers le switch. Le poste vérifie le <b>certificat du serveur</b>. Ensuite, il envoie son mot de passe à l’intérieur du tunnel, protégé.',why:'Le mot de passe ne doit jamais circuler en clair, même sur le réseau interne. Et le poste doit s’assurer qu’il parle au vrai serveur, pas à un faux.',look:'Les paquets du milieu sont verts : ils contiennent le tunnel TLS. Le switch les relaie sans comprendre leur contenu.',w:'Dans la capture : « EAP — Protected EAP (PEAP) », puis « TLS ». Rien de lisible après le Server Hello.'},
   {t:'Accès accordé',what:'Si les identifiants sont corrects, RADIUS envoie <b>Access-Accept</b>, avec des attributs : ici le VLAN à attribuer. Le switch répond au poste par <b>EAP-Success</b> et ouvre le port.',why:'Le même service peut classer automatiquement les utilisateurs : salariés, invités, imprimantes… dans des VLAN différents.',look:'Le port passe de « fermé » à « ouvert, VLAN 10 ». Le poste peut maintenant obtenir une adresse DHCP et naviguer.',w:'Si l’accès est refusé : <code>Access-Reject</code> dans la capture, puis journaux du serveur RADIUS (mauvais mot de passe, certificat expiré, heure fausse).'},
   {t:'Pièges et bonnes pratiques',what:'Les équipements sans logiciel 802.1X (imprimantes, caméras) s’authentifient par leur adresse MAC (MAB), moins sûr. Un poste qui ne vérifie pas le certificat du serveur peut se faire piéger par un faux serveur RADIUS.',why:'802.1X est un contrôle d’accès, pas un chiffrement du réseau. Une fois le port ouvert, les trames circulent normalement.',look:'Aucun nouveau paquet. Retenez les trois protections : vérifier le certificat serveur, EAP-TLS (certificat client) pour les postes sensibles, isoler les équipements MAB dans un VLAN restreint.',w:'À tester : brancher un poste sans configuration 802.1X et vérifier qu’il n’obtient aucune adresse IP.'}
  ],pk:b.pk};

 D.LDAP={name:'LDAP',full:'Lightweight Directory Access Protocol',scene:{layout:'lan',sub:'none',nodes:{prn:{name:'Annuaire LDAP',role:'Serveur d’annuaire',k:'srv',ip:'192.168.1.5',mac:'00:00:5e:00:53:05'}}},
  goal:'LDAP permet de consulter et de modifier un annuaire : une base hiérarchique qui contient les utilisateurs, les groupes, les ordinateurs et leurs attributs. C’est le langage d’Active Directory, d’OpenLDAP et de nombreuses applications.',
  analogy:'Un annuaire est un grand classeur à tiroirs : chaque personne a une fiche rangée dans un service, lui-même dans une entreprise. LDAP est la manière de demander au documentaliste « trouve-moi la fiche de Bob » ou « qui est dans le groupe Compta ? ».',

  steps:[
   {t:'Un annuaire en arbre',what:'Un annuaire est organisé comme une arborescence de dossiers. Chaque objet est repéré par son <b>DN</b> (nom distinctif), qui lit le chemin de l’objet vers la racine : <code>uid=bob,ou=Users,dc=example,dc=org</code>.',why:'Une organisation centralise ses comptes à un seul endroit. Chaque service (messagerie, Wi-Fi, intranet, partage) peut interroger cet annuaire au lieu de gérer ses propres comptes.',look:'Le poste va consulter le serveur d’annuaire : il se connecte, cherche Bob, puis se déconnecte.',bub:['prn','Annuaire LDAP\ndc=example,dc=org',''],
    extra:'<span class="lab">L’arbre de l’annuaire (extrait)</span><table class="calc"><tr><th>Niveau</th><th>Entrée</th></tr><tr><td>racine</td><td>dc=example,dc=org</td></tr><tr><td>unité</td><td class="m">ou=Users</td></tr><tr><td>utilisateur</td><td class="m">uid=alice · uid=bob</td></tr><tr><td>unité</td><td class="m">ou=Groups</td></tr><tr><td>groupe</td><td class="m">cn=Compta (membres : alice, bob)</td></tr></table>',w:'Aucune capture à cette étape.'},

 D.Kerberos={name:'Kerberos',full:'Authentification par tickets',scene:{layout:'lan',sub:'none',nodes:{pc:{name:'Poste d’Alice'},prn:{name:'Serveur KDC',role:'Contrôleur de domaine',k:'srv',ip:'192.168.1.5',mac:'00:00:5e:00:53:05'},pc2:{name:'Serveur fichiers',role:'Service demandé',k:'srv',ip:'192.168.1.30',mac:'00:00:5e:00:53:30'}}},
  goal:'Kerberos permet de s’authentifier auprès de nombreux services en ne tapant son mot de passe qu’une seule fois. Il repose sur des tickets délivrés par un serveur de confiance (le KDC), sans jamais envoyer le mot de passe sur le réseau.',
  analogy:'À l’entrée d’un parc d’attractions, on montre sa pièce d’identité à l’accueil et on reçoit un bracelet (le TGT). Devant chaque attraction, on présente le bracelet à un guichet qui délivre un billet pour cette attraction. L’opérateur de l’attraction ne connaît pas votre identité : il vérifie seulement que son guichet a émis le billet.',
  prereq:['LDAP','UDP'],
  facts:[['Couche OSI','7 — Application'],['Transport','UDP ou TCP, port 88'],['Acteurs','Client, KDC (contrôleur de domaine), service'],['Tickets','TGT (ticket maître), ticket de service'],['Exigence','Horloges à moins de 5 minutes d’écart'],['Norme','RFC 4120']],
  words:[['KDC','centre de distribution de clés (contrôleur de domaine)'],['TGT','ticket qui permet de demander d’autres tickets'],['Ticket de service','ticket pour un service précis'],['Clé de session','secret partagé temporaire'],['Authenticator','heure chiffrée qui prouve qu’on détient la clé'],['SPN','nom du service demandé']],
  steps:[
   {t:'Trois acteurs, aucun mot de passe sur le réseau',what:'Alice (client), le contrôleur de domaine (qui joue le rôle de KDC) et un serveur de fichiers (le service). Chaque acteur partage un secret avec le KDC : Alice via son mot de passe, le serveur via sa propre clé.',why:'Le principe : le mot de passe ne voyage jamais. Chacun prouve qu’il connaît son secret en chiffrant des données que le KDC sait déchiffrer.',look:'Le trajet va en trois temps : AS (obtenir le TGT), TGS (obtenir un ticket de service), AP (présenter le ticket).',bub:['pc','Alice se connecte au domaine',''],w:'Aucune capture à cette étape. Les échanges Kerberos se trouvent sous le filtre <code>kerberos</code>.'},
   {t:'Obtenir le TGT (AS)',what:'Alice envoie un <b>AS-REQ</b> au KDC avec son nom et une heure chiffrée par une clé dérivée de son mot de passe. Le KDC vérifie, puis renvoie un <b>AS-REP</b> : le TGT (que seul le KDC sait lire) et une clé de session (que seule Alice sait déchiffrer).',why:'Alice se prouve au KDC une seule fois. Le TGT, valable environ 10 heures, lui évite de ressaisir son mot de passe.',look:'Le contenu chiffré apparaît dans le cadre « Kerberos » ; seuls le nom du client, le domaine et le service sont lisibles.',w:'<code>klist</code> affiche les tickets en mémoire du poste. Dans Active Directory, un premier AS-REQ sans preuve reçoit l’erreur « PREAUTH_REQUIRED », puis le client recommence avec l’heure chiffrée : c’est normal.'},
   {t:'Obtenir un ticket de service (TGS)',what:'Pour accéder au serveur de fichiers, Alice envoie un <b>TGS-REQ</b> : son TGT plus un « authenticator » (heure chiffrée avec la clé de session). Le KDC répond avec un <b>TGS-REP</b> contenant un ticket de service chiffré avec la clé du serveur.',why:'Alice ne parle plus avec son mot de passe : le TGT remplace son identité auprès du KDC. Le ticket est limité à un service.',look:'Le KDC n’interroge pas le serveur de fichiers : il connaît sa clé.',w:'L’heure joue un rôle : un décalage de plus de 5 minutes fait échouer l’authentification (« KRB_AP_ERR_SKEW »).'},
   {t:'Présenter le ticket au service (AP)',what:'Alice ouvre une connexion vers le serveur de fichiers et lui présente le ticket de service avec un nouvel authenticator (message <b>AP-REQ</b>, ici transporté dans SMB). Le serveur déchiffre le ticket avec sa clé, vérifie l’authenticator et répond.',why:'Le serveur n’a jamais besoin de joindre le KDC pour chaque connexion : il fait confiance au ticket qu’il sait déchiffrer.',look:'L’authentification passe dans le protocole applicatif : ici, la session SMB2.',w:'Si Kerberos n’est pas possible (adresse IP au lieu du nom, nom de service inconnu), Windows retombe sur NTLM, moins sûr.'},
   {t:'Réutilisation et durée de vie',what:'Le TGT reste valable une dizaine d’heures : pour chaque nouveau service, le poste ne contacte que le KDC, avec le TGT, sans solliciter l’utilisateur. C’est le <b>Single Sign-On</b>.',why:'L’utilisateur tape son mot de passe une fois le matin ; les partages, l’intranet, l’imprimante s’ouvrent seuls.',look:'Aucun nouveau paquet : retenez que le même TGT sert pour tous les services.',w:'<code>klist purge</code> supprime les tickets : l’utilisateur doit se réauthentifier.'},
   {t:'Attaques à connaître',what:'Un attaquant peut copier des tickets (pass-the-ticket), demander des tickets de service pour casser hors ligne les mots de passe de comptes de service (Kerberoasting), ou forger un TGT s’il vole la clé du KDC (golden ticket).',why:'Kerberos protège bien le mot de passe sur le réseau, mais la sécurité dépend de la solidité des mots de passe de service et de la protection du contrôleur de domaine.',look:'Aucun paquet : réfléchissez à ce qu’un attaquant doit posséder pour chaque attaque.',w:'Parades : mots de passe longs pour les comptes de service, chiffrement AES, durée de vie courte, surveillance des demandes TGS inhabituelles.'}

})();

 ike(0.08,'pc','gw',4500,4500,'IKE_AUTH (identité + preuve, chiffré)',['Message : IKE_AUTH, requête','Chiffré avec les clés de l’étape précédente','Contenu : identité du poste, signature (certificat) ou secret partagé, adresse interne demandée'],'Le poste prouve son identité, dans le tunnel déjà chiffré.',{app:{name:'IKEv2 — IKE_AUTH',enc:true,lines:['Identité : alice@example.org','Authentification : certificat','Demande une adresse interne']},sz:1100,bub:'Poste identifié'});
 ike(0.12,'gw','pc',4500,4500,'IKE_AUTH réponse (adresse interne attribuée)',['Identité de la passerelle + preuve','Adresse interne attribuée : '+VIP,'Paramètres du tunnel ESP (SPI)'],'La passerelle s’identifie à son tour, attribue l’adresse interne 10.8.0.2 et négocie les paramètres du tunnel de données.',{app:{name:'IKEv2 — IKE_AUTH',enc:true,lines:['Authentification de la passerelle','Adresse attribuée : '+VIP,'ESP : SPI 0xc0ffee01']},sz:900,bub:'Tunnel prêt : adresse interne 10.8.0.2'});
 b.step(3);
 esp(1,'pc','gw','ESP (SPI 0xc0ffee01) Seq=1',['Paquet interne : '+VIP+' → '+IN,'ICMP echo request (ping)'],'Le poste veut joindre un serveur interne : son paquet est chiffré et placé dans un nouveau paquet adressé à la passerelle (ESP).',{bub:'Paquet déchiffré : ping pour 10.0.0.20'});
 b.icmp(1.02,'gw','srv',8,0,'Echo (ping) request id=0x0001, seq=1',{ip:[VIP,IN],ttl:63,sz:98,bub:'Ping reçu de 10.8.0.2',cap:'La passerelle a déchiffré le paquet interne et le transmet, en clair, sur le réseau de l’entreprise.'},{label:'Echo (ping) request',id:1,seq:1});
 b.icmp(1.021,'srv','gw',0,0,'Echo (ping) reply id=0x0001, seq=1',{ip:[IN,VIP],ttl:64,sz:98,bub:'Réponse reçue',cap:'Le serveur répond à 10.8.0.2, comme s’il s’agissait d’un poste du réseau local.'},{label:'Echo (ping) reply',id:1,seq:1});
 esp(1.05,'gw','pc','ESP (SPI 0xc0ffee02) Seq=1',['Paquet interne : '+IN+' → '+VIP,'ICMP echo reply'],'La passerelle chiffre la réponse et la renvoie au poste, dans un nouveau paquet ESP.',{ttl:64,bub:'Réponse du serveur interne reçue'});
 D.IPsec={name:'IPsec',full:'IKEv2 + ESP',scene:{layout:'vpn',sub:'none',nodes:{pc:{name:'Poste nomade'},gw:{name:'Passerelle VPN',ip:GW,mac:'00:00:5e:00:53:c1',role:'Extrémité du tunnel'},srv:{name:'Serveur interne',ip:IN,mac:'00:00:5e:00:53:c2',role:'Réseau de l’entreprise'}}},
  goal:'IPsec crée un tunnel chiffré et authentifié entre un poste (ou un site) et le réseau de l’entreprise, à travers Internet. Les paquets internes sont chiffrés puis placés dans de nouveaux paquets.',
  analogy:'Pour envoyer une lettre confidentielle, on la met dans une enveloppe blindée fermée par un cadenas dont seuls l’expéditeur et le destinataire ont la clé. Puis on écrit sur cette enveloppe l’adresse de la passerelle : Internet ne voit que l’enveloppe externe.',
  prereq:['UDP','TLS/SSL'],
  facts:[['Couche OSI','3 — Réseau'],['Phase 1','IKEv2 : UDP 500, puis 4500 si NAT'],['Phase 2','ESP : chiffrement des paquets (protocole IP 50, ou UDP 4500)'],['Mode tunnel','Le paquet d’origine est entièrement encapsulé'],['Garanties','Confidentialité, intégrité, authentification'],['Norme','RFC 7296 (IKEv2), RFC 4303 (ESP)']],
  words:[['IKE','protocole qui négocie les clés et les algorithmes'],['SA','association de sécurité : paramètres d’un tunnel'],['ESP','protocole qui chiffre et authentifie les paquets'],['SPI','numéro qui identifie un tunnel dans ESP'],['NAT-T','encapsulation d’ESP dans UDP 4500 pour traverser le NAT'],['Mode tunnel','paquet d’origine encapsulé dans un nouveau paquet']],
  steps:[
   {t:'Pourquoi un VPN',what:'Un employé en déplacement doit accéder aux ressources internes (10.0.0.0/24). Elles ne sont pas visibles depuis Internet. On crée donc un <b>tunnel</b> entre son poste et la passerelle de l’entreprise : tout ce qui y passe est chiffré.',why:'Sans VPN, il faudrait exposer chaque serveur interne sur Internet. Avec le VPN, un seul point d’entrée, contrôlé, authentifie et chiffre.',look:'Le poste est derrière la box de son hôtel, qui fait du NAT. La passerelle VPN est en ligne sur Internet. Le serveur interne est derrière elle.',bub:['pc','Poste nomade\nVPN à ouvrir',''],w:'Aucune capture à cette étape.'},
   {t:'Négocier : IKE_SA_INIT',what:'Les deux extrémités s’entendent sur les algorithmes et échangent chacune une valeur publique (Diffie-Hellman). Chacune calcule ensuite le <b>même secret</b> sans qu’il circule. Elles détectent aussi la présence d’un NAT.',why:'Comme pour TLS, il faut d’abord créer des clés sans les envoyer. Ici, les messages sont encore lisibles, mais ils ne contiennent aucun secret.',look:'La réponse de la passerelle signale un NAT : la suite passera sur le port 4500, qui traverse la box.',w:'Filtre <code>isakmp</code>. Sur le port 500 (puis 4500), Wireshark décode « IKE_SA_INIT ».'},
   {t:'S’authentifier : IKE_AUTH',what:'À l’intérieur du tunnel de négociation, chiffré, chaque partie prouve son identité (certificat ou secret partagé). La passerelle attribue au poste une <b>adresse interne</b> (10.8.0.2) et négocie les paramètres du tunnel de données (ESP).',why:'Le chiffrement ne suffit pas : il faut aussi savoir qui est de l’autre côté. Les deux extrémités s’authentifient mutuellement.',look:'Les deux paquets sont verts : le contenu est chiffré dès cet échange.',w:'En cas d’échec : « AUTHENTICATION_FAILED » dans les journaux de la passerelle (certificat expiré, secret partagé différent, heure fausse).'},
   {t:'ESP : les données dans le tunnel',what:'Le poste envoie un ping vers 10.0.0.20. Le paquet interne (10.8.0.2 → 10.0.0.20) est <b>chiffré entièrement</b>, placé dans un paquet ESP adressé à la passerelle, puis envoyé par Internet. La passerelle le déchiffre et le transmet au serveur.',why:'Ceux qui observent Internet ne voient que deux adresses publiques : celle du poste (après NAT) et celle de la passerelle. Ni le contenu, ni les adresses internes ne sont visibles.',look:'Cliquez sur le paquet ESP : les adresses IP du bloc externe sont publiques. Le détail « Ce que contient le message avant chiffrement » montre le paquet interne. Entre la passerelle et le serveur, le paquet est en clair, avec ses adresses internes.',w:'Filtre <code>esp</code> ou <code>udp.port == 4500</code>. Le contenu d’ESP n’est pas lisible sans les clés.'},
   {t:'Tunnel ou transport ?',what:'En <b>mode tunnel</b> (cas du VPN), le paquet d’origine entier est encapsulé, avec ses adresses : c’est ce qui cache le réseau interne. En <b>mode transport</b>, seule la charge utile est protégée et l’en-tête IP d’origine reste visible (utilisé entre deux machines).',why:'Le choix dépend de ce qu’on veut cacher et de qui parle à qui. Les VPN d’accès et de site à site utilisent le mode tunnel.',look:'Aucun nouveau paquet : comparez le paquet interne et le paquet ESP de l’étape précédente.',w:'Autre protocole IPsec : AH (protocole 51) n’assure que l’intégrité, sans chiffrement : presque plus utilisé.'},
   {t:'Bonnes pratiques',what:'Préférer les certificats à un secret partagé commun, des algorithmes modernes (AES-GCM, SHA-2, groupes DH forts), un renouvellement régulier des clés, et ne laisser passer dans le tunnel que ce qui est nécessaire (au lieu de tout le trafic).',why:'Un VPN mal configuré donne un accès complet au réseau interne à celui qui vole un poste. Le tunnel est un accès, pas une protection du poste.',look:'Retenez la différence entre protéger le transport (VPN) et contrôler l’accès (droits, pare-feu, MFA).',w:'Surveiller les connexions VPN : heure, pays et nombre d’échecs d’authentification.'}
  ],pk:b.pk};
})();

/* ====================== WireGuard ====================== */
(function(){
 const b=Builder(),GW='203.0.113.1',IN='10.0.0.20',VIP='10.8.0.2';
 const wg=(t,from,to,len,info,lines,cap,o)=>b.udp(t,from,to,from==='pc'?41820:51820,from==='pc'?51820:41820,len,'WireGuard',info,Object.assign({sz:42+len,nat:{mp:41820},app:{name:'WireGuard',lines},cap},o));
 b.step(1);
 wg(0,'pc','gw',148,'Handshake Initiation',['Type : 1 (Handshake Initiation)','Clé éphémère du poste (publique)','Clé publique du poste (chiffrée)','Horodatage (chiffré)'],'Le poste envoie un unique message d’initiation : une clé éphémère, et sa clé publique chiffrée.',{bub:'Clé publique du poste connue : autorisée'});
 wg(0.04,'gw','pc',92,'Handshake Response',['Type : 2 (Handshake Response)','Clé éphémère de la passerelle (publique)','Preuve (chiffrée)'],'La passerelle répond : un seul aller-retour suffit pour établir les clés.',{bub:'Clés de session établies'});
 b.step(2);
 wg(0.08,'pc','gw',128,'Transport Data (1)',['Type : 4 (Transport Data)','Paquet interne : '+VIP+' → '+IN+' ICMP echo request'],'Le paquet interne est chiffré et placé dans un datagramme UDP vers le port 51820.',{app:{name:'WireGuard — Transport Data',enc:true,lines:['Paquet interne : '+VIP+' → '+IN,'ICMP echo request (ping)']},bub:'Ping déchiffré pour 10.0.0.20'});
 b.icmp(0.1,'gw','srv',8,0,'Echo (ping) request id=0x0001, seq=1',{ip:[VIP,IN],ttl:63,sz:98,bub:'Ping reçu de 10.8.0.2',cap:'La passerelle remet le paquet interne au serveur, en clair.'},{label:'Echo (ping) request',id:1,seq:1});
 b.icmp(0.101,'srv','gw',0,0,'Echo (ping) reply id=0x0001, seq=1',{ip:[IN,VIP],ttl:64,sz:98,bub:'Réponse reçue',cap:'Le serveur répond à 10.8.0.2.'},{label:'Echo (ping) reply',id:1,seq:1});
 wg(0.14,'gw','pc',128,'Transport Data (2)',['Type : 4 (Transport Data)','Paquet interne : '+IN+' → '+VIP+' ICMP echo reply'],'La passerelle chiffre la réponse et la renvoie au poste.',{app:{name:'WireGuard — Transport Data',enc:true,lines:['Paquet interne : '+IN+' → '+VIP,'ICMP echo reply']},ttl:64,bub:'Réponse reçue'});
 b.step(3);
 wg(25,'pc','gw',32,'Keepalive (Transport Data vide)',['Type : 4 (Transport Data)','Contenu : vide (message de maintien)'],'Toutes les 25 secondes, le poste envoie un message vide : il maintient ouvert le « trou » dans le NAT.',{gapText:'25 s plus tard',app:{name:'WireGuard — Keepalive',enc:true,lines:['(aucun paquet interne)']},bub:'Tunnel maintenu'});
 D.WireGuard={name:'WireGuard',full:'VPN moderne par clés publiques',scene:{layout:'vpn',sub:'none',nodes:{pc:{name:'Poste nomade'},gw:{name:'Passerelle VPN',ip:GW,mac:'00:00:5e:00:53:c1',role:'Pair WireGuard'},srv:{name:'Serveur interne',ip:IN,mac:'00:00:5e:00:53:c2',role:'Réseau de l’entreprise'}}},
  goal:'WireGuard est un VPN récent, volontairement simple : chaque machine a une paire de clés, et deux machines qui se connaissent par leurs clés publiques échangent des paquets chiffrés dans de simples datagrammes UDP.',
  analogy:'IPsec est un manuel d’une centaine de pages avec des dizaines d’options. WireGuard est un carnet d’adresses : on y note la clé publique de chaque correspondant et les adresses qu’il peut utiliser. Si la clé est dans le carnet, la porte s’ouvre.',
  prereq:['UDP','IPsec'],
  facts:[['Couche OSI','3 (tunnel) sur UDP'],['Transport','UDP, port 51820 par défaut'],['Authentification','Clés publiques (comme SSH)'],['Algorithmes','Fixes : ChaCha20-Poly1305, Curve25519 (pas de négociation)'],['Handshake','1 aller-retour'],['Taille','Moins de 5 000 lignes de code']],
  words:[['Clé publique / privée','paire de clés propre à chaque machine'],['Peer','correspondant du tunnel'],['AllowedIPs','adresses autorisées derrière chaque peer'],['Endpoint','adresse et port UDP du peer'],['Keepalive','message de maintien du tunnel'],['Roaming','le peer change d’adresse sans casser le tunnel']],
  steps:[
   {t:'Une configuration minimale',what:'Chaque extrémité définit sa clé privée, l’adresse de son interface virtuelle (10.8.0.2) et la liste de ses <b>peers</b> : clé publique, adresses autorisées (AllowedIPs) et adresse du serveur (Endpoint).',why:'Il n’y a ni négociation d’algorithmes ni certificats : moins de configuration, moins d’erreurs possibles, moins de surface d’attaque.',look:'La passerelle ne répondra qu’à un poste dont elle connaît la clé publique : sinon, elle reste silencieuse (invisible pour un scan).',
    extra:'<span class="lab">Configuration du poste (wg0.conf, extrait)</span><table class="calc"><tr><th>Section</th><th>Ligne</th></tr><tr><td>[Interface]</td><td class="m">PrivateKey = (secret du poste)</td></tr><tr><td></td><td class="m">Address = 10.8.0.2/32</td></tr><tr><td>[Peer]</td><td class="m">PublicKey = (clé publique de la passerelle)</td></tr><tr><td></td><td class="m">Endpoint = 203.0.113.1:51820</td></tr><tr><td></td><td class="m">AllowedIPs = 10.0.0.0/24</td></tr><tr><td></td><td class="m">PersistentKeepalive = 25</td></tr></table>',bub:['pc','Poste : clé privée + clé publique\nde la passerelle',''],w:'Aucune capture à cette étape.'},
   {t:'La poignée de main en un échange',what:'Le poste envoie un message d’<b>initiation</b> (type 1) contenant une clé éphémère et sa clé publique chiffrée. La passerelle répond (type 2) avec sa propre clé éphémère. Les deux calculent les clés de session. Voilà tout : deux paquets.',why:'Moins de paquets signifie une connexion immédiate et peu d’information exposée. Seules les clés éphémères sont visibles.',look:'Le premier paquet fait 148 octets, le second 92, toujours. Ils se reconnaissent par leur taille.',w:'Filtre <code>wg</code> ou <code>udp.port == 51820</code>. Wireshark reconnaît « WireGuard, Handshake Initiation ».'},
   {t:'Transporter les paquets',what:'Chaque paquet interne est chiffré (ChaCha20-Poly1305), précédé d’un petit en-tête, et envoyé dans un datagramme UDP. La passerelle le déchiffre, vérifie que l’adresse source interne est autorisée pour ce peer, puis transmet.',why:'La vérification « AllowedIPs » empêche un poste de se faire passer pour un autre à l’intérieur du tunnel.',look:'Contrairement à IPsec, il n’y a ni IKE ni ESP : tout est en UDP.',w:'Le débit mesuré par <code>wg show</code> (sur Linux) indique les octets échangés avec chaque peer.'},
   {t:'Keepalive et itinérance',what:'Un NAT oublie les correspondances inutilisées. Toutes les 25 secondes, le poste envoie un paquet vide pour garder le trou ouvert. Si le poste change de réseau (Wi-Fi vers 4G), la passerelle suit sa nouvelle adresse dès qu’elle reçoit un paquet valide.',why:'C’est un VPN pensé pour les mobiles : la connexion survit aux changements de réseau, sans nouvelle authentification.',look:'Le paquet vide est visible mais ne transporte aucun paquet interne.',w:'Sans « PersistentKeepalive », le serveur ne peut plus joindre le poste derrière NAT après quelques minutes d’inactivité.'},
   {t:'WireGuard ou IPsec ?',what:'IPsec est un standard très répandu dans les équipements d’entreprise, avec beaucoup d’options. WireGuard est plus simple et rapide, mais attribue les adresses de façon statique et identifie les utilisateurs par leur clé, sans annuaire intégré.',why:'Le choix dépend de l’existant : équipements, gestion des utilisateurs, besoins de conformité.',look:'Retenez : IPsec négocie, WireGuard impose ses algorithmes.',w:'Dans une capture, IPsec montre IKE puis ESP (ou UDP 4500) ; WireGuard montre uniquement de l’UDP.'}
  ],pk:b.pk};
})();

/* ====================== SIP / RTP ====================== */
(function(){
 const b=Builder(),PX='203.0.113.5',BOB='203.0.113.60';
 const sip=(t,from,to,info,lines,cap,o)=>b.udp(t,from,to,from==='pc'?5060:5060,5060,300,'SIP',info,Object.assign({sz:342,nat:{mp:45060},app:{name:'SIP',lines},cap},o));
 const rtp=(t,from,to,cap,o)=>b.udp(t,from,to,from==='pc'?16384:40002,from==='pc'?40002:16384,172,'RTP','RTP PT=PCMU (G.711), 20 ms de voix',Object.assign({sz:214,nat:{mp:30000},app:{name:'RTP',lines:['Type de charge : 0 (PCMU / G.711)','160 octets de voix (20 ms)','Horodatage et numéro de séquence']},cap},o));
 b.step(0);
 sip(0,'pc','a','REGISTER sip:example.org',['REGISTER sip:example.org SIP/2.0','From : alice@example.org','Contact : alice@192.168.1.10:5060','Expires : 3600'],'Le téléphone d’Alice s’annonce au serveur : « Je suis joignable à cette adresse ».',{bub:'Enregistrement reçu'});
 sip(0.04,'a','pc','200 OK (REGISTER)',['SIP/2.0 200 OK','Contact : alice@… ; expires=3600'],'Le serveur accepte et note où joindre Alice pendant une heure.',{ttl:64,bub:'Alice est enregistrée'});
 b.step(1);
 sip(60,'pc','a','INVITE sip:bob@example.org',['INVITE sip:bob@example.org SIP/2.0','From : alice@example.org','To : bob@example.org','Call-ID : 9f2c1a…','Contenu SDP : audio, adresse 192.168.1.10, port 16384, PCMU'],'Alice appelle Bob : l’INVITE contient aussi la description du flux audio qu’elle propose (SDP).',{bub:'Appel reçu pour Bob',gapText:'une minute plus tard'});
 sip(60.04,'a','pc','100 Trying',['SIP/2.0 100 Trying'],'Le serveur prévient Alice qu’il s’occupe de son appel.',{ttl:64,bub:'Appel en cours d’acheminement'});
 sip(60.05,'a','b','INVITE sip:bob@203.0.113.60',['INVITE sip:bob@203.0.113.60 SIP/2.0','Via : serveur SIP puis téléphone d’Alice','Contenu SDP d’Alice'],'Le serveur retrouve Bob (il s’est enregistré lui aussi) et lui transmet l’appel.',{nat:null,bub:'Le téléphone sonne'});
 b.step(2);
 sip(60.09,'b','a','180 Ringing',['SIP/2.0 180 Ringing'],'Le téléphone de Bob sonne.',{nat:null,bub:'Sonnerie reçue'});
 sip(60.13,'a','pc','180 Ringing',['SIP/2.0 180 Ringing'],'Le serveur relaie à Alice : elle entend la tonalité de rappel.',{ttl:64,bub:'« Ça sonne… »'});
 sip(68,'b','a','200 OK (INVITE)',['SIP/2.0 200 OK','Contenu SDP de Bob : audio, adresse 203.0.113.60, port 40002, PCMU'],'Bob décroche. Sa réponse contient la description de son propre flux audio.',{nat:null,gapText:'8 s plus tard',bub:'Bob a décroché'});
 sip(68.04,'a','pc','200 OK (INVITE)',['SIP/2.0 200 OK','Contenu SDP de Bob : 203.0.113.60 port 40002'],'Le serveur relaie à Alice : elle connaît maintenant l’adresse et le port audio de Bob.',{ttl:64,bub:'Adresse audio de Bob connue'});
 sip(68.08,'pc','b','ACK',['ACK sip:bob@203.0.113.60 SIP/2.0','(confirme la réception du 200 OK)'],'Alice confirme directement à Bob : l’appel est établi.',{bub:'Appel établi'});
 b.step(3);
 rtp(68.1,'pc','b','La voix d’Alice part directement vers Bob, par paquets de 20 ms. Le serveur SIP n’est plus concerné.');
 rtp(68.12,'b','pc','La voix de Bob arrive dans l’autre sens.',{ttl:64});
 rtp(68.14,'pc','b','Un nouveau paquet toutes les 20 ms : cinquante par seconde dans chaque sens.');
 rtp(68.16,'b','pc','La conversation continue.',{ttl:64});
 b.step(4);
 sip(130,'pc','b','BYE',['BYE sip:bob@203.0.113.60 SIP/2.0'],'Alice raccroche : elle envoie BYE directement à Bob.',{gapText:'une minute plus tard',bub:'Alice a raccroché'});
 sip(130.04,'b','pc','200 OK (BYE)',['SIP/2.0 200 OK'],'Bob confirme : la communication est terminée, les flux audio s’arrêtent.',{ttl:64,bub:'Appel terminé'});
 D.SIP={name:'SIP / RTP',full:'Voix sur IP',scene:{layout:'fork',sub:'none',nodes:{pc:{name:'Téléphone d’Alice',ip:'192.168.1.10'},a:{name:'Serveur SIP',ip:PX,mac:'00:00:5e:00:53:05'},b:{name:'Téléphone de Bob',k:'pc',ip:BOB,mac:'00:00:5e:00:53:60'}}},
  goal:'SIP établit, modifie et termine les appels (sonnerie, décrocher, raccrocher). RTP transporte ensuite la voix elle-même, en continu, directement entre les deux téléphones.',
  analogy:'SIP est le standardiste qui met deux personnes en relation : il demande « Bob, c’est pour toi », Bob décroche, puis le standardiste leur donne le numéro direct de l’autre. RTP, c’est la conversation, qui passe ensuite sans lui.',
  prereq:['UDP'],
  facts:[['Couche OSI','7 — Application'],['SIP','UDP (ou TCP) 5060, TLS 5061'],['RTP','UDP, ports pairs de 16384 à 32767 (selon le matériel)'],['Description','SDP : codecs, adresse et port audio'],['Codecs courants','G.711 (PCMU/PCMA), Opus'],['Normes','RFC 3261 (SIP), RFC 3550 (RTP)']],
  words:[['SIP','protocole de signalisation des appels'],['RTP','protocole qui transporte l’audio et la vidéo'],['SDP','description des flux : codecs, adresses, ports'],['Codec','format de compression de la voix'],['Registrar','serveur qui note où joindre chaque utilisateur'],['Gigue (jitter)','variation du délai entre paquets']],
  steps:[
   {t:'S’enregistrer (REGISTER)',what:'Pour être joignable, le téléphone d’Alice envoie <b>REGISTER</b> au serveur SIP en indiquant son adresse actuelle. Le serveur répond « 200 OK » et mémorise cette association pendant une durée limitée.',why:'Un numéro SIP n’est pas lié à un lieu. Le serveur doit savoir à chaque instant où joindre chaque utilisateur.',look:'Le téléphone d’Alice (192.168.1.10) est derrière une box : l’adresse annoncée est privée, ce qui pose parfois un problème de NAT.',w:'Filtre <code>sip</code>. Les codes ressemblent à ceux de HTTP : 200 réussite, 401 authentification requise, 404 introuvable. Ici l’authentification est omise pour simplifier : en pratique, le serveur répond d’abord 401, puis le téléphone renvoie son REGISTER avec un mot de passe haché.'},
   {t:'Appeler (INVITE)',what:'Alice envoie <b>INVITE</b> à son serveur. Ce message contient une description (SDP) du flux qu’elle propose : son adresse, un port, le codec. Le serveur répond « 100 Trying », puis retrouve Bob et lui transmet l’INVITE.',why:'Avant de parler, les deux parties doivent s’entendre sur le format de la voix et sur l’adresse où envoyer l’audio.',look:'Le serveur SIP est un intermédiaire : l’INVITE passe par lui pour arriver à Bob.',w:'La ligne <code>m=audio 16384 RTP/AVP 0</code> dans le SDP annonce le port audio et le codec 0 (PCMU).'},

function pickNode(id){

const AN={J:null,tl:[],total:0,el:0,run:false,last:0,raf:0,stages:[],timer:0};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function edgePt(a,b,c){
 const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
 const rx=a.k==='cloud'?70:66,ry=a.k==='cloud'?44:42;
 const s=Math.min(ux?rx/Math.abs(ux):1e9,uy?ry/Math.abs(uy):1e9);
 let m=c?(c.w/2*Math.abs(ux)+c.hh/2*Math.abs(uy)):0;
 const sb=Math.min(ux?(b.k==='cloud'?70:66)/Math.abs(ux):1e9,uy?(b.k==='cloud'?44:42)/Math.abs(uy):1e9);
 const avail=L-s-sb;m=Math.max(0,Math.min(m,(avail-46)/2));
 return[a.x+ux*(s+m),a.y+uy*(s+m)];
}
function chipFor(pk,hop,sc){
 const kd=pk.kd,col=KINDS[kd][1];
 const label=(pk.proto||'').replace('TLSv1.3','TLS 1.3');
 let sub='';
 const mode=pk.sub||sc.sub;
 if(pk.st)sub=pk.st;
 else if(mode==='ttl'&&hop.ip)sub='TTL '+hop.ip.ttl;
 else if(mode==='ip'&&hop.ip)sub=hop.ip.src+' → '+hop.ip.dst;
 else if(mode==='fl'&&hop.l4&&hop.l4.fl)sub=hop.l4.fl;
 else if(mode==='ttl'&&hop.l4&&hop.l4.k==='arp')sub=hop.l4.op==='request'?'Qui a… ?':'C’est moi';
 const w=Math.max(label.length*8+18,sub.length*6.1+16),hh=sub?34:22;
 const g=sv('g.chip');
 g.appendChild(sv('rect',{x:-w/2,y:-hh/2,width:w,height:hh,rx:hh/2>12?9:11,style:{fill:col}}));
 g.appendChild(sv('text',{y:sub?-3:4,'text-anchor':'middle'},label));
 if(sub)g.appendChild(sv('text.sub',{y:11,'text-anchor':'middle'},sub));
 return{g,w,hh};
}
function bubFor(text,cls,node,sc){
 const lines=text.split('\n'),w=Math.max(...lines.map(l=>l.length))*6.5+18,hh=lines.length*15+10;
 const g=sv('g.bub'+(cls?'.'+cls:''));
 g.appendChild(sv('rect',{x:-w/2,y:0,width:w,height:hh,rx:7}));
 lines.forEach((l,i)=>g.appendChild(sv('text',{x:0,y:15+i*15,'text-anchor':'middle'},l)));
 const above=node.y-VB[1]>hh+175;
 const cx=clamp(node.x,VB[0]+w/2+4,VB[0]+VB[2]-w/2-4);
 g.setAttribute('transform','translate('+cx+','+(above?node.y-(node.k==='cloud'?58:44)-hh-6:node.y+(node.k==='cloud'?34:64))+')');
 return{g,w,hh};
}
function clearPk(){if(PKL)PKL.innerHTML='';AN.stages=[];Object.values(NODES).forEach(n=>n.classList.remove('act','dead','dim','pov'));Object.values(LINKS).forEach(l=>l.classList.remove('hot'));$('#gapb').classList.remove('on')}
function buildAnim(pk){
 const J=simulate(SCN,pk);AN.J=J;clearPk();
 let t=0;AN.stages=J.stages.map((st,si)=>{
  const dmax=Math.max(...st.moves.map(m=>{const a=SCN.nodes[m.a],b=SCN.nodes[m.b];return Math.hypot(a.x-b.x,a.y-b.y)}));
  const o={st,t0:t,dur:clamp(dmax/330,.55,1.3)};
  o.tm=t+o.dur;o.te=o.tm+(st.evs.length?(st.dead?1.25:.95):.1);t=o.te;
  o.chips=st.moves.map(m=>{
   const a=SCN.nodes[m.a],b=SCN.nodes[m.b],c=chipFor(pk,st.hop,SCN);
   c.g.style.display='none';if(st.dead&&si===J.stages.length-1)c.g.classList.add('bad');
   PKL.appendChild(c.g);
   return{g:c.g,p0:edgePt(a,b,c),p1:edgePt(b,a,c),m};
  });
  o.bubs=st.evs.map(e=>{const nd=SCN.nodes[e.node],bb=bubFor(e.text,e.cls,nd,SCN);bb.g.style.display='none';PKL.appendChild(bb.g);return{g:bb.g,e}});
  return o;
 });
 AN.total=t;AN.el=0;
}
function placeChip(c,k){
 const x=c.p0[0]+(c.p1[0]-c.p0[0])*k,y=c.p0[1]+(c.p1[1]-c.p0[1])*k;
 c.g.setAttribute('transform','translate('+x.toFixed(1)+','+y.toFixed(1)+')');
}
function applyAt(el){
 const n=AN.stages.length;let hopNow=0;
 Object.values(NODES).forEach(x=>x.classList.remove('act','dead'));
 Object.values(LINKS).forEach(l=>l.classList.remove('hot'));
 AN.stages.forEach((o,si)=>{
  const last=si===n-1;
  let mode;if(el<o.t0)mode='wait';else if(el<o.tm)mode='move';else if(el<o.te||last)mode='at';else mode='gone';
  o.chips.forEach(c=>{
   if(mode==='wait'||mode==='gone'){c.g.style.display='none';return}
   c.g.style.display='';
   const k=mode==='move'?easeIO((el-o.t0)/o.dur):1;placeChip(c,k);
   if(mode==='move'||mode==='at'){const l=LINKS[c.m.a+'|'+c.m.b];if(l)l.classList.add('hot')}
  });
  o.bubs.forEach(b=>{b.g.style.display=(mode==='at')?'':'none'});
  if(mode==='move'||mode==='at'){hopNow=si;if(mode==='at')o.chips.forEach(c=>{const nd=NODES[c.m.b];nd&&nd.classList.add(o.st.dead?'dead':'act')})}
  if(mode==='move'){o.chips.forEach(c=>{NODES[c.m.a]&&NODES[c.m.a].classList.add('act')})}
 });
 if(S.hop!==hopNow&&!S.pov){S.hop=hopNow;renderHdr()}
}
const easeIO=t=>{t=clamp(t,0,1);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2};
function markNodes(n,keep){
 if(!AN.J)return;
 Object.values(NODES).forEach(x=>x.classList.remove('pov'));
 if(S.pov&&NODES[S.pov])NODES[S.pov].classList.add('pov');
}
function loop(ts){
 if(!AN.run)return;
 const dt=Math.min(.1,(ts-AN.last)/1000);AN.last=ts;AN.el+=dt*S.speed;
 applyAt(AN.el);
 if(AN.el>=AN.total){AN.run=false;animDone();return}
 AN.raf=requestAnimationFrame(loop);
}
function finishAnim(){if(AN.run){AN.run=false;cancelAnimationFrame(AN.raf);AN.el=AN.total;applyAt(AN.total);animDone(true)}}
function animDone(skip){

}
function schedNext(){
 clearTimeout(AN.timer);
 const u=unit();const dwell=(u&&u.pk==null)?2600:420;
 AN.timer=setTimeout(()=>{if(!S.playing)return;if(S.u<UN.length-1){go(S.u+1)}else{S.playing=false;renderXport()}},dwell/S.speed);
}

function go(u,opt){

 const pk=curPk();
 if(!S.seen.includes(S.key)){S.seen.push(S.key);LS.set('pl-seen',S.seen)}
 if(u===UN.length-1&&!S.done.includes(S.key)){S.done.push(S.key);LS.set('pl-done',S.done);toast('Parcours '+cur().name+' terminé')}
 renderSteps();renderXport();renderRight();renderDock();renderHud();renderPalette(true);updIps();renderSeq();

  buildAnim(pk);
  if(reduce||(opt&&opt.instant)){AN.el=AN.total;applyAt(AN.total);animDone(true)}
  else{AN.run=true;AN.last=performance.now();AN.raf=requestAnimationFrame(loop)}
  const g=pk.gap;const gb=$('#gapb');if(g){gb.textContent=g;gb.classList.add('on');clearTimeout(go.gt);go.gt=setTimeout(()=>gb.classList.remove('on'),2200)}

 }
}

   let g='<g class="row'+(isCur?' cur':'')+(fut?' fut':'')+'" data-i="'+i+'"><title>'+esc(x.info)+'</title><rect class="hl" x="0" y="'+y+'" width="'+W+'" height="'+RH+'"/><rect x="0" y="'+y+'" width="'+W+'" height="'+RH+'" fill="transparent"/>';
   g+='<text class="tm" x="8" y="'+(ym+4)+'">'+fmtT(x.t)+'</text>';

 $$('.dtab').forEach(b=>b.onclick=()=>{S.dock=b.dataset.d;renderDock()});
 $('#resetAll').onclick=()=>{if(!boot.arm){boot.arm=1;$('#resetAll').textContent='Confirmer ?';setTimeout(()=>{boot.arm=0;$('#resetAll').textContent='Réinitialiser la progression'},3000);return}boot.arm=0;S.done=[];S.seen=[];S.quiz=[];LS.set('pl-done',[]);LS.set('pl-seen',[]);LS.set('pl-quiz',[]);$('#resetAll').textContent='Réinitialiser la progression';renderPalette();renderRight();toast('Progression réinitialisée')};
 /* poignée de redimensionnement du dock */
 const grip=$('#grip');let dy=0,h0=0;
 grip.onpointerdown=e=>{dy=e.clientY;h0=$('#dock').offsetHeight;grip.setPointerCapture(e.pointerId);grip.onpointermove=m=>{$('#dock').style.setProperty('--dockh',clamp(h0+(dy-m.clientY),150,Math.round(innerHeight*.7))+'px')};grip.onpointerup=()=>{grip.onpointermove=null}};
 addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const t=e.target,typing=t.matches&&t.matches('input,select,textarea');
  if(e.key==='/'&&!typing){e.preventDefault();document.body.classList.add('nav-open');$('#search').focus();return}
  if(typing){if(e.key==='Escape')t.blur();return}
  if(e.key==='Escape'){closeModal();document.body.classList.remove('nav-open');return}
  const onBtn=t.closest&&t.closest('button,a,summary');
  if(e.key===' '&&!onBtn){e.preventDefault();play()}
  else if(e.key==='ArrowRight'){e.preventDefault();next()}
  else if(e.key==='ArrowLeft'){e.preventDefault();prev()}
  else if(e.key==='ArrowDown'){e.preventDefault();goStep(stepOf()+1)}
  else if(e.key==='ArrowUp'){e.preventDefault();goStep(stepOf()-1)}
  else if(e.key==='t'||e.key==='T')$('#themeBtn').click();
  else if(e.key==='?')helpModal();
 });
 prepare();drawScene();renderPalette();renderLegend();renderHint();shuffleQ();
 go(0,{instant:true});
 if(S.view==='seq')setView('seq');
}


boot();
</script>
