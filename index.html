<style>
:root{--bg:#eef1f5;--panel:#fff;--panel2:#f8fafc;--ink:#1e293b;--muted:#64748b;--line:#d5dbe4;--brand:#6d28d9;--brand2:#ede9fe;--brandink:#fff;--ok:#15803d;--warn:#b45309;--err:#b91c1c;--top:#1b1140;--topbtn:#2b1d5c;--topline:#44338a;--stage:#f6f8fb;--dot:#c6cfdb;--card:#fff;--cardline:#b6c2d2;--hover:#f1f5f9;--code:#f1f5f9;
--k-net:#b45309;--k-tcp:#2563eb;--k-udp:#0d9488;--k-dns:#be185d;--k-app:#ea580c;--k-sec:#15803d;--k-bad:#dc2626;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
html[data-theme=dark]{--bg:#121722;--panel:#1a2130;--panel2:#161c29;--ink:#e6ebf2;--muted:#9aa8ba;--line:#2c3648;--brand:#a78bfa;--brand2:#2a2250;--brandink:#140c33;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;--top:#0e0a24;--topbtn:#1e1648;--topline:#38307a;--stage:#141a27;--dot:#2a3447;--card:#222b3c;--cardline:#3a4760;--hover:#222b3c;--code:#0f1420;
--k-net:#f59e0b;--k-tcp:#60a5fa;--k-udp:#2dd4bf;--k-dns:#f472b6;--k-app:#fb923c;--k-sec:#4ade80;--k-bad:#f87171}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.45 var(--sans);color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover:not(:disabled){background:var(--hover)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,.node:focus-visible,.pk-row:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
button.primary{background:var(--brand);border-color:var(--brand);color:var(--brandink)}button.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--brand)}
button:disabled{opacity:.45;cursor:default}
input[type=search],select{border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:var(--panel);min-width:0}
.mono{font-family:var(--mono)}.muted{color:var(--muted)}.small{font-size:12px}
a{color:var(--brand)}
code,.code{font-family:var(--mono);font-size:12px;background:var(--code);padding:0 4px;border-radius:3px}
/* ---- barre du haut (charte des Labs : bandeau sombre teinté) ---- */
#top{background:var(--top);color:#e2e8f0;display:flex;align-items:center;gap:14px;padding:6px 12px;flex-wrap:wrap}
#top button,#top select{background:var(--topbtn);border-color:var(--topline);color:#e2e8f0}#top button:hover{background:var(--topline)}
#top button.on{background:var(--brand);border-color:var(--brand);color:var(--brandink)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;white-space:nowrap}.brand small{font-weight:400;color:#a99fd6;margin-left:6px}
.brand svg{flex:none;color:#c4b5fd}.credit{display:block;font-size:10px;font-weight:400;color:#8f84c4;line-height:1.1}.credit a{color:#8f84c4}
.grp{display:flex;align-items:center;gap:6px}.grp label{display:flex;align-items:center;gap:5px;font-size:12px;color:#cbd5e1}
.spacer{flex:1}
#menuBtn{display:none}
/* ---- disposition ---- */
#main{flex:1;display:flex;min-height:0}
#left{width:250px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#center{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#right{width:352px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
/* ---- palette ---- */
.lhead{padding:8px;border-bottom:1px solid var(--line)}.lhead input{width:100%}
.lprog{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:11.5px;color:var(--muted)}.bar{flex:1;height:6px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
#palette{flex:1;overflow:auto;padding:6px 8px 12px}
.grph{margin:12px 2px 4px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:baseline}.grph small{font-weight:400;text-transform:none;letter-spacing:0}
.pal-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:none;padding:5px 6px;border-radius:6px}
.pal-item:hover{background:var(--hover);border-color:var(--line)}.pal-item.on{background:var(--brand2);border-color:var(--brand)}
.pal-item .nm{font-weight:600}.pal-item .fl{display:block;font-size:11.5px;color:var(--muted);line-height:1.25}
.pal-item .st{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:10px;color:#fff}
.pal-item .st.part{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}.pal-item .st.done{background:var(--ok);border-color:var(--ok)}
.pal-item .ord{flex:none;font-size:10px;color:var(--muted);width:14px;text-align:right}
.pal-empty{padding:12px;color:var(--muted)}
/* ---- scène ---- */
#steps{display:flex;gap:6px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:thin}
.stp{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:16px;padding:3px 11px 3px 4px;background:var(--panel);max-width:230px}
.stp .n{width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--ink);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.stp span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stp.cur{background:var(--brand2);border-color:var(--brand);font-weight:600}.stp.cur .n{background:var(--brand);color:var(--brandink)}
.stp.dn .n{background:var(--ok);color:#fff}
#stagewrap{flex:1;position:relative;min-height:240px;background:var(--stage);overflow:hidden}
#stage{position:absolute;inset:0}
#stage svg{width:100%;height:100%;display:block;user-select:none}
.hud{position:absolute;left:10px;top:8px;right:10px;display:flex;gap:8px;align-items:flex-start;pointer-events:none;flex-wrap:wrap}
.cap{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:7px;padding:5px 10px;max-width:min(640px,100%);box-shadow:0 1px 3px #0001;pointer-events:auto}
.cap b{font-weight:700}.cap .t{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px}
.legend{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;background:var(--panel);opacity:.95;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:11px}.legend i{display:inline-block;width:10px;height:7px;border-radius:2px;margin-right:4px}
.gap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);color:var(--bg);border-radius:20px;padding:8px 18px;font-weight:700;opacity:0;transition:opacity .4s;pointer-events:none}.gap.on{opacity:.92}
.hintbar{position:absolute;left:10px;bottom:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:11.5px;color:var(--muted)}
/* ---- noeuds (SVG) ---- */
.node{cursor:pointer}.node .card{fill:var(--card);stroke:var(--cardline);stroke-width:1.4;filter:drop-shadow(0 1px 2px #0002)}.node:hover .card{stroke:var(--muted)}
.node.act .card{stroke:var(--brand);stroke-width:2.6}.node.pov .card{stroke:var(--k-tcp);stroke-width:2.6;stroke-dasharray:5 3}
.node .nm{font-size:13px;font-weight:700;fill:var(--ink);pointer-events:none}.node .ipl{font-size:10.5px;fill:var(--muted);font-family:var(--mono);pointer-events:none}
.node .rl{font-size:10px;fill:var(--muted);pointer-events:none}
.node .gl{color:var(--ink);pointer-events:none}.node.dead .card{stroke:var(--k-bad);stroke-width:2.6}
.node.dim{opacity:.5}
.lk{stroke:var(--muted);stroke-width:2.4;opacity:.7}.lk.hot{stroke:var(--brand);opacity:1;stroke-width:3.4}
.lk.wan{stroke-dasharray:2 7;stroke-linecap:round;stroke-width:3.2}
.cloudlbl{font-size:11px;fill:var(--muted)}
.chip rect{stroke:#fff;stroke-width:1.5;filter:drop-shadow(0 1px 3px #0005)}.chip text{fill:#fff;font-weight:700;font-size:11px;pointer-events:none}.chip .sub{font-weight:600;font-size:9.5px;opacity:.95}
.chip.bad rect{fill:var(--k-bad)!important}
.bub rect{fill:var(--ink);opacity:.94}.bub text{fill:var(--bg);font-size:11.5px;pointer-events:none}.bub.ok rect{fill:var(--ok)}.bub.err rect{fill:var(--k-bad)}.bub.nat rect{fill:var(--warn)}.bub.ign rect{fill:var(--muted)}
.bub.ok text,.bub.err text,.bub.nat text,.bub.ign text{fill:#fff}
.pkt-in{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
/* ---- barre de lecture ---- */
#dock{flex:none;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;height:var(--dockh,320px);min-height:150px}
#xport{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#xport button{min-width:34px}#play{min-width:96px}
#timeline{flex:1;min-width:0;overflow:hidden;display:flex;align-items:center;gap:2px;height:30px;padding:0 4px}
.tick{flex:1;min-width:2px;max-width:34px;height:20px;border-radius:3px;border:0;padding:0;opacity:.35;position:relative;transition:opacity .15s,transform .15s}.tick:hover{opacity:.8}
.tick.past{opacity:.75}.tick.cur{opacity:1;transform:scaleY(1.3);outline:2px solid var(--ink);outline-offset:1px}.tick.sep{margin-left:5px}
#xinfo{font-family:var(--mono);font-size:11.5px;color:var(--muted);min-width:90px;text-align:right}
#dtabs{display:flex;background:var(--panel2);border-bottom:1px solid var(--line)}
.dtab{border:0;border-radius:0;background:none;padding:6px 14px}.dtab.on{background:var(--panel);font-weight:600;border-top:2px solid var(--brand);color:var(--brand)}
#dockbody{flex:1;min-height:0;overflow:auto;position:relative}
#grip{height:7px;cursor:ns-resize;background:var(--panel);border-top:1px solid var(--line);flex:none;position:relative}#grip::after{content:"";position:absolute;left:50%;top:2px;width:40px;margin-left:-20px;height:3px;border-radius:2px;background:var(--line)}
/* ---- journal ---- */
table.j{width:100%;border-collapse:collapse;font-size:12px}table.j th{position:sticky;top:0;background:var(--panel2);text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);font-weight:600;color:var(--muted);z-index:1}
table.j td{padding:3px 8px;border-bottom:1px solid var(--line);white-space:nowrap}table.j td.info{white-space:normal;min-width:240px}
.pk-row{cursor:pointer}.pk-row:hover{background:var(--hover)}.pk-row.fut{opacity:.4}.pk-row.act{background:var(--brand2);font-weight:600}
.pk-row.gapr td{border-top:2px dashed var(--muted)}
.bd{display:inline-block;padding:0 8px;border-radius:10px;font-size:11px;font-weight:700;color:#fff;background:var(--c,var(--muted))}
.lostb{background:var(--k-bad);color:#fff;border-radius:8px;padding:0 6px;font-size:10px;margin-left:6px}
/* ---- paquet : empilement des en-têtes ---- */
.pv{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.where{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px}.where b{font-weight:700}
.where .mini{font-size:11.5px;color:var(--muted)}
.chg{background:#fffbeb;border:1px solid #fcd34d;border-left:4px solid var(--warn);color:#78350f;border-radius:6px;padding:5px 10px;font-size:12.5px}
html[data-theme=dark] .chg{background:#2a2110;border-color:#7a5a12;color:#fde7a6}
.chg.nil{background:var(--panel2);border-color:var(--line);color:var(--muted)}
.enc{display:flex;flex-direction:column;gap:0}
.ly{border:2px solid var(--c);border-radius:8px;background:color-mix(in srgb,var(--c) 7%,var(--panel));padding:5px 8px 8px}
.ly .ly{margin-top:6px}
.ly>.lh{display:flex;align-items:baseline;gap:8px;font-weight:700;color:var(--c);margin-bottom:3px}.ly>.lh small{font-weight:400;color:var(--muted)}
.fields{display:flex;flex-wrap:wrap;gap:4px 6px}
.fd{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 7px;font-size:12px;line-height:1.5}.fd .k{color:var(--muted);margin-right:5px}.fd .v{font-family:var(--mono);font-weight:600}
.fd.ch{border-color:var(--warn);background:#fffbeb;color:#78350f}.fd.ch .k{color:#92400e}html[data-theme=dark] .fd.ch{background:#2a2110;color:#fde7a6}
.fd.key{border-color:var(--c)}
.payload{font-family:var(--mono);font-size:12px;background:var(--code);border-radius:5px;padding:5px 8px;white-space:pre-wrap;word-break:break-all;margin-top:4px}
.lock{display:flex;gap:8px;align-items:center;background:repeating-linear-gradient(135deg,var(--code),var(--code) 8px,var(--panel2) 8px,var(--panel2) 16px);border:1px dashed var(--k-sec);border-radius:5px;padding:7px 10px;color:var(--k-sec);font-weight:600;margin-top:4px}
.empty{padding:16px;color:var(--muted)}
.tgl{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
/* ---- inspecteur droit ---- */
#rtabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.rtab{flex:1;border:0;border-radius:0;background:none;padding:9px 4px}.rtab.on{border-bottom:2px solid var(--brand);font-weight:600;color:var(--brand)}
#rpane{flex:1;overflow:auto;padding:12px 14px 20px}
.ph{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}.ph h2{margin:0;font-size:20px;line-height:1.1}.ph .fn{color:var(--muted);font-size:12px}
.pill{display:inline-block;border-radius:12px;padding:1px 9px;font-size:11px;background:var(--brand2);color:var(--brand);font-weight:600;white-space:nowrap}.pill.g{background:#dcfce7;color:#166534}html[data-theme=dark] .pill.g{background:#12331f;color:#86efac}
.sc{border:1px solid var(--line);border-left:4px solid var(--c,var(--brand));border-radius:8px;padding:10px 12px;margin:8px 0;background:var(--panel)}
.sc .eb{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--c,var(--brand))}
.sc h3{margin:2px 0 6px;font-size:15.5px;line-height:1.25}
.sc p{margin:6px 0}.sc .lab{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:9px}
.look{background:var(--brand2);border-radius:6px;padding:6px 10px;margin-top:8px}.look .lab{margin-top:0;color:var(--brand)}
.now{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0}.now .lab{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ana{background:#fff7ed;border:1px solid #fed7aa;border-left:4px solid #ea580c;color:#7c2d12;border-radius:6px;padding:8px 10px;margin:8px 0}html[data-theme=dark] .ana{background:#2a1a0c;border-color:#7c3a12;color:#fed7aa}
.ana b{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:8px 0}.kv dt{color:var(--muted);font-size:12px}.kv dd{margin:0;font-weight:600}
.wd{margin:6px 0}.wd dt{font-weight:700;display:inline}.wd dd{display:inline;margin:0 0 0 4px;color:var(--ink)}.wd div{margin:3px 0}
.lvl{border:1px solid var(--line);border-radius:8px;margin:10px 0;overflow:hidden}.lvl>.lt{background:var(--top);color:#e2e8f0;padding:5px 10px;font-weight:700;font-size:12px}
.lvl>.lb{padding:8px 10px}.lvl h4{margin:10px 0 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.lvl h4:first-child{margin-top:0}
.lvl ul{margin:4px 0;padding-left:18px}.lvl li{margin:3px 0}
.cmd{display:flex;align-items:center;gap:6px;background:var(--code);border:1px solid var(--line);border-radius:6px;padding:3px 4px 3px 8px;margin:4px 0}.cmd span{flex:1;font-family:var(--mono);font-size:12px;word-break:break-all}.cmd button{padding:1px 8px;font-size:11.5px}
.callout{border-left:4px solid var(--warn);background:#fffbeb;color:#78350f;border-radius:6px;padding:7px 10px;margin:8px 0}.callout.sec{border-color:var(--err);background:#fef2f2;color:#7f1d1d}
html[data-theme=dark] .callout{background:#2a2110;color:#fde7a6}html[data-theme=dark] .callout.sec{background:#2b1414;color:#fecaca}
.calc{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;margin:6px 0}.calc td,.calc th{border:1px solid var(--line);padding:3px 6px;text-align:center}.calc th{background:var(--panel2);font-family:var(--sans)}.calc .m{background:#dcfce7;color:#166534}.calc .x{background:#fee2e2;color:#991b1b}
html[data-theme=dark] .calc .m{background:#12331f;color:#86efac}html[data-theme=dark] .calc .x{background:#3a1616;color:#fecaca}
.quiz .q{font-weight:700;margin:4px 0 8px}.opts{display:grid;gap:6px}
.opt{display:flex;gap:8px;text-align:left;padding:7px 9px;border-radius:7px}.opt .l{flex:none;width:20px;height:20px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:11px;font-weight:700}
.opt.ok{border-color:var(--ok);background:#dcfce7;color:#14532d}.opt.ko{border-color:var(--err);background:#fee2e2;color:#7f1d1d}
html[data-theme=dark] .opt.ok{background:#12331f;color:#bbf7d0}html[data-theme=dark] .opt.ko{background:#3a1616;color:#fecaca}
.fb{margin-top:8px}.fb b.g{color:var(--ok)}.fb b.r{color:var(--err)}
.nextp{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;padding:8px 10px;border:1px dashed var(--brand);border-radius:8px;background:var(--brand2)}
/* ---- modale ---- */
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:50;padding:12px}#modal.on{display:flex}
#mbox{background:var(--panel);border-radius:10px;max-width:760px;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 10px 40px #0006}
#mbox header{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700}#mbox header button{margin-left:auto}
#mbody{overflow:auto;padding:12px 16px}#mbody h4{margin:14px 0 4px}#mbody kbd{background:var(--code);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-family:var(--mono);font-size:12px}
.lic-box{background:#f0f9ff;border:1px solid #bae6fd;border-left:4px solid #0284c7;border-radius:6px;padding:10px 12px;margin:10px 0;color:#0c4a6e;line-height:1.55}.lic-box b{color:#075985}
html[data-theme=dark] .lic-box{background:#0c2233;border-color:#155e75;color:#bae6fd}html[data-theme=dark] .lic-box b{color:#7dd3fc}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;z-index:60}#toast.on{opacity:.95;transform:translateX(-50%)}
/* ---- projecteur ---- */
body.projector{font-size:16px}body.projector .node .nm{font-size:16px}body.projector .node .ipl{font-size:13px}body.projector .chip text{font-size:13px}body.projector .bub text{font-size:14px}body.projector .fd{font-size:14px}body.projector .payload,body.projector table.j,body.projector .cmd span{font-size:14px}
/* ---- adaptatif ---- */
@media (max-width:1180px){#right{width:310px}#left{width:222px}}
@media (max-width:980px){
 body{overflow:auto}html,body{height:auto}
 #main{flex-direction:column}

'use strict';
/* ====================== PETITS OUTILS ====================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const SVGNS='http://www.w3.org/2000/svg';
function h(sel,a,...kids){
 const m=/^([a-z0-9]*)((?:[.#][\w-]+)*)$/i.exec(sel),tag=m[1]||'div';
 const svg=h.svg;const el=svg?document.createElementNS(SVGNS,tag):document.createElement(tag);
 (m[2].match(/[.#][\w-]+/g)||[]).forEach(x=>x[0]==='.'?el.classList.add(x.slice(1)):el.id=x.slice(1));
 if(a&&(typeof a!=='object'||a instanceof Node||Array.isArray(a))){kids.unshift(a);a=null}
 if(a)for(const k in a){const v=a[k];if(v==null||v===false)continue;
  if(k==='style'&&typeof v==='object'){for(const s in v){if(s.startsWith('--'))el.style.setProperty(s,v[s]);else el.style[s]=v[s]}}
  else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
  else if(k==='html')el.innerHTML=v;
  else el.setAttribute(k,v===true?'':v)}
 (function add(list){for(const c of list){if(c==null||c===false)continue;if(Array.isArray(c))add(c);else el.appendChild(c instanceof Node?c:document.createTextNode(String(c)))}})(kids);
 return el;
}
const sv=(sel,a,...k)=>{h.svg=true;try{return h(sel,a,...k)}finally{h.svg=false}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function fmtT(t){if(t<1)return(t*1000).toFixed(t<0.01?1:0)+' ms';if(t<60)return t.toFixed(t<10?3:2)+' s';if(t<3600)return Math.floor(t/60)+' min '+Math.round(t%60)+' s';return(t/3600).toFixed(t%3600?1:0).replace('.',',')+' h'}
function fmtGap(d){if(d>=3600)return Math.round(d/3600)+' h plus tard';if(d>=60)return Math.round(d/60)+' min plus tard';return Math.round(d)+' s plus tard'}

/* ====================== COULEURS PAR FAMILLE ====================== */
const KINDS={net:['Réseau (IP, ARP, ICMP)','var(--k-net)'],tcp:['TCP','var(--k-tcp)'],udp:['UDP','var(--k-udp)'],dns:['DNS','var(--k-dns)'],app:['Application','var(--k-app)'],sec:['Chiffré (TLS, SSH)','var(--k-sec)']};
function kindOf(p){
 if(p.kind)return p.kind;
 const n=(p.proto||'').toUpperCase();
 if(n==='DNS')return'dns';if(n==='TCP')return'tcp';if(n==='UDP')return'udp';
 if(n.startsWith('TLS')||n==='SSH'||(p.app&&p.app.enc))return'sec';
 if(['ARP','ICMP','IP'].includes(n))return'net';
 return'app';
}

/* ====================== SCÈNES (topologies) ====================== */
const MACS={};let macN=0;
function autoMac(id){return MACS[id]||(MACS[id]='00:00:5e:00:53:'+(0xb0+(macN++)).toString(16))}
const NODE={
 pc:{k:'pc',name:'Poste client',ip:'192.168.1.10',mac:'00:00:5e:00:53:10',role:'Votre ordinateur'},
 pc2:{k:'pc',name:'PC voisin',ip:'192.168.1.11',mac:'00:00:5e:00:53:11',role:'Autre poste du réseau'},
 prn:{k:'prn',name:'Imprimante',ip:'192.168.1.20',mac:'00:00:5e:00:53:20',role:'Autre équipement'},
 sw:{k:'sw',name:'Switch',ip:'',mac:'',role:'Commute les trames (couche 2)'},
 rt:{k:'rt',name:'Box / routeur',ip:'192.168.1.1',wip:'198.51.100.7',mac:'00:00:5e:00:53:01',wmac:'00:00:5e:00:53:02',role:'Passerelle + NAT',nat:true},
 isp:{k:'rt',name:'Routeur du FAI',ip:'198.51.100.1',mac:'00:00:5e:00:53:a1',role:'1er routeur du fournisseur'},
 cloud:{k:'cloud',name:'Internet',ip:'',role:''},
 srv:{k:'srv',name:'Serveur',ip:'203.0.113.10',mac:'00:00:5e:00:53:c0',role:''}
};
/* positions : x,y dans un repère 960 × 430 ; les liens sont des couples d'identifiants */
const LAYOUT={
 lan:{n:{pc:[130,215],sw:[370,215],pc2:[370,66],prn:[370,364],rt:[620,215]},l:[['pc','sw'],['pc2','sw'],['prn','sw'],['sw','rt']],lan:['pc','sw','pc2','prn','rt']},
 ipx:{n:{pc:[86,215],sw:[246,215],pc2:[246,66],prn:[246,364],rt:[420,215],cloud:[620,215],srv:[850,215]},l:[['pc','sw'],['pc2','sw'],['prn','sw'],['sw','rt'],['rt','cloud'],['cloud','srv']],lan:['pc','sw','pc2','prn','rt']},
 wan1:{n:{pc:[110,215],rt:[340,215],cloud:[580,215],srv:[840,215]},l:[['pc','rt'],['rt','cloud'],['cloud','srv']],lan:['pc','rt']},
 icmp:{n:{pc:[86,215],rt:[270,215],isp:[450,215],cloud:[640,215],srv:[850,215]},l:[['pc','rt'],['rt','isp'],['isp','cloud'],['cloud','srv']],lan:['pc','rt']},
 web:{n:{pc:[110,215],rt:[330,215],cloud:[560,215],res:[840,88],srv:[840,342]},l:[['pc','rt'],['rt','cloud'],['cloud','res'],['cloud','srv']],lan:['pc','rt']},
 dns:{n:{pc:[100,215],rt:[300,215],cloud:[520,215],res:[840,60],root:[840,160],tld:[840,270],auth:[840,370]},l:[['pc','rt'],['rt','cloud'],['cloud','res'],['cloud','root'],['cloud','tld'],['cloud','auth']],lan:['pc','rt']},
 mail:{n:{pc:[100,215],rt:[310,215],cloud:[540,215],smtp:[840,66],dns:[840,215],mx:[840,364]},l:[['pc','rt'],['rt','cloud'],['cloud','smtp'],['cloud','dns'],['cloud','mx']],lan:['pc','rt']}
};
function buildScene(spec){
 const L=LAYOUT[spec.layout];if(!L)throw new Error('scène inconnue '+spec.layout);
 const nodes={};
 for(const id in L.n){
  const base=NODE[id]||{k:'srv',name:id,ip:'',role:''};
  const o=Object.assign({},base,(spec.nodes&&spec.nodes[id])||{});
  o.id=id;o.x=L.n[id][0];o.y=L.n[id][1];
  if(o.k!=='sw'&&o.k!=='cloud'&&!o.mac)o.mac=autoMac(spec.layout+id);
  nodes[id]=o;
 }
 /* Internet compte N routeurs : le total vu depuis la box vaut 12 (TTL 64 -> 52) */
 if(nodes.cloud)nodes.cloud.hops=spec.layout==='icmp'?10:11;
 const links=L.l.map(([a,b])=>({a,b,wan:nodes[a].k==='cloud'||nodes[b].k==='cloud'||(nodes[a].k==='rt'&&nodes[b].k==='rt')||(a==='rt'&&b==='isp')}));
 return{nodes,links,lan:new Set(L.lan),sub:spec.sub||'none',spec};
}
function neighbors(sc,id){const o=[];sc.links.forEach(l=>{if(l.a===id)o.push(l.b);else if(l.b===id)o.push(l.a)});return o}
function bfsPath(sc,a,b){
 if(a===b)return[a];const prev={[a]:null},q=[a];
 while(q.length){const u=q.shift();if(u===b)break;neighbors(sc,u).forEach(v=>{if(!(v in prev)){prev[v]=u;q.push(v)}})}
 if(!(b in prev))return[a,b];const out=[];for(let u=b;u!==null;u=prev[u])out.unshift(u);return out;
}

/* ====================== SIMULATION D'UN PAQUET ====================== */
const BCAST='ff:ff:ff:ff:ff:ff';
function ipOf(sc,id,other){
 const n=sc.nodes[id];if(!n)return'?';
 if(n.k==='rt'&&n.wip&&other&&!sc.lan.has(other))return n.wip;
 return n.ip||'';
}
function macOf(sc,id,neighbor){
 const n=sc.nodes[id];
 if(n.k==='cloud')return null;
 if(n.k==='rt'&&n.wmac&&neighbor&&!sc.lan.has(neighbor))return n.wmac;
 return n.mac;
}
function defaultTTL(sc,id){return sc.nodes[id].k==='pc'?128:64}
function cloneL4(l){return l?JSON.parse(JSON.stringify(l)):null}
/* Renvoie un objet décrivant le trajet complet : étapes, événements, en-têtes par lien. */
function simulate(sc,pk){
 if(pk._j)return pk._j;
 const from=pk.from,bc=!!pk.bc;
 const J={bc,stages:[],hops:[],death:null,pk};
 const lanNode=id=>sc.lan.has(id);
 if(bc){
  /* diffusion : l'arbre de diffusion couvre le réseau local, sans franchir le routeur */
  const seen=new Set([from]);let front=[from],depth=0;
  while(front.length){
   const moves=[],next=[];
   front.forEach(u=>{
    if(depth>0&&sc.nodes[u].k!=='sw')return;
    neighbors(sc,u).forEach(v=>{if(!seen.has(v)&&lanNode(v)){seen.add(v);moves.push({a:u,b:v});next.push(v)}});
   });
   if(!moves.length)break;
   const evs=[];
   moves.forEach(m=>{
    const n=sc.nodes[m.b];
    if(n.k==='sw')evs.push({node:m.b,text:'Diffusion : le switch copie la trame\nsur tous ses autres ports',cls:''});
    else if((pk.rcv||[]).includes(m.b))evs.push({node:m.b,text:pk.bub||'Reçu',cls:'ok'});
    else evs.push({node:m.b,text:'Ignore : pas pour moi',cls:'ign'});
   });
   const eth=bcEth(sc,pk,from);
   J.stages.push({moves,evs,hop:{a:moves[0].a,b:moves[0].b,eth,ip:ipBlock(sc,pk,from,null,pk.ttl||defaultTTL(sc,from),false),l4:cloneL4(pk.l4),changes:[]},depth});
   front=next;depth++;
  }
  /* hop affiché = celui qui mène à un destinataire réel, sinon le premier */
  J.stages.forEach(s=>{const r=s.moves.find(m=>(pk.rcv||[]).includes(m.b));if(r){s.hop.a=r.a;s.hop.b=r.b}});
  return pk._j=J;
 }
 const path=bfsPath(sc,from,pk.to);J.path=path;
 let ttl=pk.ttl||defaultTTL(sc,from);
 const natIdx=path.findIndex(id=>sc.nodes[id].nat);
 const outb=lanNode(from)&&!lanNode(pk.to),inb=!lanNode(from)&&lanNode(pk.to);
 const lostIdx=pk.lost?path.indexOf(pk.lost):-1;
 for(let j=0;j<path.length-1;j++){
  const a=path[j],b=path[j+1],last=j+1===path.length-1;
  /* en-têtes du lien j */
  const wanSide=natIdx>=0&&((outb&&j>=natIdx)||(inb&&j<natIdx));
  const hop={a,b,eth:ethOf(sc,pk,path,j),ip:ipBlock(sc,pk,from,pk.to,ttl,wanSide,outb,inb),l4:natL4(pk,wanSide,outb),changes:[]};
  if(hop.ip)hop.ip.nat=wanSide;
  const evs=[];let dead=null;
  const nb=sc.nodes[b];
  /* événements à l'arrivée dans b */
  if(!last){
   if(nb.k==='sw')evs.push({node:b,text:'Le switch transmet la trame\nsans la modifier',cls:''});
   else if(nb.k==='rt'){
    const lines=[];
    if(ttl<=1){dead={why:'ttl',text:'TTL = 0 : le routeur détruit le paquet\net prévient l’émetteur (ICMP)'};}
    else{lines.push('TTL '+ttl+' → '+(ttl-1));}
    if(!dead&&nb.nat&&b===path[natIdx]&&(outb||inb)){
     const l4=pk.l4,hasP=l4&&(l4.k==='tcp'||l4.k==='udp'),priv=sc.nodes[outb?from:pk.to].ip;
     const mp=(pk.nat&&pk.nat.mp)||(hasP?(outb?l4.sp:l4.dp):null);
     if(outb)lines.push('NAT : '+priv+(hasP?':'+l4.sp:'')+' → '+nb.wip+(hasP?':'+mp:''));
     else lines.push('NAT inverse : '+nb.wip+(hasP?':'+mp:'')+' → '+priv+(hasP?':'+l4.dp:''));
    }
    if(!dead)evs.push({node:b,text:lines.join('\n'),cls:lines.length>1?'nat':''});
    else{evs.push({node:b,text:dead.text,cls:'err'});}
    if(!dead)ttl-=1;
   }else if(nb.k==='cloud'){
    const hn=nb.hops;
    if(ttl<=hn){dead={why:'ttl',text:'TTL épuisé dans Internet'};evs.push({node:b,text:dead.text,cls:'err'})}
    else{evs.push({node:b,text:'≈ '+hn+' routeurs traversés\nTTL '+ttl+' → '+(ttl-hn),cls:''});ttl-=hn}
   }
  }
  if(!dead&&lostIdx===j+1){dead={why:'lost',text:'Paquet perdu\n(congestion, liaison coupée…)'};evs.push({node:b,text:dead.text,cls:'err'})}
  if(last&&!dead){
   if(pk.bub)evs.push({node:b,text:pk.bub,cls:'ok'});
   else evs.push({node:b,text:'Reçu',cls:'ok'});
  }
  J.stages.push({moves:[{a,b}],evs,hop,dead:!!dead});
  if(dead){J.death={i:j+1,why:dead.why};break}
 }
 /* diffs entre liens successifs */
 for(let i=1;i<J.stages.length;i++)J.stages[i].hop.changes=diffHop(J.stages[i-1].hop,J.stages[i].hop);
 return pk._j=J;
}
function bcEth(sc,pk,from){return{src:macOf(sc,from)||'',dst:BCAST,type:pk.l4&&pk.l4.k==='arp'?'0x0806 (ARP)':'0x0800 (IPv4)'}}
function ethOf(sc,pk,path,j){
 let s=j;while(s>0&&sc.nodes[path[s]].k==='sw')s--;
 let e=j+1;while(e<path.length-1&&sc.nodes[path[e]].k==='sw')e++;
 const nS=sc.nodes[path[s]],nE=sc.nodes[path[e]];
 let src=macOf(sc,path[s],path[s+1]),dst=macOf(sc,path[e],path[e-1]);
 if(nS.k==='cloud')src='MAC du dernier routeur';
 if(nE.k==='cloud')dst='MAC du routeur suivant';
 if(src==null)src='?';if(dst==null)dst='?';
 return{src,dst,type:pk.l4&&pk.l4.k==='arp'?'0x0806 (ARP)':'0x0800 (IPv4)',seg:[nS.id,nE.id]};
}
function ipBlock(sc,pk,from,to,ttl,wanSide,outb,inb){
 if(pk.l4&&pk.l4.k==='arp')return null;
 const o=pk.ip||[];
 let src=o[0]!=null?o[0]:ipOf(sc,from,to),dst=o[1]!=null?o[1]:(to?ipOf(sc,to,from):'255.255.255.255');
 if(wanSide){
  const rt=Object.values(sc.nodes).find(n=>n.nat);
  if(outb)src=rt.wip;else if(inb)dst=rt.wip;
 }
 const l=pk.l4;
 const pr=l?({tcp:'TCP (6)',udp:'UDP (17)',icmp:'ICMP (1)'}[l.k]||''):'';
 return{src,dst,ttl,proto:pr};
}
function natL4(pk,wanSide,outb){
 const l=cloneL4(pk.l4);if(!l||!wanSide||!pk.nat||!pk.nat.mp)return l;
 if(l.k==='tcp'||l.k==='udp'){if(outb)l.sp=pk.nat.mp;else l.dp=pk.nat.mp}
 return l;
}
function diffHop(p,q){

 D.DHCP={name:'DHCP',full:'Dynamic Host Configuration Protocol',scene:{layout:'lan',sub:'ip',nodes:{rt:{name:'Box (serveur DHCP)'},pc:{ip:'0.0.0.0'}}},
  ipStep:{pc:[[4,'192.168.1.10']]},

  analogy:'C’est l’accueil d’un hôtel. Le client arrive sans chambre et demande à voix haute « qui peut me loger ? » (Discover). La réception propose la chambre 12 (Offer), le client l’accepte (Request), puis reçoit sa clé et la durée du séjour (ACK). À mi-séjour, il vient prolonger.',
  prereq:['IP'],
  facts:[['Couche OSI','7 — Application'],['Transport','UDP : port 67 (serveur) et 68 (client)'],['Échange','DORA : Discover, Offer, Request, ACK'],['Durée','Bail (24 h dans l’exemple), renouvelé à 50 %'],['Diffusion','Discover et Request sont envoyés à tous'],['Norme','RFC 2131']],
  words:[['Bail','durée pendant laquelle l’adresse est prêtée'],['DORA','les quatre messages : Discover, Offer, Request, ACK'],['Diffusion (broadcast)','message destiné à tous les équipements du réseau local'],['Étendue (pool)','plage d’adresses que le serveur peut distribuer'],['Réservation','adresse toujours donnée à la même MAC'],['Relais DHCP','fait suivre les demandes vers un serveur d’un autre sous-réseau']],
  steps:[
   {t:'Un poste sans adresse',

    why:'Configurer chaque poste à la main est long et source d’erreurs (doublons d’adresses, masque faux…). DHCP automatise tout : un serveur prête des adresses.',
    look:'Le poste affiche « 0.0.0.0 » : c’est l’adresse « je n’en ai pas ». Elle changera à l’étape de confirmation.',
    bub:['pc','Je n’ai pas d’adresse IP\n(0.0.0.0)',''],w:'Les premiers paquets d’une capture de démarrage viennent de 0.0.0.0.'},
   {t:'Découverte : Discover',
    what:'Le poste envoie un message <b>DHCP Discover</b> depuis 0.0.0.0 vers l’adresse de diffusion 255.255.255.255, avec comme adresse MAC de destination ff:ff:ff:ff:ff:ff. Il dit en substance : « je cherche un serveur DHCP ».',
    why:'Le poste ne sait pas où se trouve le serveur et n’a pas d’adresse source valable : la diffusion est la seule façon d’être entendu de tout le réseau.',
    look:'Le switch copie la trame vers tous ses ports. Le PC voisin et l’imprimante l’ignorent : seule la box, qui est serveur DHCP, est concernée.',
    w:'Filtre <code>dhcp</code>. Repérez « DHCP Discover », la source 0.0.0.0 et le même <i>Transaction ID</i> dans les quatre messages.'},

    what:'La box choisit une adresse libre dans sa plage et la propose avec le reste de la configuration : masque, passerelle, DNS et durée du bail. L’offre est envoyée à l’adresse MAC du poste, car celui-ci n’a pas encore d’IP.',
    why:'Le serveur réserve provisoirement l’adresse proposée pour ne pas la donner à un autre poste pendant que le client réfléchit.',
    look:'Contrairement au Discover, l’Offer ne va que vers le poste : un seul chemin.',
    w:'Dans l’en-tête DHCP, « Your (client) IP address » contient l’adresse proposée ; les options 1, 3, 6 et 51 donnent masque, passerelle, DNS et bail.'},
   {t:'Demande : Request',
    what:'Le poste accepte l’offre en envoyant un <b>DHCP Request</b>. Il le diffuse de nouveau, en citant l’adresse demandée et le serveur retenu.',
    why:'S’il y avait plusieurs serveurs DHCP, chacun a fait une offre. La diffusion prévient tous les serveurs de celui qui est choisi : les autres libèrent l’adresse qu’ils avaient réservée.',

   {t:'Confirmation : ACK',
    what:'La box répond par un <b>DHCP ACK</b> : le prêt est validé. Le poste configure alors son interface avec l’adresse, le masque, la passerelle et les DNS reçus, et démarre le minuteur du bail.',
    why:'C’est l’ACK, et non l’Offer, qui engage le serveur : tant qu’il n’est pas reçu, l’adresse n’appartient pas au poste.',
    look:'L’adresse du poste passe de 0.0.0.0 à 192.168.1.10 sur le schéma.',
    w:'Après l’ACK, vérifiez sur le poste avec <code>ipconfig /all</code> : adresse, bail obtenu et bail expirant.'},
   {t:'Vérification de l’adresse (ARP)',
    what:'Avant d’utiliser l’adresse, beaucoup de postes envoient un <b>ARP Probe</b> : « Qui possède 192.168.1.10 ? » avec 0.0.0.0 comme source. Si quelqu’un répond, l’adresse est déjà prise et le poste la refuse.',
    why:'Une adresse peut être utilisée par erreur par un poste configuré à la main. Ce test évite un conflit d’adresses, qui coupe le réseau des deux machines.',
    look:'Personne ne répond : l’adresse est libre, le poste peut l’utiliser.',
    w:'Filtre <code>arp.isprobe</code>. Une réponse à cette requête signalerait un conflit.'},
   {t:'Renouvellement du bail',
    what:'Douze heures plus tard, la moitié du bail est écoulée. Le poste n’a plus besoin de diffuser : il demande directement (en unicast) à son serveur de prolonger le prêt. Le serveur répond par un ACK et le bail repart pour 24 h.',
    why:'Le renouvellement évite que l’adresse expire en pleine utilisation. Si le serveur ne répondait pas, le poste réessaierait à 87,5 % du bail en diffusant (rebinding).',
    look:'Plus de diffusion : seuls le poste et la box sont concernés.',
    w:'Une capture longue montre le renouvellement à T1 (50 % du bail) avec des adresses IP réelles, pas 0.0.0.0.'}

 echo(0,1,128,{app:{name:'Données du ping',lines:['32 octets : abcdefghijklmnopqrstuvwabcdefghi']},bub:'Echo Request reçu',cap:'Le poste envoie un Echo Request : « 203.0.113.10, es-tu là ? ». Le TTL part à 128.'});
 b.step(1);
 b.icmp(0.017,'srv','pc',0,0,'Echo (ping) reply  id=0x0001, seq=1/256, ttl=52',{ttl:64,sz:74,sub:'ttl',bub:'Réponse reçue : temps aller-retour 17 ms',cap:'Le serveur renvoie un Echo Reply avec le même identifiant et le même numéro de séquence.'},{id:1,seq:1,label:'Echo reply'});

 b.icmp(1.001,'rt','pc',11,0,'Time-to-live exceeded (Time to live exceeded in transit)',{ttl:64,sub:'ttl',bub:'Le routeur 192.168.1.1 m’a répondu :\nil est le saut n° 1',cap:'La box signale « TTL expiré » : elle révèle ainsi son adresse. C’est le saut n° 1 du traceroute.'},{label:'Time exceeded'});
 b.step(3);
 echo(2,3,2,{cap:'Avec un TTL de 2, la box laisse passer (TTL 1) mais le routeur suivant va détruire le paquet.'});
 b.icmp(2.005,'isp','pc',11,0,'Time-to-live exceeded (Time to live exceeded in transit)',{ttl:255,sub:'ttl',bub:'Le routeur 198.51.100.1 m’a répondu :\nil est le saut n° 2',cap:'Le routeur du fournisseur signale « TTL expiré » : c’est le saut n° 2.'},{label:'Time exceeded'});
 b.step(4);
 echo(3,4,13,{cap:'Avec un TTL de 13, le paquet traverse les 12 routeurs et arrive jusqu’au serveur.'});
 b.icmp(3.017,'srv','pc',0,0,'Echo (ping) reply  id=0x0001, seq=4/1024, ttl=52',{ttl:64,sub:'ttl',bub:'Le serveur lui-même répond :\nle tracé est complet',cap:'Cette fois le serveur répond : l’adresse de destination est atteinte, le traceroute s’arrête.'},{id:1,seq:4,label:'Echo reply'});

 b.icmp(4.017,'srv','pc',3,3,'Destination unreachable (Port unreachable)',{ttl:64,sub:'ttl',sz:70,bub:'Message d’erreur reçu :\nle port est fermé',cap:'Personne n’écoute sur ce port : le serveur renvoie « Port unreachable » (type 3, code 3).'},{label:'Destination unreachable'});
 D.ICMP={name:'ICMP',full:'Internet Control Message Protocol',scene:{layout:'icmp',sub:'ttl',nodes:{srv:{name:'Serveur web',ip:'203.0.113.10'}}},
  goal:'ICMP est le protocole de diagnostic de la couche réseau : il permet de tester si une machine répond (ping), de tracer le chemin (traceroute) et de signaler les erreurs de livraison.',
  analogy:'ICMP est le service « suivi du courrier » : un coup de sonde pour savoir si quelqu’un répond à une adresse, et des avis de retour du type « destinataire inconnu » ou « courrier détruit : trop de relais traversés ».',
  prereq:['IP'],
  facts:[['Couche OSI','3 — Réseau (porté directement par IP)'],['Ports','Aucun : ICMP n’utilise ni TCP ni UDP'],['Types courants','0 et 8 : écho · 3 : injoignable · 11 : TTL expiré'],['Outils','ping, tracert, traceroute, mtr'],['Particularité','Souvent filtré par les pare-feu'],['Norme','RFC 792']],
  words:[['Echo request / reply','question et réponse du ping'],['TTL','nombre de routeurs que le paquet peut encore traverser'],['RTT','temps aller-retour mesuré par le ping'],['Traceroute','envoie des paquets de TTL croissant pour découvrir chaque routeur'],['Type / code','identifient le message ICMP (ex. 3 / 3 : port injoignable)']],
  steps:[
   {t:'Ping : « es-tu là ? »',
    what:'La commande <code>ping 203.0.113.10</code> envoie un message ICMP de type 8, <b>Echo Request</b>, qui contient un identifiant, un numéro de séquence et quelques octets de données. Le message est placé directement dans un paquet IP : il n’y a ni port, ni connexion.',
    why:'Il faut un moyen simple de savoir si une machine est joignable et combien de temps met un aller-retour, sans dépendre d’un service particulier.',
    look:'Sous l’étiquette du paquet, le TTL part à 128 et diminue à chaque routeur : la box, le routeur du fournisseur, puis environ dix routeurs dans Internet.',
    w:'Filtre <code>icmp.type == 8</code>. L’identifiant et le numéro de séquence relient chaque réponse à sa demande.'},
   {t:'La réponse : « je suis là »',
    what:'Le serveur renvoie un <b>Echo Reply</b> (type 0) avec le même identifiant et le même numéro de séquence. C’est ainsi que ping associe chaque réponse à sa question et mesure le temps aller-retour (ici 17 ms).',
    why:'Sans numéro de séquence, impossible de savoir à quelle demande correspond une réponse, ni de détecter une réponse perdue.',
    look:'Le serveur part avec un TTL de 64 et le paquet arrive à 52 : il a donc traversé 12 routeurs au retour.',
    w:'Sur le poste Windows, <code>ping</code> affiche « TTL=52 » : en retranchant 52 à 64 (valeur de départ probable), on devine la distance.'},
   {t:'TTL = 1 : la box détruit le paquet',
    what:'Le <b>TTL</b> (Time To Live) est un compteur placé dans l’en-tête IP. Chaque routeur le diminue de 1 ; s’il tombe à 0, le routeur détruit le paquet et prévient l’émetteur par un message ICMP « Time Exceeded » (type 11).',
    why:'Sans TTL, un paquet pris dans une boucle de routage tournerait indéfiniment. Avec lui, il finit toujours par disparaître.',
    look:'Le paquet meurt sur la box (bulle rouge). La box renvoie un message de type 11 : elle révèle ainsi sa propre adresse.',
    w:'Filtre <code>icmp.type == 11</code>. Le message d’erreur contient l’en-tête IP du paquet détruit.'},
   {t:'TTL = 2 : le routeur suivant répond',
    what:'Avec un TTL de 2, la box laisse passer le paquet (TTL ramené à 1). Mais le routeur du fournisseur le reçoit avec un TTL de 1 : il le détruit à son tour et se signale.',
    why:'En augmentant le TTL d’une unité à chaque essai, on fait « parler » les routeurs l’un après l’autre : c’est le principe du traceroute.',
    look:'Le message d’erreur remonte de 198.51.100.1 jusqu’au poste, en traversant la box : le NAT inverse réécrit sa destination.',
    w:'Les deux premières lignes d’un <code>tracert</code> correspondent exactement à ces deux messages.'},
   {t:'Traceroute : jusqu’à l’arrivée',
    what:'<code>tracert</code> automatise la démarche : TTL 1, 2, 3… jusqu’à ce que le serveur lui-même réponde. Ici, avec un TTL de 13, le paquet traverse les 12 routeurs et atteint le serveur, qui répond par un Echo Reply.',
    why:'Le traceroute permet de localiser un problème : il montre à partir de quel saut les paquets ne passent plus, ou deviennent lents.',
    look:'Le TTL arrive à 1 sur le serveur : avec 12, le dernier routeur aurait détruit le paquet.',
    w:'Si un saut affiche « * », le routeur ne répond pas à ICMP : ce n’est pas forcément une panne.'},
   {t:'Destination injoignable',
    what:'ICMP signale aussi des erreurs. Une application envoie un datagramme UDP vers le port 9999 ; le serveur n’y a aucun programme en écoute. Il répond « Destination unreachable — Port unreachable » (type 3, code 3).',
    why:'En UDP, il n’y a pas de connexion pour refuser proprement : ICMP sert de messager pour prévenir que personne n’écoute.',
    look:'Le premier paquet est en UDP (vert-bleu), la réponse en ICMP (orange sombre) : deux protocoles différents dans un même échange.',

  ],pk:b.pk};

 D.UDP={name:'UDP',full:'User Datagram Protocol',scene:{layout:'wan1',sub:'none',nodes:{srv:{name:'Serveur multimédia',ip:'203.0.113.20'}}},

 D.TCP={name:'TCP',full:'Transmission Control Protocol',scene:{layout:'wan1',sub:'fl',nodes:{srv:{name:'Serveur web',ip:'203.0.113.10'}}},
  goal:'TCP fournit une liaison fiable entre deux programmes : les données arrivent complètes, dans l’ordre et sans doublon, même si le réseau en dessous perd ou mélange des paquets.',
  analogy:'TCP est un courrier recommandé avec accusé de réception. Chaque lettre est numérotée, le destinataire confirme ce qu’il a reçu, et l’expéditeur renvoie ce qui manque. Avant d’écrire, on prévient d’abord (la poignée de main).',
  prereq:['IP','UDP'],
  facts:[['Couche OSI','4 — Transport'],['Connexion','Oui : ouverture en 3 temps, fermeture en 4'],['Fiabilité','Numéros de séquence, accusés, retransmission'],['Contrôle','Fenêtre : le récepteur règle le débit'],['En-tête','20 octets minimum'],['Norme','RFC 9293']],
  words:[['SYN','demande d’ouverture de connexion'],['ACK','accusé de réception'],['FIN','demande de fermeture'],['Numéro de séquence','position du premier octet envoyé'],['Retransmission','nouvel envoi d’un segment perdu'],['SACK','accusé sélectif : « j’ai reçu aussi ceci »'],['Port éphémère','port temporaire choisi par le client (ex. 49152)']],
  steps:[
   {t:'Ouvrir la connexion (3 temps)',what:'Avant d’échanger des données, les deux extrémités se mettent d’accord : le client envoie <b>SYN</b>, le serveur répond <b>SYN-ACK</b>, le client termine par <b>ACK</b>. Chacun annonce au passage son numéro de séquence de départ.',why:'Cette « poignée de main » vérifie que l’autre répond et synchronise les compteurs qui serviront à numéroter chaque octet.',look:'Sous chaque paquet, le drapeau change : SYN, SYN, ACK, ACK. Aucune donnée n’a encore circulé.',w:'Filtre <code>tcp.flags.syn == 1</code>. Wireshark affiche des numéros « relatifs » (le premier est 0).'},
   {t:'Envoyer des données',what:'Le client envoie 78 octets. TCP numérote chaque octet : ces données portent les numéros 1 à 78. Le serveur répond par un ACK dont le numéro, 79, indique le prochain octet qu’il attend.',why:'Le numéro d’accusé est une promesse : « tout ce qui précède est bien arrivé ». S’il n’arrive pas, l’émetteur sait qu’il doit renvoyer.',look:'Cliquez sur le paquet pour comparer « N° de séquence » et « N° d’accusé » : l’un compte ce qu’on envoie, l’autre ce qu’on a reçu.',w:'Colonne « Len » : nombre d’octets de données. Seq + Len = prochain Seq de l’émetteur.'},
   {t:'Deux segments, un se perd',what:'Le serveur découpe sa réponse en deux segments de 1460 octets. Le premier disparaît dans Internet ; le second arrive, mais le poste ne peut pas encore l’utiliser car il manque le début.',why:'Un segment de 1460 octets est la taille maximale d’un paquet Ethernet moins les en-têtes IP et TCP (MSS). Au-delà, les données sont découpées.',look:'Le premier segment rougit dans Internet. Le second arrive jusqu’au poste.',w:'Filtre <code>tcp.analysis.retransmission || tcp.analysis.lost_segment</code> pour repérer les anomalies.'},
   {t:'Un trou est repéré',what:'En recevant les octets 1461 à 2920 sans avoir reçu 1 à 1460, le poste répond par un ACK « en double » : le numéro d’accusé reste 1 (il attend toujours ce début), accompagné d’un bloc <b>SACK</b> qui annonce ce qu’il a déjà.',why:'Grâce au SACK, le serveur sait précisément quoi renvoyer, sans retransmettre ce qui est déjà arrivé.',look:'Le numéro d’accusé n’a pas avancé : c’est le signe d’un trou.',w:'Filtre <code>tcp.options.sack</code>. Trois ACK dupliqués déclenchent normalement la retransmission rapide.'},
   {t:'Renvoyer le trou',what:'Le serveur renvoie seulement les octets manquants (1 à 1460), marqués « TCP Retransmission » par Wireshark. Le poste peut alors reconstituer le tout et accuse réception jusqu’à l’octet 2920.',why:'La fiabilité de TCP vient de cette boucle : numéroter, accuser réception, renvoyer ce qui manque. L’application ne voit jamais la perte.',look:'Le numéro de séquence du paquet est revenu à 1 : c’est bien une retransmission.',w:'Une retransmission se repère à un Seq déjà vu. Beaucoup de retransmissions = lien saturé ou perte de paquets.'},
   {t:'Fermer la connexion',what:'Chaque sens se ferme séparément : le poste envoie <b>FIN</b>, le serveur répond <b>ACK</b>, puis envoie son propre <b>FIN</b>, que le poste confirme. La connexion disparaît des deux côtés.',why:'Fermer proprement garantit que toutes les données ont été reçues. Une fermeture brutale utilise un paquet RST à la place.',look:'Quatre paquets pour fermer, trois pour ouvrir : chaque FIN consomme un numéro de séquence.',w:'Filtre <code>tcp.flags.fin == 1 || tcp.flags.reset == 1</code>.'}
  ],pk:b.pk};
})();

 D.SSH={name:'SSH',full:'Secure Shell',scene:{layout:'wan1',sub:'none',nodes:{srv:{name:'server.example.com',ip:'203.0.113.22'}}},
  goal:'SSH ouvre une session d’administration à distance dans un tunnel chiffré et authentifié. Il a remplacé Telnet, qui envoyait tout en clair, y compris les mots de passe.',
  analogy:'SSH, c’est un tunnel blindé creusé entre deux bureaux. Avant d’y circuler, on vérifie la plaque du bureau d’en face (clé d’hôte), puis on prouve qui l’on est avec une clé que l’on ne montre jamais.',
  prereq:['TCP'],
  facts:[['Couche OSI','7 — Application'],['Transport','TCP, port 22'],['Authentification','Mot de passe ou paire de clés'],['Garanties','Confidentialité, intégrité, identité du serveur'],['Autres usages','Transfert de fichiers (SFTP, SCP), tunnels'],['Norme','RFC 4253 (+ RFC 4252, RFC 4254)']],
  words:[['Clé d’hôte','identifie le serveur ; mémorisée dans known_hosts'],['Clé publique / privée','la publique se partage, la privée reste secrète'],['authorized_keys','liste des clés publiques autorisées sur le serveur'],['Canal','flux logique dans la connexion (terminal, transfert…)'],['KEXINIT','message qui liste les algorithmes proposés']],
  steps:[
   {t:'Dire bonjour',what:'Après la poignée de main TCP, chaque côté annonce, en clair, sa version de SSH. C’est le seul moment où l’on peut lire quelque chose dans la connexion.',why:'Les deux parties doivent d’abord s’assurer qu’elles parlent la même version du protocole.',look:'Seuls ces deux paquets (bannières) restent lisibles. Tout ce qui suit sera chiffré.',w:'Filtre <code>ssh</code>. La bannière révèle souvent le logiciel et sa version : utile à un attaquant comme à un audit.'},
   {t:'Négocier les algorithmes',what:'Chaque côté envoie un message <b>KEXINIT</b> listant, par ordre de préférence, les algorithmes d’échange de clés, de chiffrement et d’intégrité qu’il accepte. Pour chaque catégorie, le premier choix commun l’emporte.',why:'SSH évolue : de nouveaux algorithmes apparaissent et d’anciens deviennent dangereux. La négociation permet à des versions différentes de rester compatibles.',look:'Deux gros paquets : ce sont des listes, pas encore de clés.',w:'Désactiver les algorithmes faibles se fait côté serveur (sshd_config) : la négociation garantit qu’ils ne seront plus choisis.'},
   {t:'Échange de clés',what:'Les deux parties s’envoient chacune une moitié de clé éphémère et calculent le même secret sans qu’il circule. Le serveur ajoute sa <b>clé d’hôte</b> et une signature. Le client compare cette clé à celles qu’il connaît (known_hosts).',why:'Cette vérification protège contre l’usurpation : si la clé change sans raison, SSH alerte l’utilisateur. C’est le fameux message « host identification has changed ».',look:'Après « New Keys », le tunnel est chiffré : les paquets suivants ne sont plus lisibles.',w:'À la première connexion, SSH affiche l’empreinte de la clé d’hôte : elle doit être vérifiée par un autre canal.'},
   {t:'Se connecter avec une clé',what:'Dans le tunnel, le client demande le service d’authentification, puis propose sa <b>clé publique</b>. Si le serveur la connaît, le client prouve qu’il possède la clé privée correspondante en signant l’identifiant de session.',why:'Aucun secret n’est transmis : même si quelqu’un enregistrait la conversation, il ne pourrait pas rejouer la signature. C’est bien plus sûr qu’un mot de passe.',look:'Huit paquets chiffrés, tous marqués d’un cadre « Chiffré » : le détail est visible ici uniquement parce que le simulateur connaît les clés.',w:'Pour diagnostiquer un refus de clé, utiliser <code>ssh -v</code> côté client et le journal d’authentification (auth.log) côté serveur.'},
   {t:'Ouvrir une session',what:'SSH peut faire passer plusieurs flux dans une seule connexion TCP : chacun est un <b>canal</b>. Le client ouvre un canal de type « session » pour obtenir un terminal.',why:'Les canaux permettent d’ouvrir un terminal, transférer des fichiers ou créer un tunnel sans refaire l’authentification.',look:'Un aller-retour suffit : le terminal est prêt.',w:'Les canaux multiples expliquent qu’une capture SSH montre une seule connexion TCP, même pour plusieurs usages.'},
   {t:'Taper une commande',what:'Chaque touche tapée est envoyée dans un petit paquet chiffré et le serveur renvoie l’écho de ce qui doit s’afficher. À la touche Entrée, la commande s’exécute et le résultat revient.',why:'Un terminal distant fonctionne caractère par caractère : c’est pourquoi une session SSH génère beaucoup de petits paquets.',look:'Les paquets font tous la même taille : sans pouvoir lire leur contenu, on peut deviner qu’on est en train de taper.',w:'Même chiffrés, les rythmes de frappe sont observables : une raison de limiter l’exposition de SSH.'}
  ],pk:b.pk};
})();

 if(S.hop===0||J.bc)msg.push(J.bc?'Trame de diffusion : destination MAC « ff:ff:ff:ff:ff:ff », reçue par tous les équipements du réseau local.':'Le paquet vient d’être émis par '+nm(hop.a)+'.');
 else{
  if(c.includes('eth'))msg.push('Nouvelle trame Ethernet : les adresses MAC changent à chaque saut, car une trame ne vit que sur un seul lien.');
  if(c.includes('ttl'))msg.push('Le TTL a diminué : chaque routeur traversé le décrémente.');
  if(c.includes('ipsrc')||c.includes('ipdst')||c.includes('sp')||c.includes('dp'))msg.push('NAT : la box a réécrit '+(c.includes('ipsrc')||c.includes('ipdst')?'l’adresse IP':'')+((c.includes('ipsrc')||c.includes('ipdst'))&&(c.includes('sp')||c.includes('dp'))?' et ':'')+(c.includes('sp')||c.includes('dp')?'le port':'')+' pour qu’Internet puisse répondre.');
  if(!msg.length)msg.push('Aucun champ modifié sur ce lien : un switch retransmet la trame telle quelle.');
 }
 wrap.appendChild(h('div.chg'+(c.length||S.hop===0?'':'.nil'),msg.join(' ')));
 const ch=k=>c.includes(k);
 const imp=(v,two)=>two?det:true;
 const e=hop.eth,l4=hop.l4,ip=hop.ip;
 /* couche applicative */
 let app=null;
 const ak=KINDS[pk.kd][1];
 if(pk.app&&pk.app.enc){
  app=layer(pk.app.name||pk.proto,'données applicatives chiffrées',ak,[],null,h('div.lock','Chiffré — seuls les deux extrémités peuvent lire ce contenu. Wireshark n’affiche que « '+(pk.app.name||pk.proto)+' ».'));
  if(pk.app.lines&&pk.app.lines.length&&det)app.appendChild(h('div.mono.muted.small',{style:{marginTop:'4px'}},'Ce que contient le message avant chiffrement : '+pk.app.lines.join(' ⏎ ')));
 }else if(pk.app&&pk.app.lines){
  app=layer(pk.app.name||pk.proto,'données applicatives, lisibles par n’importe qui sur le trajet',ak,[],null,h('div.payload',pk.app.lines.join('\n')));
 }else if(!(l4&&l4.k==='arp')&&pk.proto!=='TCP'&&pk.proto!=='UDP'&&pk.proto!=='ICMP'){
  app=layer(pk.proto,'message applicatif',ak,[fd('Contenu',pk.info,{key:1,c:ak})]);
 }
 /* transport */
 let tr=null;
 if(l4&&l4.k==='tcp'){
  const f=[fd('Port source',l4.sp,{ch:ch('sp'),key:1,c:'var(--k-tcp)'}),fd('Port destination',l4.dp,{ch:ch('dp'),key:1,c:'var(--k-tcp)'}),fd('Drapeaux',l4.fl,{key:1,c:'var(--k-tcp)'})];
  if(det||S.key==='TCP'){f.push(fd('N° de séquence',l4.seq));if(l4.fl.indexOf('ACK')>=0)f.push(fd('N° d’accusé',l4.ack));f.push(fd('Données',l4.len+' o'));if(l4.sack)f.push(fd('SACK (reçu hors ordre)',l4.sack,{key:1,c:'var(--k-tcp)'}))}
  tr=layer('TCP','couche 4 · transport fiable','var(--k-tcp)',f,app);
 }else if(l4&&l4.k==='udp'){
  const f=[fd('Port source',l4.sp,{ch:ch('sp'),key:1}),fd('Port destination',l4.dp,{ch:ch('dp'),key:1})];if(det)f.push(fd('Longueur',(l4.len+8)+' o'));
  tr=layer('UDP','couche 4 · sans connexion','var(--k-udp)',f,app);
 }else if(l4&&l4.k==='icmp'){
  const f=[fd('Type',l4.type+(l4.label?' ('+l4.label+')':''),{key:1}),fd('Code',l4.code)];if(l4.id!=null&&det){f.push(fd('Identifiant','0x'+l4.id.toString(16).padStart(4,'0')));f.push(fd('N° de séquence',l4.seq))}
  tr=layer('ICMP','couche 3 · messages de contrôle','var(--k-net)',f,app);
 }else if(l4&&l4.k==='arp'){
  tr=layer('ARP','résolution d’adresse','var(--k-net)',[fd('Opération',l4.op==='request'?'Requête (qui a… ?)':'Réponse (c’est moi)',{key:1}),fd('Adresse IP cherchée',l4.tpa,{key:1}),fd('Émetteur',l4.spa+' / '+l4.sha),det||l4.op==='reply'?fd('Cible',(l4.tha||'00:00:00:00:00:00')+' / '+l4.tpa):null].filter(Boolean),app);
 }else tr=app;
 let net=tr;
 if(ip){
  const f=[fd('IP source',ip.src,{ch:ch('ipsrc'),key:1,c:'var(--k-net)'}),fd('IP destination',ip.dst,{ch:ch('ipdst'),key:1,c:'var(--k-net)'}),fd('TTL',ip.ttl,{ch:ch('ttl'),key:key,c:'var(--k-net)'})];
  if(det)f.push(fd('Protocole',ip.proto||'?'));
  if(!key&&!det)f.pop();
  net=layer('IPv4','couche 3 · adresses logiques','var(--k-net)',f,tr);
 }
 const ef=[fd('MAC source',e.src,{ch:ch('eth'),key:1,c:'#64748b'}),fd('MAC destination',e.dst,{ch:ch('eth'),key:1,c:'#64748b'})];
 if(det)ef.push(fd('Type',e.type));
 const eth=layer('Ethernet','couche 2 · adresses physiques (MAC)','#64748b',ef,net);
 wrap.appendChild(h('div.enc',eth));
 if(pk.note)wrap.appendChild(h('div.chg.nil',{html:pk.note}));
 box.appendChild(wrap);
}

/* ====================== PANNEAU DE DROITE ====================== */
function renderRight(){
 $$('.rtab').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
 const root=$('#rpane');root.innerHTML='';
 const p=cur(),dn=S.done.includes(S.key);
 root.appendChild(h('div.ph',h('div',{style:{flex:1}},h('h2',p.name),h('div.fn',p.full)),h('span.pill'+(dn?'.g':''),dn?'Terminé':S.seen.includes(S.key)?'En cours':'Nouveau')));
 if(S.tab==='step')tabStep(root);else if(S.tab==='sheet')tabSheet(root);else if(S.tab==='lab')tabLab(root);else tabQuiz(root);
}
function tabStep(root){
 const p=cur(),st=p.steps[stepOf()],pk=curPk(),c=pk?KINDS[pk.kd][1]:'var(--brand)';
 const card=h('section.sc',{style:{'--c':c},'aria-live':'polite'},h('div.eb','Étape '+(stepOf()+1)+' sur '+p.steps.length),h('h3',st.t),h('p',{html:st.what}));
 if(st.why){card.appendChild(h('span.lab','Pourquoi ?'));card.appendChild(h('p',{html:st.why}))}
 if(st.look)card.appendChild(h('div.look',h('span.lab','À observer dans l’animation'),h('span',{html:st.look})));
 root.appendChild(card);
 if(st.extra)root.appendChild(h('div.now',{html:st.extra}));
 if(pk){
  const now=h('div.now',h('span.lab','Ce paquet · n°'+(pk.n+1)+' sur '+p.pk.length),h('div',{html:pk.cap||esc(pk.info)}));
  if(pk.t>=0&&S.lvl==='sisr')now.appendChild(h('div.mono.small.muted',{style:{marginTop:'4px'}},'Wireshark : '+pk.proto+' · '+pk.info));
  root.appendChild(now);
 }
 if(S.lvl==='sisr'&&st.w)root.appendChild(h('div.callout',h('b','Dans Wireshark — '),h('span',{html:st.w})));
 const k=S.u,last=k>=UN.length-1;
 const row=h('div.nextp');
 if(last){
  const lv=LEVELS[S.lvl].list,ni=lv.indexOf(S.key)+1,nk=lv[ni];
  const order=ROUTE.filter(x=>lv.includes(x)),nx=order[order.indexOf(S.key)+1];
  row.appendChild(h('span','Parcours terminé. ',nx?'Suite conseillée : ':'Dernier protocole du parcours.',nx?h('b',D[nx].name):null));
  if(nx)row.appendChild(h('button.primary',{onclick:()=>select(nx)},'Ouvrir →'));else row.appendChild(h('button',{onclick:()=>{S.tab='quiz';renderRight()}},'Faire le quiz'));
 }else{
  row.appendChild(h('span.muted','Utilisez ← → ou les boutons de lecture.'));
  row.appendChild(h('button.primary',{onclick:next},'Suivant →'));
 }
 root.appendChild(row);
}
function tabSheet(root){
 const p=cur();
 root.appendChild(h('div.ana',h('b','Pour comprendre avec une image'),h('span',{html:p.analogy})));
 root.appendChild(h('p',{html:p.goal}));
 root.appendChild(h('dl.kv',p.facts.map(([k,v])=>[h('dt',k),h('dd',v)])));
 if(p.prereq&&p.prereq.length)root.appendChild(h('p.small',h('b','À connaître avant : '),p.prereq.map((k,i)=>[i?', ':'',D[k]?h('a',{href:'#',onclick:e=>{e.preventDefault();select(k)}},k):k])));
 root.appendChild(h('h4',{style:{margin:'12px 0 4px'}},'Vocabulaire'));
 root.appendChild(h('dl.wd',p.words.map(([k,v])=>h('div',h('dt',k),h('dd','— '+v)))));
}
function cmdRow(c){return h('div.cmd',h('span',c),h('button',{onclick:()=>{(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>toast('Copié : '+c),()=>toast('Copie impossible ici : sélectionnez le texte'))}},'Copier'))}
function tabLab(root){
 const ped=PED[S.key][S.lvl];
 if(S.lvl==='ciel'){
  root.appendChild(h('div.lvl',h('div.lt','Bac pro CIEL · L’essentiel'),h('div.lb',h('p',ped.e),h('h4','À retenir'),h('ul',ped.r.map(x=>h('li',x))),h('h4','À tester en atelier'),ped.c.map(cmdRow))));
 }else{
  root.appendChild(h('div.lvl',h('div.lt','BTS SIO SISR · Analyse et diagnostic'),h('div.lb',h('h4','Filtre d’affichage Wireshark'),cmdRow(ped.w),h('h4','Commandes utiles'),ped.c.map(cmdRow),h('div.callout',h('b','Cas d’atelier — '),ped.p[0],h('br'),ped.p[1]),h('div.callout.sec',h('b','Sécurité — '),ped.s))));
 }
}
function quizList(){const q=PED[S.key][S.lvl].q;return Array.isArray(q[0])?q:[q]}
function tabQuiz(root){
 const L=quizList(),i=clamp(S.qIdx,0,L.length-1),q=L[i],id=S.key+'|'+S.lvl+'|'+i,ok=S.quiz.includes(id);
 const box=h('section.quiz.sc',{style:{'--c':'var(--brand)'}},h('div.eb','Vérification '+(i+1)+' / '+L.length+(ok?' · réussie':'')),h('div.q',q[0]));
 const opts=h('div.opts');
 S.qOrd.slice(0,q[1].length).forEach((oi,pos)=>{
  const right=oi===q[2],picked=S.qAns===oi;let cls='';if(S.qAns!==null){if(right)cls='.ok';else if(picked)cls='.ko'}
  opts.appendChild(h('button.opt'+cls,{disabled:S.qAns!==null,onclick:()=>{S.qAns=oi;if(right&&!S.quiz.includes(id)){S.quiz.push(id);LS.set('pl-quiz',S.quiz)}renderRight()}},h('span.l','ABC'[pos]),h('span',q[1][oi])));
 });
 box.appendChild(opts);
 const fb=h('div.fb',{'aria-live':'polite'});
 if(S.qAns!==null){const g=S.qAns===q[2];fb.appendChild(h('b'+(g?'.g':'.r'),g?'Exact. ':'Pas tout à fait. '));fb.appendChild(document.createTextNode(q[3]));
  const bar=h('div',{style:{marginTop:'8px',display:'flex',gap:'6px'}});
  if(!g)bar.appendChild(h('button',{onclick:()=>{shuffleQ();renderRight()}},'Réessayer'));
  if(i<L.length-1)bar.appendChild(h('button.primary',{onclick:()=>{S.qIdx=i+1;shuffleQ();renderRight()}},'Question suivante'));
  fb.appendChild(bar);}
 box.appendChild(fb);root.appendChild(box);
}

/* ====================== ÉVÉNEMENTS ET DÉMARRAGE ====================== */
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);LS.set('pl-theme',t);$('#themeBtn').textContent=t==='dark'?'Thème clair':'Thème sombre'}
function boot(){
 for(const l in LEVELS)LEVELS[l].list=LEVELS[l].list.filter(k=>D[k]);
 if(!LEVELS[S.lvl].list.includes(S.key))S.key=LEVELS[S.lvl].list[0];
 const t=S.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');applyTheme(t);
 document.body.classList.toggle('projector',S.proj);$('#optProj').checked=S.proj;
 $('#lvl').value=S.lvl;
 $('#lvl').onchange=e=>{S.playing=false;S.lvl=e.target.value;LS.set('pl-lvl',S.lvl);S.detail=null;const lv=LEVELS[S.lvl].list;if(!lv.includes(S.key))S.key=lv[0];select(S.key)};
 $('#themeBtn').onclick=()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
 $('#optProj').onchange=e=>{S.proj=e.target.checked;LS.set('pl-proj',S.proj);document.body.classList.toggle('projector',S.proj)};
 $('#helpBtn').onclick=helpModal;$('#licBtn').onclick=licModal;$('#mclose').onclick=closeModal;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
 $('#menuBtn').onclick=()=>document.body.classList.toggle('nav-open');
 $('#search').oninput=e=>{S.q=e.target.value;renderPalette()};
 $$('.ordbtn').forEach(b=>b.onclick=()=>{S.order=b.dataset.o;LS.set('pl-order',S.order);renderPalette()});
 $('#play').onclick=play;$('#next').onclick=next;$('#prev').onclick=prev;
 $('#restart').onclick=()=>{S.playing=false;finishAnim();go(0);renderXport()};
 $('#speed').onclick=()=>{S.speed=S.speed===1?2:S.speed===2?.5:1;renderXport()};
 $$('.rtab').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;renderRight()});
 $$('#vtog button').forEach(b=>b.onclick=()=>setView(b.dataset.v));addEventListener('resize',renderSeq);
 $$('.dtab').forEach(b=>b.onclick=()=>{S.dock=b.dataset.d;renderDock()});
 $('#resetAll').onclick=()=>{if(!boot.arm){boot.arm=1;$('#resetAll').textContent='Confirmer ?';setTimeout(()=>{boot.arm=0;$('#resetAll').textContent='Réinitialiser la progression'},3000);return}boot.arm=0;S.done=[];S.seen=[];S.quiz=[];LS.set('pl-done',[]);LS.set('pl-seen',[]);LS.set('pl-quiz',[]);$('#resetAll').textContent='Réinitialiser la progression';renderPalette();renderRight();toast('Progression réinitialisée')};
 /* poignée de redimensionnement du dock */
 const grip=$('#grip');let dy=0,h0=0;
 grip.onpointerdown=e=>{dy=e.clientY;h0=$('#dock').offsetHeight;grip.setPointerCapture(e.pointerId);grip.onpointermove=m=>{$('#dock').style.setProperty('--dockh',clamp(h0+(dy-m.clientY),150,Math.round(innerHeight*.7))+'px')};grip.onpointerup=()=>{grip.onpointermove=null}};
 addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const t=e.target,typing=t.matches&&t.matches('input,select,textarea');
  if(e.key==='/'&&!typing){e.preventDefault();document.body.classList.add('nav-open');$('#search').focus();return}
  if(typing){if(e.key==='Escape')t.blur();return}
  if(e.key==='Escape'){closeModal();document.body.classList.remove('nav-open');return}
  const onBtn=t.closest&&t.closest('button,a,summary');
  if(e.key===' '&&!onBtn){e.preventDefault();play()}
  else if(e.key==='ArrowRight'){e.preventDefault();next()}
  else if(e.key==='ArrowLeft'){e.preventDefault();prev()}
  else if(e.key==='ArrowDown'){e.preventDefault();goStep(stepOf()+1)}
  else if(e.key==='ArrowUp'){e.preventDefault();goStep(stepOf()-1)}
  else if(e.key==='t'||e.key==='T')$('#themeBtn').click();
  else if(e.key==='?')helpModal();
 });
 prepare();drawScene();renderPalette();renderLegend();renderHint();shuffleQ();
 go(0,{instant:true});
 if(S.view==='seq')setView('seq');
}


boot();
